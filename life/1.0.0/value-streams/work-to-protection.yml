kind: value-stream
slug: work-to-protection
title: Guarding One's Own Work
family: proposition-to-audience
summary: Keeping the right to one's own work — and deciding deliberately what is released to the commons rather than losing it by
  default.
trigger: The person finds their work copied, used without credit or claimed by a contract they barely read, or they are about to publish
  and have not decided what to release.
outcome: The person holds the rights they meant to keep, and what went to the commons went there by choice.
stakeholders:
- collaborator
- client
- audience
- authority
- community
