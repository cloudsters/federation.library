kind: entity
slug: land-use-right
title: Land Use Right
type: master
summary: A right to use land held by the city, a trust or a kinship body, with its holder, its obligations and the rules by which
  it passes to a successor. It is recorded beside the land registry with those who witnessed each transfer, and it is used to pass
  the right at life events with the claims of women and widows protected.
