kind: entity
slug: commons-fund
title: Commons Fund
type: master
summary: The ring-fenced fund into which commons-generated value flows, such as captured land value, asset income, enterprise surplus
  and the share of taxes the council assigns, held apart from the general budget and kept in value over time. The treasury accounts
  for it apart from general revenue under the fund rules, and neighbourhood bodies allocate their share of it with residents.
