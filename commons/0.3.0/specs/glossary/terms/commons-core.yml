id: commons-core
term: Commons CORE
layer: why
kind: concept
definition: 'What a commons'' repository holds: its models, which give orientation and shape the future.'
why: 'Its models are the cybernetic models of its shared value creation, the runtime among them. The value creation is regulated,
  not the people. Its guiding sentence: "The model''s present is its last commit — and the model holds the near future."
  It guides the work, which always works on the near future, and is no claim about reality: comparing commits shows how
  the model changed, not how reality drifted (commons.o#91, comment 6470680520). Since structure 0.4.0 a CORE holds models
  in models/, the runtime among them (commons.o#109, comment 6599561846); the repository that holds it is its instance.'
relations:
  is_a: component
  held_in: instance
  worked_on_in: model-workshop
status: accepted
decided:
