kind: stakeholder
slug: community-media-producer
title: Community Media Producer
nature: person
stance: serving
summary: A resident who runs, reports for or records for a neighbourhood or community outlet, such as a newsletter, a radio station,
  a podcast or a message service. Community media producers report what matters locally in the languages their neighbours use.
seeks:
- Space, equipment and support that leave editorial decisions with the residents who run the outlet, and protection when the outlet
  criticises the city.
brings:
- Local reporting where outside media do not reach, stories told by those they concern, and the questions that hold the city to account.
represented_by:
- community-media-fund-panel
