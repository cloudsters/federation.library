kind: stakeholder
slug: community-health-worker
title: Community Health Worker
nature: person
stance: serving
summary: A resident trained and paid to teach neighbours about health and guide them through health services. Community health workers
  come from the neighbourhood they serve and speak its languages.
seeks:
- Training, fair pay, a recognised place beside clinics and pharmacies, and quick answers when they report a threat to health.
brings:
- Trust in the neighbourhood, health knowledge passed on in plain words, and early sight of illness and of those who do not reach
  care.
represented_by:
- public-health-office
