kind: entity
slug: tax-relief-decision
title: Tax Relief Decision
type: transactional
summary: A reduction, deferral, exemption or write-off granted to a taxpayer on published criteria, with its grounds, amount and duration,
  including the cap on charges for water, energy and transit as a share of household income. The revenue office decides it on request
  or on referral from arrears recovery, and it is applied to the taxpayer's account and open to appeal.
