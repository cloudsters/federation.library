kind: entity
slug: digital-service
title: Digital Service
type: master
summary: A service the city delivers to residents or its own staff through digital means, with its owner, the people it serves and
  the equal route it keeps for those who are offline. The owning department keeps its record in the city's list of services, and it
  is the unit against which levels are agreed, faults are reported and continuity is planned.
