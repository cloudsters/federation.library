kind: entity
slug: cooperative
title: Cooperative
type: master
summary: A cooperative owned by its resident or worker members for housing, energy, food, water or credit, including a cooperative
  credit institution the city may put equity into. The cooperative keeps its own records, and the city holds this record to track
  the reduced rents and rates, deposits, equity and grants that pass between them.
