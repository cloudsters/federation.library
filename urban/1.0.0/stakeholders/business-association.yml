kind: stakeholder
slug: business-association
title: Business Association
nature: organisation
stance: served
summary: A body through which the traders, firms or makers of a sector, street or district speak and act together. Business associations
  run networks, partnerships of shopping streets and the shared marks of a place or craft.
seeks:
- A say in the city's economic priorities, support to convene their members, and rules for shared marks and districts that no single
  member can capture.
brings:
- Their members' knowledge of the local economy, pooled money and work for shared spaces, and peer review of quality.
represented_by:
- local-economy-committee
