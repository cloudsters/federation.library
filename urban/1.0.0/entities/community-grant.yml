kind: entity
slug: community-grant
title: Community Grant
type: transactional
summary: A multi-year grant the city gives to a neighbourhood association or civil-society organisation on published criteria, with
  its purpose, term and light reporting. The department responsible awards and pays it, and its terms keep the body answerable to
  the people it serves rather than to the city's funding.
