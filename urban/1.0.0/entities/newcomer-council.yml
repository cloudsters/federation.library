kind: entity
slug: newcomer-council
title: Newcomer Council
type: master
summary: A body of newcomers that advises on and helps steer how the city receives them, with its members, mandate and the matters
  on which it is heard. Its secretary keeps the record together with the administration, and it is used to hear newcomers on the integration
  plan, housing and services, including those who cannot yet vote.
