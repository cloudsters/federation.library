kind: entity
slug: contract-performance-report
title: Contract Performance Report
type: intelligence
summary: The regular account of a contract's delivery, quality, service levels and fair-work, social and ecological commitments against
  what was promised, with the view of its users and the findings of resident inspection. The contract manager compiles it each month
  or quarter from the supplier's data and with workers and communities, and it is used in variations, remedies, supplier reviews and
  the decision to renew or exit.
