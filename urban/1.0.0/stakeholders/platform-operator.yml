kind: stakeholder
slug: platform-operator
title: Platform Operator
nature: organisation
stance: serving
summary: A company or cooperative that runs a digital platform through which residents order services or find work in the city. Platform
  operators use the city's streets and services and set the rules that allocate their workers' tasks.
seeks:
- A clear licence on the same terms for commercial and cooperative platforms, and predictable conditions on data and workers' voice.
brings:
- Services and work for residents, minimal data on users and workers, portable data and ratings, and a voice for workers in the rules
  that allocate their work.
