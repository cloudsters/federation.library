kind: entity
slug: risk-assessment
title: Risk Assessment
type: transactional
summary: An estimate of the likelihood that a patient will suffer a defined harm, such as a fall, pressure injury, thrombosis, delirium
  or deterioration, together with the preventive measures it triggers.
attributes:
- name: patient
  type: reference(patient)
  card: 1..1
- name: encounter
  type: reference(encounter)
  card: 0..1
- name: risk-kind
  type: code
  card: 1..1
- name: instrument
  type: reference(assessment-instrument)
  card: 0..1
- name: risk-level
  type: code
  card: 1..1
- name: probability
  type: decimal
  card: 0..1
- name: mitigation
  type: text
  card: 0..1
- name: assessed-at
  type: datetime
  card: 1..1
states:
- in-progress
- completed
- revised
relations:
- type: produces
  target: clinical-alert
binds:
- source: src-018
  edition: 4.0.1
  jurisdiction: global
- source: src-001
  edition: '2026'
  jurisdiction: global
- source: src-002
  edition: '2025'
  jurisdiction: global
- source: src-016
  edition: 2.3.0
  jurisdiction: global
- source: src-015
  edition: 1.1.0
  jurisdiction: global
