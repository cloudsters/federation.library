kind: entity
slug: vendor-licence
title: Vendor Licence
type: transactional
summary: The licence that gives a vendor standing and a pitch in a market or street, with its terms, fees and the protection it gives
  against removal. The markets service issues and records it, informal vendors included, and it is used to allocate pitches, to collect
  fees and to give vendors due process before any removal.
