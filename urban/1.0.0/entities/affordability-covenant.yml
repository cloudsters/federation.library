kind: entity
slug: affordability-covenant
title: Affordability Covenant
type: governance
summary: The restriction attached to a home that binds every successor to its affordable price and terms. The body that holds the
  home records it with the land registry, and it is used to set the price at each succession or resale and to keep the home affordable
  for those who follow.
