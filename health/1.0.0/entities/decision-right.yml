kind: entity
slug: decision-right
title: Decision Right
type: governance
summary: A documented right to decide on a defined matter up to a stated limit, held by a governance body or a position, delegated
  by the body that holds it originally and exercised under the conditions attached.
attributes:
- name: matter
  type: text
  card: 1..1
- name: holder-body
  type: reference(governance-body)
  card: 0..1
- name: holder-position
  type: reference(position)
  card: 0..1
- name: delegated-by
  type: reference(governance-body)
  card: 0..1
- name: limit
  type: amount
  card: 0..1
- name: conditions
  type: text
  card: 0..1
- name: valid-period
  type: period
  card: 0..1
states:
- proposed
- in-force
- suspended
- revoked
relations:
- type: governed-by
  target: charter
- type: based-on
  target: governance-decision
- type: assigned-to
  target: position
