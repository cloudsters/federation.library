# startup's family loop: corporate's loop of the same slug, its streams those of startup 
loop: _family.acquire-to-retire
title: Keep the family 'Acquire to Retire' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: acquire-to-retire
  vs:
  - asset-lifecycle-planning
stance: Steward the full lifecycle of the durable infrastructure / means of production. No single stream of this family can
  see what its streams do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed reporting period of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was activated, adapted or not selected in the registry
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/acquire-to-retire
  - value-model.yml#vs/asset-lifecycle-planning
  - value-model.yml#vs/asset-creation-design
  - value-model.yml#vs/asset-care-maintenance
  - value-model.yml#vs/asset-end-of-life-stewardship
  registry:
  - instance/registry/5_value-streams/asset-lifecycle-planning.md
  - instance/registry/5_value-streams/asset-creation-design.md
  - instance/registry/5_value-streams/asset-care-maintenance.md
  - instance/registry/5_value-streams/asset-end-of-life-stewardship.md
  loop_states:
  - instance/operations/loops/_state/asset-lifecycle-planning.yml
  - instance/operations/loops/_state/asset-creation-design.yml
  - instance/operations/loops/_state/asset-care-maintenance.yml
  - instance/operations/loops/_state/asset-end-of-life-stewardship.yml
  measures:
  - acceptance-defects-closed-within-ninety-days
  - acceptance-to-capitalisation-time
  - assets-commissioned-on-schedule-and-budget
  - assets-operating-beyond-renewal-date
  - assets-with-condition-and-renewal-date
  - build-site-injury-frequency
  - critical-asset-availability
  - data-bearing-devices-with-erasure-evidence
  - designs-reviewed-on-lifecycle-criteria
  - hazardous-consignments-with-full-chain-of-custody
  - investment-needs-with-a-lifecycle-business-case
  - maintenance-cost-share-of-replacement-value
  - mandatory-inspections-overdue
  - material-recovery-rate
  - operating-time-between-failures
  - planned-maintenance-completed-on-schedule
  - priority-renewals-funded-in-capital-planning
  - retired-assets-closed-in-the-register
  - retirements-following-an-exit-plan
  - time-to-restore-after-failure
  - value-recovered-from-surplus-assets
  - workplace-user-satisfaction
  - workspace-occupancy
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.acquire-to-retire.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never writes into
  the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided or passed
    to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or the commons declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
