kind: entity
slug: cooperative-platform
title: Cooperative Platform
type: master
summary: A digital platform for delivery, care, mobility or task matching that its workers and users own and govern, with its members
  and its code. The cooperative that owns it keeps the record and the city records the code, finance and licence it gives, and it
  is used to give such platforms fair access to public demand.
