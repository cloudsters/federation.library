kind: stakeholder
slug: city-council
title: City Council
nature: organisation
stance: serving
summary: The elected body that adopts the charter, takes the city's decisions and supervises the administration. It meets in public,
  forms committees and answers to residents at the next vote.
seeks:
- A clear mandate, sound evidence for each decision and an administration that carries out what it resolves.
brings:
- Binding decisions, the adoption of charter, bylaws and budget, and oversight of everything the municipality does in residents' name.
