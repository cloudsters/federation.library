kind: entity
slug: participation-review
title: Participation Review
type: intelligence
summary: The review of who took part and who did not, the burden participation placed on people, why they left and whether their input
  changed outcomes, with the changes agreed. Residents and the administration carry it out together, for involvement processes and
  for the city's volunteering offer, and the participation charter and later involvement plans are adjusted from it.
