- name: reporting-period
  type: period
  card: 1..1
- name: spending-reported
  type: amount
  card: 1..1
- name: payment-claimed
  type: amount
  card: 0..1
- name: results
  type: text
  card: 1..*
- name: deviations
  type: text
  card: 0..*
- name: evidence
  type: document
  card: 1..*
- name: submitted-on
  type: date
  card: 0..1
- name: accepted-on
  type: date
  card: 0..1
states:
- drafted
- checked
- submitted
- queried
- accepted
relations:
- type: refers-to
  target: grant-award
- type: based-on
  target: journal-entry
- type: based-on
  target: programme-report
