kind: stakeholder
slug: staff-representative
title: Staff Representative
nature: person
stance: serving
summary: A person or body elected to represent the municipality's staff, who must be informed and consulted on changes to work and
  technology. Staff representatives agree or refuse where their agreement is due.
seeks:
- Information in good time, consultation before decisions are taken and agreements the city keeps.
brings:
- The collective voice of staff, their agreement to changes in work and technology, and findings on how systems treat staff.
represented_by:
- staff-council
