kind: entity
slug: contract-variation
title: Contract Variation
type: transactional
summary: A change to the scope, price or term of a contract, or a remedy applied for a shortfall, with its reason, its value and the
  approval it received within what the contract allows. The contract manager records it after hearing the supplier and the legal office
  reviews it, and it is entered in the contract register and published with the contract.
