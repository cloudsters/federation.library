title: Digital Roadmap
type: governance
summary: The plan of which systems are built, replaced and retired, and when, with their whole-life cost and the programmes that carry
  them. The administration plans it from the strategy and the architecture and updates it each year, and its items are carried into
  the programme portfolio and the capital investment plan.
