kind: entity
slug: participation-charter
title: Participation Charter
type: governance
summary: The rules that state how and when residents and recognised community bodies take part in decisions, who is entitled to take
  part, and in which languages, places and forms. The council adopts it and reviews it openly when it excludes people, and every consultation,
  petition and election is run under it.
