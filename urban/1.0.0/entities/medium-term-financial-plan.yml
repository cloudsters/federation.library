kind: entity
slug: medium-term-financial-plan
title: Medium-Term Financial Plan
type: governance
summary: The plan of the city's income, spending, debt and reserves over several years, with the spending limit of each department,
  adopted by the council as the frame for each annual budget. The finance department projects it from the strategy and the city's
  financial health and rolls it forward each year, and grant-funded work that must last is moved into it before its grant ends.
