kind: value-stream
slug: credentialing-and-privileging
title: Credentialing and Privileging
family: contributor-to-succession
summary: 'Verifying that every clinician is licensed, qualified and competent for what they do: licensure and specialist recognition,
  recognition of foreign qualifications, and granting and renewing clinical privileges and scope of practice.'
trigger: A clinician is hired or requests new privileges, or a renewal falls due.
outcome: The clinician holds verified credentials and documented privileges that define what they may do.
stakeholders:
- specialist-physician
- surgeon
- advanced-practice-nurse
- head-of-clinical-department
- administrative-staff
- health-regulator
- professional-body
steps:
- slug: credentialing-request
  title: Credentialing Request
  summary: A new hire, a request for additional privileges or a renewal date opens a credentialing file that states the privileges
    requested and the evidence each of them requires.
  capabilities:
  - clinical-privileging
  - professional-registration-monitoring
  - employee-data-stewardship
  entities:
  - practitioner-role
  - clinical-privilege
  - employee
  serves:
  - privilege-application
- slug: primary-source-verification
  title: Primary Source Verification
  summary: Verify licence, specialist recognition, recognition of foreign qualifications and required credentials directly with the
    issuing bodies, and check for restrictions and disciplinary measures.
  capabilities:
  - licence-verification
  - specialist-qualification-verification
  - international-recruitment
  entities:
  - licence-to-practise
  - specialty-certification
  - credential
  serves:
  - professional-register
- slug: competence-evidence
  title: Competence Evidence
  summary: 'Assemble the evidence of competence for each privilege requested: training logbook, case volumes, outcomes, references
    and observed performance.'
  capabilities:
  - practitioner-performance-evaluation
  - competence-validation
  - training-logbook-management
  - clinical-outcome-tracking
  entities:
  - professional-practice-evaluation
  - logbook-entry
  - measure-report
  - credential
  serves:
  - privilege-application
  - training-logbook
- slug: privilege-review
  title: Privilege Review
  summary: The head of department and the credentials committee review the evidence against defined criteria for each privilege, including
    procedures new to the organisation, and recommend grant, conditions or refusal.
  capabilities:
  - clinical-privileging
  - clinical-governance-framework
  - new-procedure-introduction
  entities:
  - clinical-privilege
  - governance-body
  - governance-decision
  serves:
  - credentials-committee-meeting
- slug: privilege-grant
  title: Privilege Grant
  summary: Grant privileges in writing with scope, conditions, proctoring and validity, and make them effective in rosters, theatre
    scheduling, order entry and access rights.
  capabilities:
  - clinical-privileging
  - clinical-system-configuration
  - identity-access-management
  entities:
  - clinical-privilege
  - practitioner-role
  - access-grant
  serves:
  - privilege-statement
- slug: ongoing-monitoring
  title: Ongoing Monitoring
  summary: Between renewals, monitor registration status, credential expiry, continuing education credits and performance indicators,
    and act on adverse signals at once.
  capabilities:
  - professional-registration-monitoring
  - practitioner-performance-evaluation
  - continuing-education-credit-compliance
  - morbidity-and-mortality-review
  entities:
  - licence-to-practise
  - credential
  - continuing-education-credit
  - professional-practice-evaluation
  serves:
  - hr-self-service
  - professional-register
- slug: renewal-or-restriction
  title: Renewal or Restriction
  summary: At the end of the validity period or for cause, renew, extend, restrict, suspend or revoke privileges in a fair procedure,
    and notify the competent authority where the law requires it.
  capabilities:
  - clinical-privileging
  - practitioner-performance-evaluation
  - regulatory-reporting
  - legal-advisory
  entities:
  - clinical-privilege
  - governance-decision
  - practitioner-role
  serves:
  - credentials-committee-meeting
  - privilege-application
binds:
- source: src-018
  edition: 4.0.1
  jurisdiction: global
- source: src-020
  edition: '20.2'
  jurisdiction: global
- source: src-401
  edition: '2026'
  jurisdiction: global
