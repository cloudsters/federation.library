- name: reference-number
  type: identifier
  card: 1..1
- name: organiser
  type: text
  card: 1..1
- name: first-time-organiser
  type: boolean
  card: 0..1
- name: event-kind
  type: code
  card: 1..1
- name: description
  type: text
  card: 1..1
- name: proposed-period
  type: period
  card: 1..1
- name: proposed-places
  type: reference(public-space|park|street)
  card: 0..*
- name: expected-attendance
  type: integer
  card: 0..1
- name: communities-presented
  type: text
  card: 0..*
- name: service-demands
  type: text
  card: 0..*
- name: received-on
  type: date
  card: 1..1
- name: decision
  type: text
  card: 0..1
states:
