  card: 0..1
- name: stated-accuracy
  type: text
  card: 0..1
- name: update-rhythm
  type: code
  card: 1..1
- name: last-updated
  type: datetime
  card: 1..1
- name: published-as
  type: reference(open-data-release)
  card: 0..1
