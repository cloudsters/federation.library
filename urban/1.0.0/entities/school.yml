kind: entity
slug: school
title: School
type: master
summary: A primary or secondary school with its buildings and grounds, its pupils and families and the neighbourhood use it allows.
  The body that runs the school keeps the record, together with the city where it holds the buildings, and it is used to plan school
  places and to open rooms and grounds to neighbours.
