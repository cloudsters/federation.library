kind: entity
slug: regulatory-notification
title: Regulatory Notification
type: transactional
summary: A report the organisation must submit to a competent authority within a set deadline, such as on a serious event, a device
  incident, an adverse drug or transfusion reaction, a notifiable infection or a serious AI malfunction, followed up until closed.
