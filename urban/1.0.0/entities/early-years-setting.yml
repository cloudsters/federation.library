- name: name
  type: text
  card: 1..1
- name: setting-kind
  type: code
  card: 1..1
- name: run-by
  type: text
  card: 1..1
- name: building
  type: reference(building)
  card: 0..1
- name: neighbourhood
  type: reference(neighbourhood)
  card: 1..1
- name: places
  type: integer
  card: 1..1
- name: age-range
  type: text
  card: 1..1
- name: opening-hours
  type: text
  card: 1..*
- name: languages
  type: code
  card: 0..*
- name: charge
  type: amount
  card: 0..1
- name: shared-use
  type: reference(shared-use-agreement)
  card: 0..1
- name: registered-on
  type: date
  card: 0..1
