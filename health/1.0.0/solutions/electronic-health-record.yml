kind: solution
slug: electronic-health-record
title: Electronic Health Record
role: system-of-record
summary: 'Holds the longitudinal record of each patient: problems, diagnoses, allergies, alerts, care plans and goals, care
  team, immunisations, and the mandates and preferences care rests on. Replacing it touches every clinical journey and stream
  at once.'
