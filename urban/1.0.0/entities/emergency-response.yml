  card: 0..1
- name: warnings-issued
  type: text
  card: 0..*
- name: relief-by-neighbourhood
  type: document
  card: 0..1
- name: emergency-decisions
  type: reference(public-record)
  card: 0..*
- name: services-restored-on
  type: date
  card: 0..1
- name: ended-at
  type: datetime
  card: 0..1
