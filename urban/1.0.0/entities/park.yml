- name: land-parcels
  type: reference(land-parcel)
  card: 0..*
- name: area
  type: quantity
  card: 1..1
- name: condition
  type: code
  card: 0..1
- name: features
  type: text
  card: 0..*
- name: tree-count
  type: integer
  card: 0..1
- name: opening-hours
  type: text
  card: 0..1
- name: responsible-department
  type: reference(department)
  card: 1..1
- name: care-agreements
  type: reference(place-care-agreement)
  card: 0..*
states:
- planned
- open
- under-renewal
- partly-closed
- closed
relations:
