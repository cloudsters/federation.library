summary: A theatre, museum, orchestra, collective or other body that makes or presents culture. Some are run by the city, others are
  independent and rely on its support.
seeks:
- Stable support over several years, a recognised part in the culture plan, and the freedom to programme without being steered.
brings:
- Stages, collections and programmes that it can open to residents as makers and as partners in choosing what is shown.
