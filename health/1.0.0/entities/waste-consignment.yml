kind: entity
slug: waste-consignment
title: Waste Consignment
type: transactional
summary: One handover of separated waste from the organisation to a licensed carrier for treatment or disposal, recording the waste
  category, quantity, origin, carrier and destination, closed by proof of proper disposal.
