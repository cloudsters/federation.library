kind: entity
slug: collective-mark
title: Collective Mark
type: governance
summary: The name, mark and quality standards held in common by the producers of a place or craft, with the rules by which members
  are licensed to use them. The producers' body holds it and a practitioner committee sets and reviews the standards, and it is used
  to license members by open rules so that no single firm can own the name.
