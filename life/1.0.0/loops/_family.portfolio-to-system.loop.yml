loop: _family.portfolio-to-system
title: Keep the family 'Portfolio to System' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: portfolio-to-system
  vs:
  - tool-to-integration
  - record-to-memory
  - platform-to-sovereignty
  - agent-to-delegation
  - space-to-workshop
stance: Architect the whole as a coherent system-of-systems ("System" = the whole system incl. the value model,
  not just IT). No single stream of this family can see what its streams do to one another; this loop is where that
  becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed season of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was built into the runtime, adapted there, or left on the shelf
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/portfolio-to-system
  - value-model.yml#vs/tool-to-integration
  - value-model.yml#vs/record-to-memory
  - value-model.yml#vs/platform-to-sovereignty
  - value-model.yml#vs/agent-to-delegation
  - value-model.yml#vs/space-to-workshop
  registry:
  - instance/registry/5_value-streams/tool-to-integration.md
  - instance/registry/5_value-streams/record-to-memory.md
  - instance/registry/5_value-streams/platform-to-sovereignty.md
  - instance/registry/5_value-streams/agent-to-delegation.md
  - instance/registry/5_value-streams/space-to-workshop.md
  loop_states:
  - instance/operations/loops/_state/tool-to-integration.yml
  - instance/operations/loops/_state/record-to-memory.yml
  - instance/operations/loops/_state/platform-to-sovereignty.yml
  - instance/operations/loops/_state/agent-to-delegation.yml
  - instance/operations/loops/_state/space-to-workshop.yml
  measures:
  - archive-days-since-gathered
  - archive-kept-findable
  - archive-let-go-on-purpose
  - archive-way-in-left
  - delegation-agent-choices-checked
  - delegation-agents-with-stated-reach
  - delegation-hand-kept-in
  - delegation-surprised-by-an-agent
  - sovereignty-doors-tried
  - sovereignty-holders-named
  - sovereignty-hours-keeping-exits
  - sovereignty-working-way-out
  - tools-in-use
  - tools-setup-explained
  - tools-things-lost-between
  - tools-unused-accounts-closed
  - workshop-days-to-rearrange-after-move
  - workshop-planned-starts-made
  - workshop-shared-use-agreed
  - workshop-what-still-pulls-away
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.portfolio-to-system.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never
  writes into the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided
    or passed to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or this life declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
