kind: entity
slug: service-failure-report
title: Service Failure Report
type: transactional
summary: A report of a failure or near miss in a service, made by staff or a resident without fear of blame, with its grading by harm
  and urgency, its disclosure to those affected and its handling. The service records and grades it on receipt and follows it until
  it is closed, and serious or repeated failures go to cause analysis.
