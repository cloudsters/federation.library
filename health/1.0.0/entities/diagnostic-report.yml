kind: entity
slug: diagnostic-report
title: Diagnostic Report
type: transactional
summary: The interpreted result of a diagnostic service, whether laboratory, imaging, pathology, molecular or functional testing,
  combining observations, images and a conclusion released by a responsible professional.
attributes:
- name: patient
  type: reference(patient)
  card: 1..1
- name: report-category
  type: code
  card: 1..1
- name: clinical-orders
  type: reference(clinical-order)
  card: 1..*
- name: results
  type: reference(observation)
