kind: entity
slug: community-of-practice
title: Community of Practice
type: master
summary: A standing group of staff from different departments, and of partners outside the administration, who do similar work and
  meet regularly to share problems, failures and solutions. Its organisers keep its record of members, focus and meetings with support
  from the administration, and it is used to spread knowledge across departments and to test practice patterns.
