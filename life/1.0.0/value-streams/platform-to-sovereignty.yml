kind: value-stream
slug: platform-to-sovereignty
title: Who Holds the Ground
family: portfolio-to-system
summary: Whether the person owns the ground their life runs on or rents it from someone who can change the terms. Every platform is
  a landlord until an exit exists.
trigger: A service changes its terms, raises its price, locks an account or closes, and it becomes clear how much of the life was
  standing on it.
outcome: For everything the life depends on, the person knows who holds it and has a way out that works, so no landlord can take more
  than was agreed.
stakeholders:
- authority
- audience
- partner
- provider
steps:
