- discharge-readiness-assessment
- discharge-execution
- patient-discharge-education
- care-transition-coordination
- nursing-transfer-handover
- social-care-coordination
- readmission-prevention
- rehabilitation-needs-assessment
- rehabilitation-referral
- rehabilitation-provider-coordination
- interhospital-transfer
- post-discharge-follow-up
- clinical-social-work
holds:
- care-transition
- continuity-facilitator-mandate
binds:
- source: src-033
  edition: 3rd-2023
  jurisdiction: global
- source: src-034
  edition: '2023'
  jurisdiction: global
- source: src-032
  edition: '2020'
  jurisdiction: global
