kind: entity
slug: business-register
title: Business Register
type: master
summary: The record of the enterprises active in the city, by neighbourhood, sector and form of ownership, cooperatives and social
  enterprises included, kept from registrations, licences and the businesses' own reports. The economic development office keeps it,
  and it is used to see who starts and keeps businesses, to advise founders and to map and report the local and social economy.
