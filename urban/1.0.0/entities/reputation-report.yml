kind: entity
slug: reputation-report
title: Reputation Report
type: intelligence
summary: The regular report of what residents, local and outside media and online channels say about the city, by topic and neighbourhood,
  set beside what residents report of their own lives, with the gaps between the two named. The communications office prepares it,
  reviews it once a year with residents and neighbourhood bodies and presents it to the council, and it is used to correct the city's
  account and to reach those its information missed.
