kind: entity
slug: contract
title: Contract
type: transactional
summary: A contract, concession or long ground lease of public land that the city enters, with the obligations, guarantees and performance
  bonds written into it. The legal office reviews it for legality and fairness, and it is kept and published for as long as it binds
  the city.
