kind: entity
slug: partnership-compact
title: Partnership Compact
type: governance
summary: The agreement between the city and civil society on how the city consults and funds civil-society bodies, respects their
  independence and resolves disagreements, adopted by the council. The council adopts it with the civil-society bodies that sign it,
  and every consultation, grant and disagreement between them is tested against it.
