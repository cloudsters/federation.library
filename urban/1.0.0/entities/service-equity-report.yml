kind: entity
slug: service-equity-report
title: Service Equity Report
type: intelligence
summary: The yearly report of the level of each essential service and the share of income spent on it by neighbourhood and income,
  with the gaps named. The city compiles it from the service operators' records and reviews it with residents, and it directs investment
  and decides whether a tariff is renewed.
