kind: entity
slug: care-goal
title: Care Goal
type: transactional
summary: An intended outcome of care agreed for a patient, such as regained mobility, pain below a threshold or return home,
  with a target and a date against which the care plan is evaluated.
attributes:
- name: patient
  type: reference(patient)
  card: 1..1
- name: description
  type: text
  card: 1..1
- name: addresses
  type: reference(health-issue)
  card: 0..*
- name: target
  type: quantity
  card: 0..1
- name: due-date
  type: date
  card: 0..1
- name: agreed-with-patient
  type: boolean
  card: 1..1
- name: achievement
  type: code
  card: 0..1
states:
- proposed
- agreed
- active
- achieved
- not-achieved
- cancelled
relations:
- type: part-of
  target: care-plan
- type: based-on
  target: preference
binds:
- source: src-001
  edition: '2026'
  jurisdiction: global
- source: src-018
  edition: 4.0.1
  jurisdiction: global
- source: src-002
  edition: '2025'
  jurisdiction: global
- source: src-006
  edition: '2.83'
  jurisdiction: global
- source: src-016
  edition: 2.3.0
  jurisdiction: global
- source: src-015
  edition: 1.1.0
  jurisdiction: global
- source: src-004
