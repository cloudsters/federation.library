kind: stakeholder
slug: social-worker
title: Social Worker
nature: person
stance: serving
summary: A professional of the municipality or a partner who assesses residents' needs for care and support and coordinates the help
  they receive. Social workers join the work of health services, carers and neighbours around one person.
seeks:
- Time with each person, a care network that shares information and answers together, and services ready when a plan needs them.
brings:
- Assessment of needs, strengths and wishes, one plan across providers, and knowledge of where people fall between services.
represented_by:
- social-services-department
