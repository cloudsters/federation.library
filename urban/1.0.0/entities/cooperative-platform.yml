- name: name
  type: text
  card: 1..1
- name: service-kind
  type: code
  card: 1..*
- name: owner
  type: reference(cooperative)
  card: 1..1
- name: worker-members
  type: integer
  card: 0..1
- name: user-members
  type: integer
  card: 0..1
- name: governance-rules
  type: text
  card: 1..1
- name: code
  type: reference(source-code-repository)
  card: 0..1
- name: code-licence
  type: code
  card: 0..1
- name: licence
  type: reference(platform-licence)
  card: 0..1
- name: finance
  type: reference(enterprise-loan)
  card: 0..*
- name: neighbourhoods
  type: reference(neighbourhood)
  card: 0..*
- name: launched-on
  type: date
  card: 0..1
