kind: entity
slug: commons-fund-rules
title: Commons Fund Rules
type: governance
summary: The rules that state which revenue enters the commons fund, how it is protected from being drawn into the general budget
  and kept in value, and how neighbourhoods allocate it, weighted towards greatest need. The council adopts them under the commons
  charter, and every inflow, allocation and annual report of the fund is tested against them.
