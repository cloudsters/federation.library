# The steering loop of the family Proposition to Audience in the urban pack, authored by the maker in the form of the
# business pack's family loops. Its measures come with the depth (step 7).
loop: _family.proposition-to-audience
title: Keep the family 'Proposition to Audience' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: proposition-to-audience
  vs:
  - public-communication-and-reputation
  - neighbourhood-and-community-media
  - business-start-up-and-support
  - local-business-networks-and-clusters
  - markets-and-local-trade
  - social-and-cooperative-economy
  - inward-investment-and-location-promotion
stance: The city reaches across the city and its region with what it offers. No single stream of this family can see what
  its streams do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed reporting period of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was activated, adapted or not selected in the registry
  - a source the research declares in knowledge/sources.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/proposition-to-audience
  - value-model.yml#vs/public-communication-and-reputation
  - value-model.yml#vs/neighbourhood-and-community-media
  - value-model.yml#vs/business-start-up-and-support
  - value-model.yml#vs/local-business-networks-and-clusters
  - value-model.yml#vs/markets-and-local-trade
  - value-model.yml#vs/social-and-cooperative-economy
  - value-model.yml#vs/inward-investment-and-location-promotion
  registry:
  - registry/value-streams/public-communication-and-reputation.yml
  - registry/value-streams/neighbourhood-and-community-media.yml
  - registry/value-streams/business-start-up-and-support.yml
  - registry/value-streams/local-business-networks-and-clusters.yml
  - registry/value-streams/markets-and-local-trade.yml
  - registry/value-streams/social-and-cooperative-economy.yml
  - registry/value-streams/inward-investment-and-location-promotion.yml
  loop_states:
  - operations/loops/_state/public-communication-and-reputation.yml
  - operations/loops/_state/neighbourhood-and-community-media.yml
  - operations/loops/_state/business-start-up-and-support.yml
  - operations/loops/_state/local-business-networks-and-clusters.yml
  - operations/loops/_state/markets-and-local-trade.yml
  - operations/loops/_state/social-and-cooperative-economy.yml
  - operations/loops/_state/inward-investment-and-location-promotion.yml
  standards: knowledge/sources.yml — edition and status of every source that informs the family's records
authority: family-steward
state: operations/loops/_state/_family.proposition-to-audience.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never writes into
  the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided or passed
    to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or the commons does not select the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared source superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
