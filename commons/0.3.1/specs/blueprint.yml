# The frame of the plan (blueprint R2): the sections every commons is asked, the same in every commons.
# A domain's layer and the commons' own add sections within these ids; neither removes or renames one.
# Each family is one instance <dimension>.<family> of the section `family`; each selected record one instance
# element.<kind>.<slug> of its element's section (blueprint R9). Questions are kept in English (core R23).
sections:
- id: identity
  binds:
    kind: identity
    field: name
  cardinality: one
  labels:
    en: Who the commons is
  questions:
  - 'What is the commons called, what kind is it, since when and where does it live, and in which form: legal, social or
    familial?'
  - Which languages does it live in?
  - Where does its boundary run, and who belongs to it?
  answers:
  - fact
  - self-description
  evidence: sourced
  empty: question
  visibility: CORE
- id: identity.cores
  within: identity
  binds:
    kind: knowledge
    about: identity.cores
  cardinality: one
  labels:
    en: Where it decides and holds together
  questions:
  - Who decides for it, and to whom does what it holds belong?
  - Where does it decide and hold together, and to which other commons is it bound, how and how strongly?
  reads:
  - identity
  answers:
  - fact
  - self-description
  evidence: sourced
  empty: question
  visibility: CORE
- id: mandate
  binds:
    kind: knowledge
    about: mandate
  cardinality: one
  labels:
    en: What frames what it may do
  questions:
  - 'What frames what it may do and what it owes: which rights, duties, permits and rules?'
  - Who watches over them?
  reads:
  - identity
  answers:
  - fact
  evidence: sourced
  empty: absence
  visibility: CORE
- id: purpose
  binds:
    kind: identity
    field: purpose
  cardinality: one
  labels:
