kind: entity
slug: involvement-plan
title: Involvement Plan
type: governance
summary: The plan for involving residents in one decision, plan or service, stating what residents decide, what they shape and what
  is reserved, the budget and staff available, who is to be reached, the methods and access provided and when residents will hear
  back. The department responsible agrees it with the council and the communities affected before the process opens and publishes
  it, and it is used to hold the process to what was promised.
