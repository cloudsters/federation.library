kind: entity
slug: equity-impact-assessment
title: Equity Impact Assessment
type: intelligence
summary: The assessment of who pays and who benefits from a budget, a revenue policy or another major decision across neighbourhoods
  and groups, made with affected residents. The finance department or the department proposing the decision carries it out, and its
  findings are published with the draft and tested again before the decision is renewed.
