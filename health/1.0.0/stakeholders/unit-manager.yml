kind: stakeholder
slug: unit-manager
title: Unit Manager
nature: person
stance: serving
summary: 'The professional, most often a senior nurse, who leads the staff of a ward or unit day to day: builds the roster,
  inducts newcomers, holds appraisals and keeps staffing safe. The level at which staff decide whether to stay.'
seeks:
- A stable, competent team in safe numbers, rosters that hold, and the authority and time to lead people rather than fill
  gaps.
brings:
- Daily leadership of the largest staff groups, knowledge of the real workload, and the retention that no central programme
  achieves alone.
represented_by:
- employee
