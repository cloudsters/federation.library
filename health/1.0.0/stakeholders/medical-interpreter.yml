kind: stakeholder
slug: medical-interpreter
title: Medical Interpreter
nature: person
stance: serving
summary: A trained interpreter, employed or engaged by the commons, who interprets between patients or relatives and staff in consultations,
  consent talks, rounds and discharge, in person, by telephone or by video.
seeks:
- Advance notice, a briefing on the clinical context, time to interpret completely and recognition as part of the care team.
brings:
- Conversations understood on both sides, which make history taking, consent and shared decisions valid for patients who do not share
  the staff's language.
represented_by:
- employee
