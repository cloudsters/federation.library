kind: stakeholder
slug: patient-advocate
title: Patient Advocate
nature: person
stance: serving
summary: An independent person, often honorary, appointed to receive the concerns of patients and relatives, help them voice
  them and mediate with the teams. Outside the line of management, and therefore trusted by both sides.
seeks:
- Access to wards, information and leadership, and answers to the concerns and patterns raised.
brings:
- Concerns stated early and settled before they become formal complaints or claims, and an outside view of recurring problems.
represented_by:
- voluntary-engagement
