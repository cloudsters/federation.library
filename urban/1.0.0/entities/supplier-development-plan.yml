kind: entity
slug: supplier-development-plan
title: Supplier Development Plan
type: governance
summary: The agreed support for a small, local or cooperative supplier to bid and deliver, with training in tendering, help with certification,
  working capital, shared equipment or support to convert to worker or community ownership, and the milestones reviewed with it. The
  procurement office or the economic development office agrees it with the supplier and the partners who give the support, and it
  is reviewed at each milestone.
