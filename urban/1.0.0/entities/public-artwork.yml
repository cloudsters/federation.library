kind: entity
slug: public-artwork
title: Public Artwork
type: master
summary: A work of art, mural or shared symbol in public space, with its makers, the decision that placed it and those who care for
  it. The neighbourhood that lives with it decides on it with the city and keeps its care by agreement, and the record is used for
  its upkeep, its review and any change or removal.
