kind: stakeholder
slug: public-transport-passenger
title: Public Transport Passenger
nature: person
stance: served
summary: A resident or visitor who travels by bus, tram, rail or shared vehicle. Passengers are owed reliable, safe and affordable
  service and honest word when it fails.
seeks:
- Service at the hours they travel, one ticket across modes, accessible stops and vehicles, and information at once on delays and
  diversions.
brings:
- Fares and ridership, reports of faults and danger, and the experience of daily travel that shows where the network works and where
  it leaves people stranded.
represented_by:
- transit-riders-council
- access-advisory-council
