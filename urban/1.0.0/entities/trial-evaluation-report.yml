kind: entity
slug: trial-evaluation-report
title: Trial Evaluation Report
type: intelligence
summary: The analysis of a trial's results against the measures set at its start, with what residents and staff observed, its limits
  and the decision taken on it with its reasons. The responsible department prepares and publishes it with the researchers it works
  with, and the council or the department decides on it to adopt, change or stop the trial.
