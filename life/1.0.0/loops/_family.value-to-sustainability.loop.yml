loop: _family.value-to-sustainability
title: Keep the family 'Value to Sustainability' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: value-to-sustainability
  vs:
  - earning-to-income
  - spending-to-enough
  - obligation-to-ledger
  - exposure-to-buffer
  - consumption-to-consequence
  - loss-to-renewal
stance: Capture, account, reinvest value so the system endures. No single stream of this family can see what its
  streams do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed season of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was built into the runtime, adapted there, or left on the shelf
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/value-to-sustainability
  - value-model.yml#vs/earning-to-income
  - value-model.yml#vs/spending-to-enough
  - value-model.yml#vs/obligation-to-ledger
  - value-model.yml#vs/exposure-to-buffer
  - value-model.yml#vs/consumption-to-consequence
  - value-model.yml#vs/loss-to-renewal
  registry:
  - instance/registry/5_value-streams/earning-to-income.md
  - instance/registry/5_value-streams/spending-to-enough.md
  - instance/registry/5_value-streams/obligation-to-ledger.md
  - instance/registry/5_value-streams/exposure-to-buffer.md
  - instance/registry/5_value-streams/consumption-to-consequence.md
  - instance/registry/5_value-streams/loss-to-renewal.md
  loop_states:
  - instance/operations/loops/_state/earning-to-income.yml
  - instance/operations/loops/_state/spending-to-enough.yml
  - instance/operations/loops/_state/obligation-to-ledger.yml
  - instance/operations/loops/_state/exposure-to-buffer.yml
  - instance/operations/loops/_state/consumption-to-consequence.yml
  - instance/operations/loops/_state/loss-to-renewal.yml
  measures:
  - buffer-days-the-household-could-carry
  - buffer-moves-within-own-rules
  - buffer-one-bad-month
  - buffer-rare-losses-covered
  - buffer-set-aside-before-needed
  - consequence-areas-traced
  - consequence-drawing-chosen-with-open-eyes
  - consequence-giving-back-made
  - consequence-looked-past-a-cost
  - enough-agreed-at-home
  - enough-money-worry
  - enough-spending-on-what-matters
  - enough-spending-within-enough
  - enough-where-the-money-went-seen
  - income-hours-given-to-earning
  - income-months-below-own-floor
  - income-skills-kept-portable
  - income-that-can-move
  - ledger-claims-counted-before-arriving
  - ledger-days-since-current
  - ledger-promises-honoured-or-renegotiated
  - ledger-unwritten-claims-counted
  - renewal-losses-with-lesson-kept
  - renewal-rest-before-renewing
  - renewal-spare-in-the-week
  - renewal-weak-points-tested
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.value-to-sustainability.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never
  writes into the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided
    or passed to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or this life declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
