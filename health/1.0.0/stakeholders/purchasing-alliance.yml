kind: stakeholder
slug: purchasing-alliance
title: Purchasing Alliance
nature: organisation
stance: serving
summary: A purchasing group, consortium or public purchasing body through which several care providers pool demand, run joint tenders
  and hold framework agreements, often owned by its members.
seeks:
- Committed volumes and harmonised requirements from its members, and their clinicians' expertise in evaluating products.
brings:
- Better prices and terms through pooled demand, procurement expertise, lawful joint tenders and more weight with suppliers when supply
  is scarce.
represented_by:
- organisation
