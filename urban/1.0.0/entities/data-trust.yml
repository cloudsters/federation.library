kind: entity
slug: data-trust
title: Data Trust
type: master
summary: A body that holds the data about a neighbourhood or a group in trust for its residents and decides who may collect and use
  it and on what terms. Its trustees keep the record and the city recognises the trust, and its decisions govern every agreement to
  collect or use the data it holds.
