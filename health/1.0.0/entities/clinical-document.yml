kind: entity
slug: clinical-document
title: Clinical Document
type: transactional
summary: An authored and signed document in the health record, such as an admission note, progress note, operation note, consultation
  note or letter, for which its author remains accountable.
attributes:
- name: patient
  type: reference(patient)
  card: 1..1
- name: encounter
  type: reference(encounter)
  card: 0..1
- name: document-kind
  type: code
  card: 1..1
- name: authors
  type: reference(practitioner-role)
  card: 1..*
- name: authored-at
  type: datetime
  card: 1..1
- name: content
  type: document
  card: 1..1
- name: authenticator
  type: reference(practitioner-role)
  card: 0..1
- name: confidentiality
  type: code
  card: 0..1
states:
- draft
- preliminary
- signed
- amended
- entered-in-error
relations:
- type: part-of
  target: health-record
