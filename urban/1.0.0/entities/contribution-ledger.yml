kind: entity
slug: contribution-ledger
title: Contribution Ledger
type: intelligence
summary: The shared record of hours given and help exchanged among residents, on which they can draw for help in return. The neighbourhood
  body or mutual aid network that runs it keeps it with its participants, and it is used to draw help in return and to recognise contributions
  in public without turning them into a duty or a price.
