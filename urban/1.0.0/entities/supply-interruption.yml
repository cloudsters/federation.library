kind: entity
slug: supply-interruption
title: Supply Interruption
type: transactional
summary: A failure or shortage of water, power or heat, with its cause, the neighbourhoods affected, the order of restoration and
  its duration. The network operator records it from the first report to full restoration, and it is used to serve the basic need
  of every household first and to review how often each neighbourhood is cut off.
