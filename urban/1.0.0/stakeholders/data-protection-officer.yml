kind: stakeholder
slug: data-protection-officer
title: Data Protection Officer
nature: person
stance: serving
summary: The officer of the municipality who advises on and monitors the lawful use of personal data and to whom residents can turn.
  The officer advises without instruction and reports to the council each year.
seeks:
- Uses of personal data brought early, access to every system that holds it, and freedom to advise without instruction.
brings:
- Advice on lawful use, the record of processing, impact assessments made with those concerned and an honest yearly account of how
  residents' data was used.
represented_by:
- data-protection-office
