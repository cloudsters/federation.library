kind: entity
slug: payment
title: Payment
type: transactional
summary: The movement of money — the flow that settles obligations, whether incoming from customers or outgoing to suppliers, keeping the
  organisation's cash flow sound.
attributes:
- name: payment-date
  type: date
  card: 1..1
- name: amount
  type: amount
  card: 1..1
- name: direction
  type: code
  card: 1..1
- name: method
  type: code
  card: 1..1
- name: customer
  type: reference(customer)
  card: 0..1
- name: supplier
  type: reference(supplier-organisation)
  card: 0..1
- name: allocated-sales-invoices
  type: reference(sales-invoice)
  card: 0..*
- name: allocated-purchase-invoices
  type: reference(purchase-invoice)
  card: 0..*
states:
- draft
- submitted
- reconciled
- cleared
- unreconciled
relations:
- type: refers-to
  target: sales-invoice
- type: refers-to
  target: purchase-invoice
- type: refers-to
  target: bank-account
- type: produces
  target: journal-entry
binds:
- source: src-133
  edition: '2026'
  jurisdiction: global
- source: src-135
  edition: '2.5'
  jurisdiction: global
- source: src-136
  edition: d24a
  jurisdiction: global
