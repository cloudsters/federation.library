kind: entity
slug: compliance-case
title: Compliance Case
type: transactional
summary: A suspected breach of law, regulation or internal rule, such as corruption, fraud, a cartel contact, a conflict of interest
  or other misconduct, reported through any channel, investigated with the reporter protected and closed with a finding and measures.
