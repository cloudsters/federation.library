kind: stakeholder
slug: community-network-operator
title: Community Network Operator
nature: organisation
stance: serving
summary: A cooperative or neighbourhood body that owns or runs a local fibre, wireless or mesh network for its members. It keeps the
  last-mile network in the hands of those it serves.
seeks:
- Wholesale access to the public backbone on fair terms, a defined place in network and continuity plans, and support that leaves
  control with its members.
brings:
- Local networks built and run by their members, knowledge of what the neighbourhood needs, and mesh links that keep working when
  central networks fail.
