kind: entity
slug: cultural-collection
title: Cultural Collection
type: master
summary: The objects, records and works a museum or archive holds, with their origins, the communities they come from and the choices
  made on their display, loan and return. The museum or archive keeps it and decides on its display with residents and the communities
  concerned, and it is used to open the collection to residents and to record contested histories.
