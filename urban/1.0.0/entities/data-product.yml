kind: entity
slug: data-product
title: Data Product
type: intelligence
summary: A report, map, model or indicator built from the city's data for a decision, with its sources and the uncertainty of its
  results. Analysts build it with residents trained to read local data, it goes to those who asked and into the shared city picture,
  and it is retired when no one uses it.
