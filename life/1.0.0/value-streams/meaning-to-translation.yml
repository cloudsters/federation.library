  - social-feed
- slug: learning-the-other-world
  title: Learning the Other World
  summary: Spending time with the other world's assumptions, words and worries until they make sense from the inside.
  capabilities:
  - learning-another-worlds-language
  entities:
  - community-relation
  - conversation
