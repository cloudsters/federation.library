kind: stakeholder
slug: supplier
title: Supplier
nature: organisation
stance: serving
summary: An enterprise, cooperative or self-employed person that supplies the city with goods, works or services. A supplier is owed
  fair terms, equal information and payment on time.
seeks:
- Purchases announced in advance, criteria it can plan for, equal answers in a tender, a hearing before any remedy and payment within
  the fixed time.
brings:
- Goods, works and services delivered as agreed, the commitments made in its bid on jobs, wages and take-back, and knowledge of what
  the market can offer.
represented_by:
- business-association
