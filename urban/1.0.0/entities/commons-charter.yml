kind: entity
slug: commons-charter
title: Commons Charter (Urban)
type: governance
summary: The principles by which the city holds and shares land, assets and services as commons, and the boundary of what the municipality
  does itself, shares or leaves to neighbourhoods, cooperatives and partners. The council adopts it beside the city charter, and it
  is used whenever land or an asset held in trust is to be leased, shared or sold.
