  type: document
  card: 1..1
- name: informed-by
  type: reference(practitioner-role)
  card: 1..1
- name: capacity-confirmed
  type: boolean
  card: 1..1
- name: given-at
  type: datetime
  card: 1..1
states:
- pending
- given
- refused
- withdrawn
- expired
