summary: A pharmacist who manages the commons' list of approved medicines, prepares high-risk medicines such as cytotoxic drugs,
  and reviews medication on the wards.
seeks:
- Involvement in prescribing decisions, accurate medication histories and a place on the ward round.
brings:
- Safer medication through review, reconciliation and preparation, and lower costs through managing the list of approved medicines.
