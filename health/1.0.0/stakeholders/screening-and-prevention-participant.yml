kind: stakeholder
slug: screening-and-prevention-participant
title: Screening and Prevention Participant
nature: person
stance: served
summary: A person without known disease who is invited to or takes part in a screening, vaccination or prevention programme. Most
  never become patients of the commons, and a programme works only if enough of them take part.
seeks:
- A convenient and trustworthy examination, a clear result and, where something is found, fast access to diagnosis and treatment.
brings:
- Participation that lets the commons detect disease early and demonstrate the health effect of its programmes for the population.
represented_by:
- patient
