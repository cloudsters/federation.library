kind: stakeholder
slug: landowner
title: Landowner
nature: person
stance: served
summary: A person or body that owns land the city plans for, whether private, public or held in common. What the plan allows on a
  parcel changes what the owner can do with it.
seeks:
- Clear and fair rules for the land, an early view of what the plan may ask of it and a written answer to objections.
brings:
- Land, knowledge of its state and history, and the decision to develop, keep, sell or lease it.
