slug: systems-architecture
title: Systems Architecture
type: governance
summary: The current and target model of the city's systems as one whole, with the scale at which each system and data set sits, how
  they depend on one another and the principles every change must follow. The administration keeps it and the council adopts its principles,
  and every major digital decision is reviewed against it before it is taken.
