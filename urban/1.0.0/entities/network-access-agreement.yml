kind: entity
slug: network-access-agreement
title: Network Access Agreement
type: governance
summary: The published terms on which providers use a public or community network, with the same price and conditions for all. The
  city or the trust that holds the network agrees and publishes them, community assemblies review them in regular cycles, and every
  provider that uses the network signs on to them.
