kind: entity
slug: citizen-satisfaction
title: Resident Survey
type: intelligence
summary: The regular survey of residents' satisfaction, needs, trust and sense of belonging, by neighbourhood and group. The administration
  runs it at a fixed rhythm on a representative sample and publishes the results, and they are used in the neighbourhood review, the
  cohesion assessment and the whole-city assessment.
