kind: value-stream
slug: meaning-to-translation
title: Translating Between Worlds
family: proposition-to-audience
summary: Carrying something across into a world that does not share the assumptions it was made in — and shaping what the category
  itself is taken to mean.
trigger: The work lands in a world that does not share its assumptions and is misread, or the person sees their field being defined
  by people outside it.
outcome: The work is understood in worlds it was not made in, and the person has a hand in what their category is taken to mean.
stakeholders:
- audience
- community
- collaborator
- client
steps:
- slug: seeing-the-work-misread
  title: Seeing the Work Misread
  summary: The work lands in a world that reads it differently, or the person watches their field being defined by people outside
