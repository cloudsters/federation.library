id: life
kind: life-commons
gives: 'A life commons, a person''s life seen as a living system, holds its value creation as one whole: what it notices and
  decides, what sustains it, the people and places that carry it, what it makes and shares, and the days that keep its promises,
  read together. This offer holds the life portfolio whole: every stakeholder, the capability map from L0 to L3, every entity
  and solution, and the thirteen Bodies one person holds; every value stream of the pack, the eight of Perception to Mandate,
  the six of Purpose to Portfolio, the six of Value to Sustainability, the five of Portfolio to System, the ten of Participant
  to Community, the six of Collaboration to Automation, the six of Contributor to Succession, the six of Discovery to Usage,
  the four of Interest to Relationship, the five of Proposition to Audience, the nine of Demand to Fulfillment, the four of
  Source to Alliance and the six of Acquire to Retire, with the journeys, touchpoints and value exchanges beside them.'
asks: A Body that holds what the commons builds from it, and the commons' own evidence on its value creation.
