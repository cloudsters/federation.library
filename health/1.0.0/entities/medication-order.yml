kind: entity
slug: medication-order
title: Medication Order
type: transactional
summary: A prescriber's order for a patient to receive a medication, with dose, route, frequency, duration and indication, checked
  against allergies, interactions and organ function before it is released.
attributes:
- name: patient
  type: reference(patient)
  card: 1..1
- name: encounter
  type: reference(encounter)
  card: 0..1
- name: medication
  type: reference(medication)
  card: 1..1
- name: dosage
  type: text
  card: 1..1
- name: route
  type: code
  card: 1..1
- name: indication
  type: code
  card: 0..*
- name: prescriber
  type: reference(practitioner-role)
  card: 1..1
- name: validity
  type: period
  card: 1..1
states:
- draft
- active
- on-hold
- completed
- stopped
- entered-in-error
relations:
- type: based-on
  target: care-activity-mandate
- type: produces
  target: medication-dispense
- type: produces
  target: medication-administration
binds:
- source: src-008
  edition: '2026'
  jurisdiction: global
- source: src-029
  edition: 2.0.1
  jurisdiction: global
- source: src-018
  edition: 4.0.1
  jurisdiction: global
- source: src-016
  edition: 2.3.0
  jurisdiction: global
- source: src-015
  edition: 1.1.0
  jurisdiction: global
- source: src-404
  edition: 2.0.1
  jurisdiction: global
- source: src-405
  edition: v2.9.1
  jurisdiction: global
