slug: commons-exchange-protocol
title: Commons-to-Commons Exchange Protocol
level: L3
parent: commons-network-exchange
summary: Agent-to-agent value negotiation between sovereign commons instances — including governance fitness checks, ecological accountability,
  and relational continuity. The A2A Handshake includes SLAs, multi-dimensional token exchange, and delivery parameters. When intent
  is sensed and production triggered in the same millisecond, there is no handoff between proposition and fulfilment — only a single
  governed act.
