kind: entity
slug: research-project
title: Urban Research Project
type: transactional
summary: A research initiative studying the city, with its questions, its investigators among researchers, residents and frontline
  workers, its data and its findings. The research institution and the responsible department run and record it under the research
  partnership, and its data and findings are returned to those who took part and to the city's knowledge.
