kind: value-stream
slug: talent-to-skill
title: Honing a Natural Gift
family: discovery-to-usage
summary: The disciplined working of what comes naturally into something that can be relied on. Talent without craft stays potential;
  craft without talent stays competence.
trigger: Something that comes easily keeps drawing the person back, or they notice others relying on it while they still treat it
  as luck.
outcome: What came naturally has become something the person can rely on on an ordinary day, not only when inspired.
stakeholders:
- mentor
- collaborator
- community
steps:
