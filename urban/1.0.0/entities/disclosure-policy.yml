kind: entity
slug: disclosure-policy
title: Disclosure Policy
type: governance
summary: The rules that make records, budgets, contracts and deliberations public by default, each exemption needing a written reason,
  a review date and an entry in the public register of exemptions. The council sets it, the administration applies it to every record
  and request, and it is reviewed against the pattern of exemptions and refusals.
