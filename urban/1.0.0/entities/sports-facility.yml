kind: entity
slug: sports-facility
title: Sports Facility
type: master
summary: A sports hall, swimming pool, pitch, court or stadium, with its operator, opening hours, prices and the access it offers.
  The city or the body that runs it keeps the record, and it is used for booking, for setting hours and prices and to show which facilities
  are within reach of each neighbourhood.
