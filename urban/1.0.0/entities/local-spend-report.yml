kind: entity
slug: local-spend-report
title: Local Spend Report
type: intelligence
summary: The yearly account of the share of spending with local, small, cooperative and resident-owned suppliers by neighbourhood
  and group, the jobs, wages and training those contracts brought and progress against the purchasing targets. The procurement office
  compiles it with communities and anchor institutions, and the council uses it to adjust the targets.
