kind: entity
slug: sensor
title: Sensor
type: master
summary: A sensor, meter or camera the city installs or allows, with its location, its declared purpose, the data it gathers, its
  owner and the date its approval ends. The department that operates it keeps the record and enters it in the register of automated
  systems, and it is removed when its purpose or its approval ends.
