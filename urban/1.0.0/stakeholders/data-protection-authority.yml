summary: The independent public body that supervises the use of personal data and receives reports of breaches. It can investigate,
  order changes and sanction.
seeks:
- Breaches reported within their deadlines, a complete record of processing and cooperation in its inquiries.
brings:
- Supervision, guidance on lawful use and the assurance residents need that their data is protected.
