kind: entity
slug: service-mandate
title: Service Mandate
type: governance
summary: The public mandate that defines which services the organisation must and may provide, at which care level, in which
  service groups and with what capacity, and on which public planning and funding rest.
attributes:
- name: issuing-authority
  type: reference(organisation)
  card: 1..1
- name: care-level
  type: code
  card: 1..1
- name: service-group-assignments
  type: reference(service-group-assignment)
  card: 0..*
- name: planned-capacity
  type: quantity
  card: 0..*
- name: emergency-care-obligation
  type: boolean
  card: 1..1
- name: conditions
  type: text
  card: 0..*
- name: valid-period
  type: period
  card: 0..1
states:
- applied-for
- granted
- in-force
- under-review
- revoked
relations:
- type: governed-by
  target: compliance-obligation
binds:
- source: src-001
  edition: '2026'
  jurisdiction: global
- source: src-018
  edition: 4.0.1
  jurisdiction: global
