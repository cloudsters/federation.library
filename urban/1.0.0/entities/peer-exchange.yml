kind: entity
slug: peer-exchange
title: Peer City Exchange
type: transactional
summary: An exchange of evidence, visits or staff with a peer city, with its subject, the people who took part, what was shared, including
  what failed, and what each side learned. The department that arranges it records it and its lessons, and it is used to bring tested
  practice into the city and to share the city's own.
