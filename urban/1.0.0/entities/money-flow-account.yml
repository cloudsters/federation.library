kind: entity
slug: money-flow-account
title: Money Flow Account
type: intelligence
summary: The public account of where the city's money comes from, where it is held and where it goes, including the cross-subsidies
  between services and neighbourhoods and the share that flows into the commons fund. The finance department compiles it from the
  books at least once a year, and residents use it to follow their money from payment to use.
