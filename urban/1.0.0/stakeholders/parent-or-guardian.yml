kind: stakeholder
slug: parent-or-guardian
title: Parent or Guardian
nature: person
stance: served
summary: A parent or other adult responsible for a child, who seeks places, routes and support for the child's learning and care.
  Parents and guardians speak for children who cannot yet speak for themselves in the city's decisions.
seeks:
- An early-years and school place within reach, a safe route to it, fair rules of admission and early word when their child falls
  behind.
brings:
- Knowledge of the child and of the neighbourhood's daily routes, care shared with other families, and a voice in the life of the
  school.
represented_by:
- neighbourhood-association
- civil-society-organisation
