kind: entity
slug: faith-space-agreement
title: Faith Space Agreement
type: governance
summary: An agreement between a faith community and its neighbours on how sacred sites, burial grounds, ritual times and shared space
  are respected and used, with its review date. The parties sign it and the city records it with its review, and it is used to settle
  the use of shared streets and squares before tension arises.
