kind: entity
slug: award-decision
title: Award Decision
type: transactional
summary: The reasoned decision to award a contract, with the scores of every bid, the reasons, the level that decided under delegation,
  the standstill period and any challenge. The procurement office prepares it and the office holder or body the delegation names decides
  it, and it is told to every bidder and published once final.
