slug: affiliated-teaching-site
title: Affiliated Teaching Site
nature: organisation
stance: serving
summary: A hospital, practice or care provider outside the commons that hosts the clinical placements of students and trainees under
  an agreement with the faculty or school, and supervises them to curriculum standards.
seeks:
- Prepared learners, recognition as a teaching site and support for its own supervisors.
brings:
- Placements and patient contact in settings the commons cannot provide, such as general practice and smaller hospitals.
