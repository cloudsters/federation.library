kind: stakeholder
slug: urban-nature
title: Urban Nature
nature: more-than-human
stance: served
summary: The trees, soil, waterways, wetlands and wild species within the city that shade streets, hold rain and steady slopes and
  banks. Their health depends on the ground the city leaves open and the care given to what is planted.
seeks:
- Unsealed ground, room for water, time and care for young trees to become established, and edges of rivers and shores left living.
brings:
- Shade and cooling, rain held and slowly released, banks and slopes held in place, and habitat that links the city's green spaces.
represented_by:
- future-generations
- parks-and-green-space-department
