kind: stakeholder
slug: delivery-carrier
title: Delivery Carrier
nature: organisation
stance: serving
summary: A firm, cooperative or self-employed courier that carries goods and parcels to homes and businesses in the city. Carriers
  decide how many vehicles enter each street and how delivery workers are treated.
seeks:
- Reliable loading space, predictable rules for each district, fair access to shared hubs and allocations that reward consolidation.
brings:
- Delivery capacity, data on trips and loading, clean vehicles and cargo bikes, and bundled orders that take vehicles off residential
  streets.
