kind: journey
slug: working-with-me
title: Working with Me
stakeholder: client
via: interest-to-relationship
summary: A client receives work that is reliable on ordinary days, is asked and told honestly what works, and is kept in touch with
  between pieces of work without being sold to.
stages:
- slug: receive-reliable-work
  title: Receive Reliable Work
  goal: The client has received what was promised, on an ordinary day as well as a good one.
  step: uptake-to-standing/doing-reliable-work
  touchpoints:
  - the-delivery
- slug: be-asked
  title: Be Asked
  goal: The client has said what worked and what did not, and was heard without argument.
  step: uptake-to-standing/asking-for-honest-feedback
  touchpoints:
  - client-meeting
- slug: be-told-honestly
  title: Be Told Honestly
  goal: The client has been told plainly what helps the work and what hinders it.
  step: uptake-to-standing/giving-feedback-in-return
  touchpoints:
  - client-meeting
  - coffee-catch-up
- slug: stay-in-touch
  title: Stay in Touch
  goal: The relation stays alive between pieces of work, and contact is not a sales call.
  step: uptake-to-standing/staying-in-touch-between-work
  touchpoints:
  - message-thread
  - coffee-catch-up
