kind: entity
slug: competency-standard
title: Competency Standard
type: governance
summary: The standard set by practitioners for a trade or role, stating what must be learned, how competence is shown and how apprentices
  progress. A council of experienced practitioners sets and reviews it, and it is used to admit, review and credential apprentices
  and to recognise the skills of others.
