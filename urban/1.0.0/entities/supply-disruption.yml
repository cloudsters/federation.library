kind: entity
slug: supply-disruption
title: Supply Disruption
type: transactional
summary: A failure or shortage in the supply of an essential good, with its cause, the stock remaining, the standby suppliers called
  on, the reserves released and the allocations made. The procurement office records it from first detection to recovery and reports
  to the crisis team, and it is reviewed afterwards with the neighbourhood places and suppliers.
