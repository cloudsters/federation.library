kind: entity
slug: mobility-plan
title: Mobility Plan
type: governance
summary: The city's plan for how people and goods move, with the allocation of street space, the transport network and the targets
  for safety and access. The transport office drafts it with neighbourhoods, riders and transport workers and the council adopts it,
  and routes, timetables, street schemes and kerb rules are set within it.
