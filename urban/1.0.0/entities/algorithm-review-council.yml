kind: entity
slug: algorithm-review-council
title: Algorithm Review Council
type: master
summary: The standing body, with a majority of residents including those most affected by the city's automated systems, that authorises
  and reviews them and may slow or suspend them. The administration supports it on the mandate of the council and keeps the record
  of its members, powers and sessions, and it is used to hold every system under democratic control for as long as it runs.
