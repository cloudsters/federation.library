kind: entity
slug: intergenerational-programme
title: Intergenerational Programme
type: transactional
summary: A programme that brings young people, families and older residents together for learning, mentoring or care, with its place,
  partners and those who take part. The partner who runs it records it, together with the city where the city funds it, and it is
  used to see what knowledge and care passed between the ages.
