kind: entity
slug: programme-case
title: Programme Case
type: transactional
summary: The case for a proposed programme, with its expected benefit, its whole-life cost including upkeep, care work and ecological
  costs, its risks and who pays and who gains. The sponsor submits it and the administration appraises it, and it is the basis on
  which the programme is prioritised and funded.
