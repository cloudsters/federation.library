kind: entity
slug: service-level-agreement
title: Service Level Agreement
type: governance
summary: A measurable promise — a formal commitment defining response times, resolution times, escalation paths, and service hours.
  Unlike a general agreement (G18), an SLA has timers that tick, thresholds that trigger, and consequences that matter. It is governance
  made operational.
