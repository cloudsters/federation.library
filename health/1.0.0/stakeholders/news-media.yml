kind: stakeholder
slug: news-media
title: News Media
nature: organisation
stance: served
summary: Journalists, editorial offices, broadcasters and online publishers, including publishers of rankings, who report on the commons
  to the public. They shape much of what the public knows about the commons, above all in a crisis.
seeks:
- Timely, accurate and attributable information, access to experts and honest answers when something has gone wrong.
brings:
- Reach to the public that the commons cannot achieve alone, and scrutiny that holds it to account.
