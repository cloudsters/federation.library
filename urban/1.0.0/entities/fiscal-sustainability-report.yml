kind: entity
slug: fiscal-sustainability-report
title: Fiscal Sustainability Report
type: intelligence
summary: The assessment of whether the city's income covers its spending, its debt and the upkeep of its assets over a generation,
  and of the burdens passed to future residents. The finance department issues it at regular intervals to the council and the supervisory
  authority, and it is the basis for the next medium-term financial plan and borrowing strategy.
