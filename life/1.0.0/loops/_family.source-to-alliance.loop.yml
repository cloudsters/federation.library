loop: _family.source-to-alliance
title: Keep the family 'Source to Alliance' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: source-to-alliance
  vs:
  - dependency-to-awareness
  - exchange-to-alliance
  - service-to-terms
  - commons-to-obligation
stance: 'Supplier & input relationships: sourcing → partnership (consumables & inputs live here). No single stream
  of this family can see what its streams do to one another; this loop is where that becomes visible.'
escalates_to: gate
trigger:
  rhythm: each closed season of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was built into the runtime, adapted there, or left on the shelf
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/source-to-alliance
  - value-model.yml#vs/dependency-to-awareness
  - value-model.yml#vs/exchange-to-alliance
  - value-model.yml#vs/service-to-terms
  - value-model.yml#vs/commons-to-obligation
  registry:
  - instance/registry/5_value-streams/dependency-to-awareness.md
  - instance/registry/5_value-streams/exchange-to-alliance.md
  - instance/registry/5_value-streams/service-to-terms.md
  - instance/registry/5_value-streams/commons-to-obligation.md
  loop_states:
  - instance/operations/loops/_state/dependency-to-awareness.yml
  - instance/operations/loops/_state/exchange-to-alliance.yml
  - instance/operations/loops/_state/service-to-terms.yml
  - instance/operations/loops/_state/commons-to-obligation.yml
  measures:
  - alliance-failure-terms-said
  - alliance-kept-both-ways
  - alliance-tended-between-deals
  - alliance-weight-on-largest
  - common-good-draws-named
  - common-good-given-beside-decided
  - common-good-member-or-user
  - common-good-member-voice
  - fine-print-agreements-dated
  - fine-print-knows-what-signed
  - fine-print-renewals-unchosen
  - fine-print-terms-read
  - rests-on-callers-asked
  - rests-on-fallbacks-in-place
  - rests-on-picture-current
  - rests-on-single-threads
  - rests-on-whom-to-call
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.source-to-alliance.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never
  writes into the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided
    or passed to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or this life declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
