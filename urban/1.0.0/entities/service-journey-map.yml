- name: service
  type: reference(public-service)
  card: 0..1
- name: concept
  type: reference(service-concept)
  card: 0..1
- name: journey-steps
  type: text
  card: 1..*
- name: channels-walked
  type: code
  card: 1..*
- name: participant-groups
  type: text
  card: 1..*
- name: places-residents-get-stuck
  type: text
  card: 0..*
- name: reasons-given
  type: text
  card: 0..*
- name: languages
  type: code
  card: 0..*
- name: made-by
  type: text
  card: 1..*
- name: mapped-on
  type: date
  card: 1..1
- name: map-document
  type: document
  card: 1..1
states:
- planned
- walked
- drafted
- validated
- published
- superseded
