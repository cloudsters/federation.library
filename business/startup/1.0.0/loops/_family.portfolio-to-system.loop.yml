# startup's family loop: corporate's loop of the same slug, its streams those of startup 
loop: _family.portfolio-to-system
title: Keep the family 'Portfolio to System' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: portfolio-to-system
  vs:
  - stakeholder-technology-relationship
  - technology-strategy-alignment
  - digital-immune-design
  - information-as-lifeblood
  - interoperability-and-connectivity
  - solution-lifecycle-design
  - support-as-care
stance: Architect the whole as a coherent system-of-systems ("System" = the whole system incl. the value model, not just IT).
  No single stream of this family can see what its streams do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed reporting period of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was activated, adapted or not selected in the registry
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/portfolio-to-system
  - value-model.yml#vs/stakeholder-technology-relationship
  - value-model.yml#vs/technology-strategy-alignment
  - value-model.yml#vs/digital-immune-design
  - value-model.yml#vs/information-as-lifeblood
  - value-model.yml#vs/interoperability-and-connectivity
  - value-model.yml#vs/solution-lifecycle-design
  - value-model.yml#vs/change-as-evolution
  - value-model.yml#vs/support-as-care
  - value-model.yml#vs/intelligence-cultivation
  registry:
  - instance/registry/5_value-streams/stakeholder-technology-relationship.md
  - instance/registry/5_value-streams/technology-strategy-alignment.md
  - instance/registry/5_value-streams/digital-immune-design.md
  - instance/registry/5_value-streams/information-as-lifeblood.md
  - instance/registry/5_value-streams/interoperability-and-connectivity.md
  - instance/registry/5_value-streams/solution-lifecycle-design.md
  - instance/registry/5_value-streams/change-as-evolution.md
  - instance/registry/5_value-streams/support-as-care.md
  - instance/registry/5_value-streams/intelligence-cultivation.md
  loop_states:
  - instance/operations/loops/_state/stakeholder-technology-relationship.yml
  - instance/operations/loops/_state/technology-strategy-alignment.yml
  - instance/operations/loops/_state/digital-immune-design.yml
  - instance/operations/loops/_state/information-as-lifeblood.yml
  - instance/operations/loops/_state/interoperability-and-connectivity.yml
  - instance/operations/loops/_state/solution-lifecycle-design.yml
  - instance/operations/loops/_state/change-as-evolution.yml
  - instance/operations/loops/_state/support-as-care.yml
  - instance/operations/loops/_state/intelligence-cultivation.yml
  measures:
  - access-rights-recertified
  - adoption-ninety-days-after-deployment
  - analysis-delivery-lead-time
  - analysis-usefulness-rating
  - application-catalogue-currency
  - applications-mapped-to-capabilities
  - applications-past-end-of-support
  - architecture-exceptions-past-expiry
  - critical-systems-recovered-within-target
  - critical-vulnerabilities-fixed-within-target
  - data-assets-with-owner-and-definition
  - data-products-within-freshness-target
  - data-quality-issue-resolution-time
  - decisions-backed-by-validated-analysis
  - defects-found-after-release
  - deployments-with-tested-rollback
  - deployments-without-disruption
  - documents-exchanged-without-manual-touch
  - exchange-errors-first-reported-by-partners
  - exchange-errors-resolved-within-target
  - infrastructure-within-supported-lifecycle
  - interfaces-with-documented-contract
  - master-records-passing-quality-rules
  - models-reviewed-before-first-use
  - partner-connection-lead-time
  - planned-outage-per-deployment
  - predictions-within-stated-tolerance
  - privacy-requests-fulfilled-on-time
  - problems-closed-with-cause-removed
  - records-disposed-on-schedule
  - reportable-incidents-notified-late
  - requirement-to-production-lead-time
  - requirements-covered-by-passed-tests
  - resolution-at-first-contact
  - run-share-of-technology-spend
  - security-incidents-contained-within-target
  - solutions-meeting-agreed-level
  - staff-finding-information-they-need
  - support-experience-rating
  - technology-decisions-checked-against-architecture
  - technology-demand-decided-within-thirty-days
  - technology-investment-linked-to-objectives
  - technology-service-levels-met
  - technology-services-with-agreed-level
  - technology-spend-outside-agreed-services
  - technology-spend-per-employee
  - tickets-reopened-within-fourteen-days
  - tickets-resolved-within-service-level
  - unit-satisfaction-with-technology-services
  - users-prepared-for-change
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.portfolio-to-system.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never writes into
  the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided or passed
    to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or the commons declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
