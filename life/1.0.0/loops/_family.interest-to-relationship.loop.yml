loop: _family.interest-to-relationship
title: Keep the family 'Interest to Relationship' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: interest-to-relationship
  vs:
  - offer-to-demand
  - trust-to-terms
  - uptake-to-standing
  - employment-to-arrangement
stance: Cultivate awareness into a lasting 1:1 relationship. No single stream of this family can see what its streams
  do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed season of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was built into the runtime, adapted there, or left on the shelf
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/interest-to-relationship
  - value-model.yml#vs/offer-to-demand
  - value-model.yml#vs/trust-to-terms
  - value-model.yml#vs/uptake-to-standing
  - value-model.yml#vs/employment-to-arrangement
  registry:
  - instance/registry/5_value-streams/offer-to-demand.md
  - instance/registry/5_value-streams/trust-to-terms.md
  - instance/registry/5_value-streams/uptake-to-standing.md
  - instance/registry/5_value-streams/employment-to-arrangement.md
  loop_states:
  - instance/operations/loops/_state/offer-to-demand.yml
  - instance/operations/loops/_state/trust-to-terms.yml
  - instance/operations/loops/_state/uptake-to-standing.yml
  - instance/operations/loops/_state/employment-to-arrangement.yml
  measures:
  - arrangement-hours-within-limits
  - arrangement-talked-at-home
  - arrangement-terms-last-reopened
  - arrangement-would-agree-today
  - asked-back-feedback-asked
  - asked-back-feedback-both-ways
  - asked-back-returning-work
  - asked-back-standing-honest
  - demand-offer-in-their-words
  - demand-own-line-held
  - demand-people-who-ask
  - demand-small-test-first
  - fair-terms-floor-written
  - fair-terms-money-before-work
  - fair-terms-resentment-noted
  - fair-terms-said-aloud
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.interest-to-relationship.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never
  writes into the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided
    or passed to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or this life declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
