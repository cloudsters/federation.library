kind: entity
slug: care-transition
title: Care Transition
type: transactional
summary: The handover of a person's care between services, such as around birth, into adult services, on leaving hospital or at the
  end of life, with its date and who takes over. The services involved record it together, and no transition closes until the receiving
  service has confirmed it.
