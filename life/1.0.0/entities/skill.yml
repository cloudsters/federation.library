kind: entity
slug: skill
title: Skill
type: master
summary: A developed capability this person can put to work. Unlike `natural-gift` it is acquired, it can be listed, and it goes stale
  — which is why it is held with the date it was last actually used.
attributes:
- name: level
  type: code
  card: 1..1
- name: last-used-in-earnest
  type: date
  card: 1..1
- name: built-on
  type: reference(natural-gift)
  card: 0..1
- name: learned-through
  type: list(learning-event)
  card: 0..*
- name: vouched-for-by
  type: list(credential)
  card: 0..*
- name: handed-to-an-agent
  type: boolean
  card: 0..1
states:
- learning
- usable
- relied on
- fading
- stale
- renewed
relations:
- target: skill-inventory
  type: part-of
- target: natural-gift
  type: based-on
