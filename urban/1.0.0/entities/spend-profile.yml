kind: entity
slug: spend-profile
title: Spend Profile
type: intelligence
summary: The analysis of what the city and its municipal enterprises bought, from whom and where the money landed, by category, department,
  supplier ownership and region, together with what departments expect to need over the coming years. The procurement office compiles
  it each year from the accounts and the supplier records, and it is the basis for category strategies, local purchasing targets,
  the carbon account and the search for purchases to share with others.
