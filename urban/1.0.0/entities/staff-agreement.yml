kind: entity
slug: staff-agreement
title: Staff Agreement
type: governance
summary: An agreement between the city and its staff representatives on a change to work, on the use of a technology or on the mandate
  of an AI agent, with what each side commits to and how it is reviewed. The administration and the staff representatives sign it
  after consultation in good time and the administration keeps it, and where agreement is due no changed process, automated system
  or agent mandate spreads beyond its pilot without it.
