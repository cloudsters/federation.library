kind: entity
slug: need-assessment
title: Need Assessment
type: intelligence
summary: The assessment of what residents need across neighbourhoods and groups over the strategy horizon, of the conditions in the
  region and of the ecological limits the city must keep within. The administration prepares it with residents and researchers who
  ask the questions together, and it is the basis on which strategic options are drawn up.
