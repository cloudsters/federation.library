kind: entity
slug: budget-bid
title: Budget Bid
type: transactional
summary: The request of a department or neighbourhood body for budget for the coming year, with the objectives it serves, its costs,
  the upkeep of existing assets it funds before new projects, and the care work and shared assets it relies on. The bidding unit prepares
  it within its spending limit and the finance department checks it, and the bids together form the draft budget.
