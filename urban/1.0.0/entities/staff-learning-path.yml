kind: entity
slug: staff-learning-path
title: Staff Learning Path
type: master
summary: A path of practice, mentoring and study that builds a capacity the city's work needs, such as the oversight of AI agents,
  with its aims, steps, mentors, research partners and the staff who follow it. The administration designs it with staff and research
  partners and keeps its record, and it is used to build lasting capacity inside the administration and to confirm that overseers
  are prepared.
