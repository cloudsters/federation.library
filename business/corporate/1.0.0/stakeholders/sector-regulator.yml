kind: stakeholder
slug: sector-regulator
title: Sector Regulator
nature: organisation
legal_form: public-body
stance: served
summary: The authority that licenses or supervises the company's activity in its sector, such as product safety, financial services,
  energy, transport or telecommunications, and that can impose conditions or sanctions.
seeks:
- Compliance with the rules of the sector, complete and timely reports and early notice of incidents.
brings:
- The licence to operate, and a level playing field in which all competitors meet the same requirements.
