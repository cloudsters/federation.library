slug: livelihood-floor-agreement
title: Livelihood Floor Agreement
type: governance
summary: The binding agreement that the core roles keeping the commons running receive at least a living income, with the roles covered,
  the source of funds and how the levels are set. The council or the body of the commons fund adopts it, and it is used to pay park
  caretakers, facilitators, maintenance workers and knowledge keepers whatever their decisions.
