summary: The elected head of the city's government, who directs the administration and the crisis team. The mayor proposes, carries
  out and answers for the city's daily government within the rights the council delegates.
seeks:
- Room to act within stated decision rights, and the trust of residents and council in hard and urgent decisions.
brings:
- Direction of the administration, proposals to the council, and command in an emergency within bounded powers.
