kind: entity
slug: story-archive
title: Story Archive
type: master
summary: The community-governed collection of recorded stories, oral histories, documents and images of a neighbourhood or group,
  with the rules on what is shared and with whom. A resident body governs it and keeps its rules, often with a library or community
  centre holding the material, and it is used to keep stories with those who told them and to decide requests to share or reuse them.
