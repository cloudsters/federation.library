title: Flood and Erosion Defence
type: master
summary: A living or built work that protects land from flood or erosion, such as a planted slope, restored riverbank, living shoreline,
  wall or embankment. The operator responsible keeps its record and inspects it, and the communities who use the land beside it help
  to care for it.
