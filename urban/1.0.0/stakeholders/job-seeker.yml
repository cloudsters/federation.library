kind: stakeholder
slug: job-seeker
title: Job Seeker
nature: person
stance: served
summary: A resident looking for work or for more secure work, who needs openings that account for their skills, care duties and travel.
  Many job seekers hold skills that no paper records.
seeks:
- Openings they can reach, skills recognised however they were learned, a fair selection and support in the first months.
brings:
- Skills learned at work, in care and from neighbours, and the willingness to do the city's work.
represented_by:
- civil-society-organisation
