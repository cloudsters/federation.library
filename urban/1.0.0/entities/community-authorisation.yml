kind: entity
slug: community-authorisation
title: Community Authorisation
type: transactional
summary: The decision, taken after the communities most affected have deliberated with the impact assessment in hand, to authorise
  an automated system for a fixed term, to set conditions on it or to refuse it. The algorithm review council takes and records it
  with the deliberation it rests on and publishes it, and no system is approved or authorised again without it.
