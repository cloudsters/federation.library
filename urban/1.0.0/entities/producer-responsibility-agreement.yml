title: Producer Responsibility Agreement
type: governance
summary: The terms under which producers and suppliers take back what they sold, provide spare parts and repair information and contribute
  to the cost of collection and repair. The city sets them in its rules and contracts, and the take-back records show whether they
  are kept.
