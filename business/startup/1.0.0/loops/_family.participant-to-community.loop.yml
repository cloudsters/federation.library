# startup's family loop: corporate's loop of the same slug, its streams those of startup 
loop: _family.participant-to-community
title: Keep the family 'Participant to Community' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: participant-to-community
  vs:
  - ecosystem-relationship-design
  - governance-board-relationship
stance: Cultivate individual participants into a thriving community. No single stream of this family can see what its streams
  do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed reporting period of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was activated, adapted or not selected in the registry
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/participant-to-community
  - value-model.yml#vs/community-voice-architecture
  - value-model.yml#vs/ecosystem-relationship-design
  - value-model.yml#vs/institutional-partnering
  - value-model.yml#vs/governance-board-relationship
  - value-model.yml#vs/public-narrative-presence
  registry:
  - instance/registry/5_value-streams/community-voice-architecture.md
  - instance/registry/5_value-streams/ecosystem-relationship-design.md
  - instance/registry/5_value-streams/institutional-partnering.md
  - instance/registry/5_value-streams/governance-board-relationship.md
  - instance/registry/5_value-streams/public-narrative-presence.md
  loop_states:
  - instance/operations/loops/_state/community-voice-architecture.yml
  - instance/operations/loops/_state/ecosystem-relationship-design.yml
  - instance/operations/loops/_state/institutional-partnering.yml
  - instance/operations/loops/_state/governance-board-relationship.yml
  - instance/operations/loops/_state/public-narrative-presence.yml
  measures:
  - absent-participants-represented-in-major-decisions
  - board-effectiveness-rating
  - board-papers-issued-on-time
  - board-seats-with-named-successor
  - crisis-statement-lead-time
  - critical-public-ratings-answered
  - decision-rights-documented
  - decisions-preceded-by-consultation
  - disclosure-corrections
  - disclosures-published-on-schedule
  - engagement-pulse-participation
  - equal-access-to-material-information
  - favourable-public-reputation
  - governance-bodies-fully-constituted
  - industry-body-commitments-met
  - institutional-partner-rating
  - investor-information-rating
  - issue-to-position-lead-time
  - key-institutional-relationships-reviewed
  - owner-concerns-answered-in-time
  - owner-participation-in-owners-meetings
  - positions-disclosed-publicly
  - public-statement-corrections
  - statements-approved-before-release
  - suggestions-adopted
  - suggestions-answered-within-thirty-days
  - understanding-of-major-decisions
  - voice-seen-to-change-decisions
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.participant-to-community.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never writes into
  the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided or passed
    to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or the commons declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
