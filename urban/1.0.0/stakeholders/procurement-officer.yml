kind: stakeholder
slug: procurement-officer
title: Procurement Officer
nature: person
stance: serving
summary: A member of the city's procurement office who plans categories, runs tenders, advises departments and keeps the supplier
  and contract records. Procurement officers answer for buying lawfully and openly and for the criteria the city adopted.
seeks:
- Needs stated early by departments, criteria the council has adopted, and suppliers who know in advance what the city will buy.
brings:
- Category strategies, tenders run to a published award, equal answers to every bidder and the records that let anyone follow where
  the money went.
represented_by:
- procurement-office
