kind: entity
slug: business-network
title: Business Network
type: master
summary: A network or cluster of firms, makers, cooperatives and institutions of a sector or place, or a federation of cooperatives,
  with its members and the rules they set. The members keep its record and the economic development office records the networks it
  convened, and it is used to share facilities, knowledge and a common fund and to link settled enterprises to local suppliers.
