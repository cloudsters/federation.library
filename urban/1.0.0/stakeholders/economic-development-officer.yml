kind: stakeholder
slug: economic-development-officer
title: Economic Development Officer
nature: person
stance: serving
summary: A member of the city's economic development office who advises businesses, convenes networks and handles investment. Economic
  development officers keep the value that enterprises create widely held in the city.
seeks:
- An adopted strategy with stated priorities, honest figures on who starts and keeps businesses, and the trust of founders, traders
  and their networks.
brings:
- Advice, introductions, space and finance for enterprises, convened networks, investment agreements and reviews of whether support
  reached those it was meant for.
represented_by:
- economic-development-department
