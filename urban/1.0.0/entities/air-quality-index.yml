kind: entity
slug: air-quality-index
title: Air Quality Index
type: intelligence
summary: The continuous measurement of air quality across the city, including measurements made by residents themselves. The administration
  keeps it from its own sensors and the stations residents run, each with its stated accuracy, and it is published and used for health
  warnings, planning and the review of traffic and heating.
