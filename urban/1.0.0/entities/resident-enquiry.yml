kind: entity
slug: resident-enquiry
title: Resident Enquiry
type: transactional
summary: A question, request or report brought to the city by a resident, a visitor or a local body, by counter, telephone, letter,
  message or online, from its receipt and acknowledgement to its close. Frontline staff record it and follow it through, and it is
  answered from the shared body of answers or handed, with what the person has already said, to the service concerned.
