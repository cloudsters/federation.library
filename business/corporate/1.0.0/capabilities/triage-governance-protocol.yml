kind: capability
slug: triage-governance-protocol
title: Triage Governance Protocol
level: L3
parent: policy-and-decision-rights
summary: Govern explicit allocation of insufficient resources through transparent, contestable criteria. When the commons cannot serve
  all needs, it must decide which needs to serve first — and make that decision visible, auditable, and challengeable. Scarcity is
  not failure; ungoverned scarcity is.
