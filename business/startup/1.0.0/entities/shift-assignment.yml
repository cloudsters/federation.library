  type: reference(employee-record)
  card: 1..1
- name: roster
  type: reference(roster)
  card: 1..1
- name: shift-kind
  type: code
  card: 1..1
- name: shift-period
  type: period
  card: 1..1
- name: role
  type: code
  card: 1..1
- name: work-centre
  type: reference(work-center)
  card: 0..1
states:
- planned
- confirmed
- swapped
- worked
- absent
relations:
- type: part-of
  target: roster
- type: produces
  target: attendance
