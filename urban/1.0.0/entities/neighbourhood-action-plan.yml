kind: entity
slug: neighbourhood-action-plan
title: Neighbourhood Action Plan
type: governance
summary: The plan a neighbourhood body agrees with its residents and the city, with its priorities, the decisions and budget share
  the neighbourhood holds, what it asks of the city and the city's answer. The neighbourhood body keeps it and the city records its
  answer, and both review it each year against what it achieved before renewing it.
