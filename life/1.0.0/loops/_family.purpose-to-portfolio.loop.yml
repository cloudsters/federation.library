loop: _family.purpose-to-portfolio
title: Keep the family 'Purpose to Portfolio' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: purpose-to-portfolio
  vs:
  - calling-to-direction
  - direction-to-commitment
  - option-to-portfolio
  - horizon-to-season
  - rupture-to-replan
  - constraint-to-invention
stance: Translate purpose into a coherent portfolio of commitments. No single stream of this family can see what
  its streams do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed season of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was built into the runtime, adapted there, or left on the shelf
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/purpose-to-portfolio
  - value-model.yml#vs/calling-to-direction
  - value-model.yml#vs/direction-to-commitment
  - value-model.yml#vs/option-to-portfolio
  - value-model.yml#vs/horizon-to-season
  - value-model.yml#vs/rupture-to-replan
  - value-model.yml#vs/constraint-to-invention
  registry:
  - instance/registry/5_value-streams/calling-to-direction.md
  - instance/registry/5_value-streams/direction-to-commitment.md
  - instance/registry/5_value-streams/option-to-portfolio.md
  - instance/registry/5_value-streams/horizon-to-season.md
  - instance/registry/5_value-streams/rupture-to-replan.md
  - instance/registry/5_value-streams/constraint-to-invention.md
  loop_states:
  - instance/operations/loops/_state/calling-to-direction.yml
  - instance/operations/loops/_state/direction-to-commitment.yml
  - instance/operations/loops/_state/option-to-portfolio.yml
  - instance/operations/loops/_state/horizon-to-season.yml
  - instance/operations/loops/_state/rupture-to-replan.yml
  - instance/operations/loops/_state/constraint-to-invention.yml
  measures:
  - commitment-other-path-still-turning
  - commitment-pace-matched-to-reversibility
  - commitment-reversibility-stated-first
  - commitment-those-touched-brought-in
  - direction-new-commitments-serve-purpose
  - direction-small-trials-made
  - direction-ways-changed-why-kept
  - direction-work-still-has-a-reason
  - invention-by-products-noticed
  - invention-energy-while-growing
  - invention-intentions-within-limits
  - invention-small-versions-tried
  - portfolio-bets-checked-honestly
  - portfolio-largest-footing-share
  - portfolio-one-loss-a-setback
  - portfolio-ventures-running-at-once
  - replan-crisis-plan-tried
  - replan-crisis-plan-used
  - replan-rescued-without-asking
  - replan-who-does-what-agreed
  - season-day-fixed-points-kept
  - season-distance-looked-back-at
  - season-rest-displaced-by-long-plan
  - season-week-serves-the-season
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.purpose-to-portfolio.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never
  writes into the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided
    or passed to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or this life declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
