title: Sewer Network
type: master
summary: The sewers, drains, treatment plants and green spaces that take wastewater and rain away, with their capacity and condition.
  The network operator keeps the record, and uses it to plan treatment and recovery, keep drains clear and share the cost of drainage
  by how much rain each property sends in.
