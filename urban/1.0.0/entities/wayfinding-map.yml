slug: wayfinding-map
title: Wayfinding Map
type: intelligence
summary: The map made with residents of the landmarks, sounds, textures and stories by which each group finds its way to services
  and through public buildings, and of where people get lost. The city holds it with the residents who made it, and it is used to
  design wayfinding and service points.
