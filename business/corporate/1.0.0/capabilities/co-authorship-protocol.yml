kind: capability
slug: co-authorship-protocol
title: Co-Authorship & Mandate Accountability Protocol
level: L3
parent: ai-governance-and-assurance
summary: Structured records of human-AI reasoning at significant decision points. Not who decided — who authorised the mandate within
  which the decision was made. When 340 agents produce a drug candidate no human can trace, the question is not ‘can the agents do
  it?’ but ‘can humans be accountable for what agents produced?’ Mandate accountability replaces decision accountability.
