kind: entity
slug: capital-project
title: Capital Project
type: transactional
summary: A project that builds, buys or renews an asset of the city, with its scope, budget, schedule and contracts. The department
  that owns the asset delivers it within a programme, and it is reported on until the asset is handed over.
