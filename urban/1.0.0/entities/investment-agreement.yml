kind: entity
slug: investment-agreement
title: Investment Agreement
type: governance
summary: The agreement on local hiring, fair pay, local suppliers and community benefit that comes with city support for an investment,
  with repayment of support if commitments are not kept. The council approves it and the economic development office keeps it and
  publishes each year whether it was kept, and it is used to recover support where commitments failed.
