kind: entity
slug: emergency-response
title: Emergency Response
type: transactional
summary: A coordinated response of the city to an acute emergency, from alert to recovery, with the emergency powers taken, the warnings
  issued and the relief given to each neighbourhood. The crisis team records it as it acts, and it is reviewed with the affected neighbourhoods
  once the powers have returned to their normal holders.
