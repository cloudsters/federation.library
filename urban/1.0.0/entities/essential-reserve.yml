kind: entity
slug: essential-reserve
title: Essential Reserve
type: master
summary: A reserve of food, water, medicine or other essential supplies held in a neighbourhood place such as a community kitchen,
  school, health centre or cooperative store, with its stock, the levels it must hold, its rotation through daily use and the body
  that keeps it. The keeping body holds the record with the city, and the reserve is drawn on when the agreed triggers are met.
