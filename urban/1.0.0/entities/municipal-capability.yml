kind: entity
slug: municipal-capability
title: Municipal Capability
type: master
summary: A capability of the administration, with the staff, assets, systems and finances that carry it, whether the city does the
  work itself, shares it or leaves it to others, and the strength and gaps found when it was last assessed. The administration keeps
  it, and it is used to test strategic options and to design the departments.
