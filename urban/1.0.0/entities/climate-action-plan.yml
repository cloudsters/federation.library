kind: entity
slug: climate-action-plan
title: Climate Action Plan
type: governance
summary: The city's plan for cutting emissions and adapting to climate change, with its targets by sector and year, the measures and
  who carries them out, and the limits for the carbon embedded in what the city buys and builds. The environment department drafts
  it with neighbourhoods and departments and the council adopts it, and categories, budgets and works are measured against it each
  year.
