kind: stakeholder
slug: night-shift-worker
title: Night-Shift Worker
nature: person
stance: served
summary: A worker whose hours fall at night or outside the usual day, such as in care, cleaning, hospitality or warehouses. They need
  safe and affordable travel at any hour and are often missing from plans built for the working day.
seeks:
- Service as frequent at shift change as at peak, safe and staffed places to wait, fares set to shift-worker pay and a voice in the
  routes they depend on.
brings:
- Knowledge of the city at night, of the trips the network does not serve and of the places where waiting is unsafe.
represented_by:
- trade-union
- transit-riders-council
