kind: stakeholder
slug: living-donor
title: Living Donor
nature: person
stance: served
summary: A person who gives blood, blood components, stem cells or an organ during life so that others can be treated. Healthy and
  unpaid, the donor is owed protection of their own health and the assurance that the gift is used well.
seeks:
- A safe donation, a health check, information on any relevant finding and the knowledge that the gift reached a patient.
brings:
- The blood supply and the living-donor organs without which transfusion, much of surgery and part of transplantation cannot take
  place.
represented_by:
- donor
