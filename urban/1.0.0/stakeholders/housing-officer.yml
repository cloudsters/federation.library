kind: stakeholder
slug: housing-officer
title: Housing Officer
nature: person
stance: serving
summary: A member of the city's housing office who assesses need, allocates homes, runs tenancies and arranges repairs. Housing officers
  are often the first to see that a household is about to lose its home.
seeks:
- Published rules that make allocation fair and explainable, enough homes to offer and time to help a household before it is in crisis.
brings:
- Assessment of need, reasoned offers of homes, tenancies explained and kept, and early help for households at risk.
represented_by:
- housing-office
