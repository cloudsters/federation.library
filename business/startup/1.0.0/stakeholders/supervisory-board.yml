slug: supervisory-board
title: Supervisory Board
nature: group
stance: serving
summary: The supervisory, advisory or non-executive board that appoints, advises and oversees the management on behalf of the owners
  and, where the law provides, the employees.
seeks:
- Timely, complete information on performance and risks, and a management that acts on its advice.
brings:
- Oversight, independent judgement and approval of the decisions that commit the company for years.
