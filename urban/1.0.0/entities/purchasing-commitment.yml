kind: entity
slug: purchasing-commitment
title: Purchasing Commitment
type: governance
summary: A published multi-year commitment of the city or an anchor institution to spend with local and community-owned suppliers,
  with targets by category and ownership, minimum volumes and quarterly reporting. The council sets it on the advice of the procurement
  and economic development offices, and progress against it is reported each quarter and reviewed in the yearly local spend report.
