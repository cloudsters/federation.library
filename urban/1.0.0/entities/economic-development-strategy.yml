kind: entity
slug: economic-development-strategy
title: Economic Development Strategy
type: governance
summary: The city's plan for local economic vitality and enterprise, including its commitments to local hiring, apprenticeships and
  the succession of local businesses. The council adopts it for the term and the administration reports against it, and it is used
  to set local hiring requirements and to direct support to the businesses and trades at risk of loss.
