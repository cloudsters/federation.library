kind: entity
slug: works-brief
title: Works Brief
type: transactional
summary: The statement of what a public work must achieve, with the need, service level, lifecycle and carbon targets, the requirements
  of its users and maintainers, and the budget. The owning department writes it with them, and the design and the acceptance tests
  are measured against it.
