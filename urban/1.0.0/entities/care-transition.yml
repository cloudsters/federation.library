- name: person
  type: identifier
  card: 1..1
- name: care-plan
  type: reference(care-plan)
  card: 1..1
- name: transition-kind
  type: code
  card: 1..1
- name: from-service
  type: text
  card: 1..1
- name: to-service
  type: text
  card: 1..1
- name: hospital
  type: reference(hospital)
  card: 0..1
- name: planned-date
  type: date
  card: 1..1
- name: handover-date
  type: date
  card: 0..1
- name: handover-information
  type: document
  card: 0..*
- name: family-support
  type: text
  card: 0..*
- name: confirmed-by
  type: text
  card: 0..1
- name: confirmed-on
  type: date
  card: 0..1
states:
