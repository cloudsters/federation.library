kind: entity
slug: facility-booking
title: Facility Booking
type: transactional
summary: A booking of time in a sports or community facility by a club, school, group or resident, from request through allocation
  to use. The operator records it in the one open booking system, which shares time between users under the plan's priorities, and
  bookings are counted in the review of activity and access.
attributes:
- name: booking-number
  type: identifier
  card: 1..1
- name: facility
  type: reference(sports-facility|community-centre|school)
  card: 1..1
- name: booked-by
  type: text
  card: 1..1
- name: user-kind
  type: code
  card: 1..1
- name: booked-time
  type: period
  card: 1..*
- name: recurring
  type: boolean
  card: 0..1
- name: participant-count
  type: integer
  card: 0..1
- name: priority-basis
  type: code
  card: 0..1
- name: fee
  type: amount
  card: 0..1
- name: fee-reduction
  type: amount
  card: 0..1
- name: requested-on
  type: date
  card: 1..1
states:
- requested
- allocated
- confirmed
- used
- cancelled
- not-used
relations:
- type: refers-to
  target: sports-facility
- type: refers-to
  target: community-centre
- type: governed-by
  target: sport-and-activity-plan
- type: governed-by
  target: shared-use-agreement
- type: produces
  target: payment
