kind: entity
slug: early-years-setting
title: Early-Years Setting
type: master
summary: A place where young children learn and are cared for, such as a nursery, a neighbourhood childcare group or a care space
  in a school or community building, with its places, hours and who runs it. The body that runs it keeps the record together with
  the city, and it is used to plan early-years places.
