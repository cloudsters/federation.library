- name: contract
  type: reference(contract)
  card: 1..1
- name: variation-kind
  type: code
  card: 1..1
- name: reason
  type: text
  card: 1..1
- name: change-description
  type: text
  card: 1..1
- name: contract-clause
  type: text
  card: 0..1
- name: value-change
  type: amount
  card: 0..1
- name: new-end-date
  type: date
  card: 0..1
- name: triggering-report
  type: reference(contract-performance-report)
  card: 0..1
- name: supplier-hearing
  type: text
  card: 0..1
- name: approved-by
  type: text
  card: 0..1
- name: approved-on
  type: date
  card: 0..1
- name: published-on
  type: date
  card: 0..1
states:
- proposed
- heard
- approved
- rejected
- applied
- published
relations:
