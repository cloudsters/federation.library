kind: stakeholder
slug: neighbourhood-association
title: Neighbourhood Association
nature: organisation
stance: served
summary: A body through which the residents of a neighbourhood speak and act together. It carries local knowledge into the city's
  decisions and often keeps shared spaces going.
seeks:
- Recognition as a partner, a voice in what touches the neighbourhood and a fair share of the city's attention and resources.
brings:
- Local knowledge, organised voice, volunteer work in shared spaces and a channel to residents the city does not otherwise reach.
represented_by:
- neighbourhood-council
