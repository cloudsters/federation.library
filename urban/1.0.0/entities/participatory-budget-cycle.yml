kind: entity
slug: participatory-budget-cycle
title: Participatory Budget Cycle
type: transactional
summary: One cycle in which residents propose and decide a share of the city's spending, with its rules, safeguards for poorer neighbourhoods,
  votes and results. The administration runs it under the participation charter, and the programmes residents choose are funded in
  the budget.
