kind: entity
slug: research-partnership-agreement
title: Research Partnership Agreement
type: governance
summary: The agreement between the city and a research institution on shared questions, open access to findings and data, the use
  of campus resources by the city and its neighbourhoods, and residents' say in the research that concerns them. The city and the
  institution sign it and the administration keeps it, and every research project done under it is checked against it.
