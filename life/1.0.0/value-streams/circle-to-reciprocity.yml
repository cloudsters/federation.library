  - phone-call
  - shared-meal
  - trip-together
- slug: letting-some-go-gracefully
  title: Letting Some Go Gracefully
  summary: Accepting that some bonds have run their course, and letting them end with thanks rather than by slow neglect.
  capabilities:
  - ending-a-bond-well
  entities:
