kind: entity
slug: informal-settlement
title: Informal Settlement
type: master
summary: A settlement built without formal title or permission, with its boundaries, households, own bodies, services and hazards.
  The settlement's own bodies keep the record with the city, starting from the count and map the residents make themselves, and it
  is used to plan upgrading in place, bring services in and recognise each household's right to stay.
