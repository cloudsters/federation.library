loop: _family.demand-to-fulfillment
title: Keep the family 'Demand to Fulfillment' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: demand-to-fulfillment
  vs:
  - sleep-to-restoration
  - attention-to-focus
  - energy-to-allocation
  - rhythm-to-day
  - effort-to-recovery
  - limit-to-declaration
  - feeling-to-response
  - intention-to-shipped
  - setting-to-regulation
stance: Orchestrate production & delivery from demand to fulfilled promise. No single stream of this family can
  see what its streams do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed season of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was built into the runtime, adapted there, or left on the shelf
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/demand-to-fulfillment
  - value-model.yml#vs/sleep-to-restoration
  - value-model.yml#vs/attention-to-focus
  - value-model.yml#vs/energy-to-allocation
  - value-model.yml#vs/rhythm-to-day
  - value-model.yml#vs/effort-to-recovery
  - value-model.yml#vs/limit-to-declaration
  - value-model.yml#vs/feeling-to-response
  - value-model.yml#vs/intention-to-shipped
  - value-model.yml#vs/setting-to-regulation
  registry:
  - instance/registry/5_value-streams/sleep-to-restoration.md
  - instance/registry/5_value-streams/attention-to-focus.md
  - instance/registry/5_value-streams/energy-to-allocation.md
  - instance/registry/5_value-streams/rhythm-to-day.md
  - instance/registry/5_value-streams/effort-to-recovery.md
  - instance/registry/5_value-streams/limit-to-declaration.md
  - instance/registry/5_value-streams/feeling-to-response.md
  - instance/registry/5_value-streams/intention-to-shipped.md
  - instance/registry/5_value-streams/setting-to-regulation.md
  loop_states:
  - instance/operations/loops/_state/sleep-to-restoration.yml
  - instance/operations/loops/_state/attention-to-focus.yml
  - instance/operations/loops/_state/energy-to-allocation.yml
  - instance/operations/loops/_state/rhythm-to-day.yml
  - instance/operations/loops/_state/effort-to-recovery.yml
  - instance/operations/loops/_state/limit-to-declaration.yml
  - instance/operations/loops/_state/feeling-to-response.yml
  - instance/operations/loops/_state/intention-to-shipped.yml
  - instance/operations/loops/_state/setting-to-regulation.yml
  measures:
  - body-timing-agreed-with-others
  - body-timing-days-without-fight
  - body-timing-designed-day-lived
  - body-timing-redrawn-with-season
  - finishing-almost-done-pile
  - finishing-evenings-free
  - finishing-good-enough-defined
  - finishing-released-too-early
  - focus-alerts-shut
  - focus-attention-came-back
  - focus-hours-where-meant
  - focus-unbroken-stretches
  - good-hours-forecast-held
  - good-hours-unwarned-crashes
  - good-hours-warnings-heeded
  - good-hours-well-placed
  - limits-found-by-crossing
  - limits-last-revisited
  - limits-said-aloud
  - limits-yes-while-saying-no
  - pause-before-acting
  - pause-held-back-returning
  - pause-named-apart-from-story
  - pause-repair-after-reaction
  - recovery-placed-before-work
  - recovery-rest-cancelled
  - recovery-rest-restored
  - recovery-work-put-down
  - sleep-broken-nights-carried
  - sleep-cut-for-long-days
  - sleep-rested-on-waking
  - sleep-window-kept
  - surroundings-shared-space-agreed
  - surroundings-steadying-places
  - surroundings-tension-by-place
  - surroundings-upkeep-hours
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.demand-to-fulfillment.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never
  writes into the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided
    or passed to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or this life declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
