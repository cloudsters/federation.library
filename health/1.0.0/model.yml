id: health
kind: health-commons
gives: 'A health commons, such as a university hospital, a hospital group or a care network, holds its mandate as one whole: by whose leave it cares, researches and teaches, the care level and service groups it must evidence against their criteria, the obligations it carries with a named owner each, and the risks to its right to operate, read together. This offer holds the health portfolio whole: every stakeholder, the capability map from L0 to L3, every entity and solution, and every Body with its Posts; of the value streams, the seven of Perception to Mandate, the five of Purpose to Portfolio, the nine of Value to Sustainability and the eight of Portfolio to System, the three of Participant to Community, the twelve of Collaboration to Automation, the twelve of Contributor to Succession, the seven of Discovery to Usage, the seven of Interest to Relationship, the eight of Proposition to Audience, the thirty-three of Demand to Fulfillment, the five of Source to Alliance and the six of Acquire to Retire are offered, with the journeys, touchpoints and value exchanges beside them; deeper capabilities, measures, patterns and systems of record are served on the same ids where the offer holds them.'
asks: A Body that holds what the commons activates, and the commons' own evidence on its mandate.
