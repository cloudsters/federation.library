title: Decision Velocity Calibration
level: L3
parent: policy-and-decision-rights
summary: 'Distinguish governance decisions by speed requirement: milliseconds (agent execution within mandate), hours (operational),
  weeks (strategic), months (constitutional). Not all decisions need full deliberation. Not all can be delegated. Some decisions need
  14 months. Some need 47 milliseconds. Both are legitimate. The boundary is the architecture.'
