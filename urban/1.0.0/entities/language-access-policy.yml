kind: entity
slug: language-access-policy
title: Language Access Policy
type: governance
summary: The city's commitment on the languages in which it interprets, translates and teaches, with the funded interpreters, the
  documents covered and the residents who set its priorities. The council adopts it and the administration keeps it current, and every
  meeting, document, welcome point and digital service of the city is planned against it.
