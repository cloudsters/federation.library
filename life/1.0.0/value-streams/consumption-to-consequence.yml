kind: value-stream
slug: consumption-to-consequence
title: Knowing What Living Takes
family: value-to-sustainability
summary: What the life draws from the living world and what that drawing costs elsewhere. The one stream where a life commons and
  an ecology commons are the same accounting.
trigger: The cost of how one eats, travels or buys becomes visible elsewhere, in a landscape, an animal or someone else's labour,
  and can no longer be looked past.
outcome: The person knows what their way of living draws from the living world and has chosen, with open eyes, what to keep drawing
  and what to give back.
stakeholders:
- place
- animal-companion
- descendant
- community
- living-world
