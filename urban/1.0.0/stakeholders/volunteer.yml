kind: stakeholder
slug: volunteer
title: Volunteer
nature: person
stance: serving
summary: A resident who gives time to the city, a neighbourhood body or a civil-society organisation without pay. Volunteers range
  from those who help for a single afternoon to those who hold a standing role.
seeks:
- Work that fits their skills, time and wishes, preparation and cover, recognition, and the freedom to step back without penalty.
brings:
- Time, skills and care, and ties between neighbours that paid services alone cannot make.
represented_by:
- civil-society-organisation
