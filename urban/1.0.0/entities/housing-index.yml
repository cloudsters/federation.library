title: Housing Index
type: intelligence
summary: The ratio of housing costs to local incomes by neighbourhood and household type, updated each year. The housing office compiles
  it from rents, prices and incomes, and it is used to set the housing policy and to review who can still afford to stay in each neighbourhood.
