kind: entity
slug: labour-valuation
title: Labour Valuation
type: intelligence
summary: The record, made with those who do it, of the care, maintenance and emotional work behind a service or a shared place, paid
  and unpaid, with the time it takes and the value agreed. The service or the neighbourhood body keeps it with the people it describes,
  and it is used to share the care load, to set commons work pay and to recognise what is given.
