kind: stakeholder
slug: informal-settlement-resident
title: Informal Settlement Resident
nature: person
stance: served
summary: A resident of a settlement built without formal title or permission. They are owed secure tenure, basic services and a full
  voice in the upgrading of the place they built.
seeks:
- A recognised right to stay, safe water, sanitation, power and paths, and an upgrading that keeps them in place wherever it is safe.
brings:
- The count and map of their own settlement, local skills and materials, crews who build and keep services, and bodies that already
  govern the settlement.
represented_by:
- neighbourhood-association
- neighbourhood-council
