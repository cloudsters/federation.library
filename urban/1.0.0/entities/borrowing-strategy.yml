kind: entity
slug: borrowing-strategy
title: Borrowing Strategy
type: governance
summary: The council's rules for what the city may borrow for, its limit on debt service as a share of its own income, the spread
  of repayment dates and the conditions it will not accept because they would give lenders a say over its decisions. The treasury
  drafts it and reviews the debt held against it each year, and every loan and bond is raised within it.
