kind: value-exchange
slug: first-in-human-participation
title: First-in-Human Participation
between:
- research-participant
- clinician-scientist
offered:
- The participant offers to be among the first to receive a new therapy, accepting unknown risks and giving time and samples for intensive
  monitoring.
returned:
- The investigator returns honest information on what is not known, intensive safety monitoring, the right to stop at any time and,
  where possible, access to a therapy not otherwise available.
touchpoint: clinical-trial-unit
