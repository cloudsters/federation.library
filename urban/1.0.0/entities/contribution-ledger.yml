- name: keeper
  type: text
  card: 1..1
- name: area
  type: reference(neighbourhood)
  card: 0..*
- name: participants
  type: identifier
  card: 1..*
- name: unit-of-account
  type: code
  card: 1..1
- name: ledger-period
  type: period
  card: 1..1
- name: hours-given
  type: quantity
  card: 0..1
- name: hours-drawn
  type: quantity
  card: 0..1
- name: entry-rules
  type: text
  card: 1..1
- name: recognition-given
  type: text
  card: 0..*
states:
