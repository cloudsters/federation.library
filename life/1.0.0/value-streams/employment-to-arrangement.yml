kind: value-stream
slug: employment-to-arrangement
title: The Job as an Agreement
family: interest-to-relationship
summary: The institution that takes up the life's offer and pays for it — treated as a negotiated arrangement rather than a given.
  For most people this single relationship consumes more waking hours than any other in the model.
trigger: A job offer arrives, the hours start crowding out the rest of the life, or the person realises they never chose the terms
  they work under.
outcome: The job is an arrangement the person has looked at and agreed to, with its hours, pay and limits known, and it can be reopened
  when the life changes.
stakeholders:
- employer
- partner
- dependant
- collaborator
steps:
- slug: seeing-the-job-as-a-choice
  title: Seeing the Job as a Choice
  summary: An offer arrives, or the hours crowd out the rest of the life, and the person sees the job as terms they can look at rather
    than a given.
  capabilities:
  - seeing-work-as-an-agreement
  entities:
  - employer-relation
  - contract
  - self
  serves:
  - work-agreement
- slug: counting-what-it-takes
  title: Counting What It Takes
  summary: Looking at the hours, travel, energy and attention the job really takes, set beside what it pays.
  capabilities:
  - counting-the-real-cost-of-work
  entities:
  - time-audit
  - energy-log
  - income-event
- slug: talking-it-through-at-home
  title: Talking It Through at Home
  summary: Talking it over with a partner and those who depend on the person, whose lives the job also shapes.
