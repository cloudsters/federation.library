kind: entity
slug: skill
title: Skill
type: master
summary: A named unit of human capability — what a participant can do, validated by experience, certification, or peer recognition. Skills
  are the basic units of the community’s collective intelligence, and their taxonomy is a map, kept current, of what the
  organisation knows how to do through its people.
