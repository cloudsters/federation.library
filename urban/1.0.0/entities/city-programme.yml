kind: entity
slug: city-programme
title: City Programme
type: transactional
summary: A programme or capital project funded by the city, from proposal to closure, with its objective, origin, sponsor, budget,
  benefits and owner. The administration keeps it as a published commitment to residents, and it is continued, changed or ended with
  reasons at each review of the portfolio.
