kind: solution
slug: supplier-and-contract-management-system
title: Supplier and Contract Management System
role: system-of-record
summary: Keeps each supplier once with its ownership, size, location and performance, and each contract with its obligations, service
  levels, commitments, reports, variations, reviews, exit plan and end date, so that renewal is decided in time.
