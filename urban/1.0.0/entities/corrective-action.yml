kind: entity
slug: corrective-action
title: Corrective Action
type: transactional
summary: An action to remove the cause of a failure or an audit finding, with its owner, its due date and the check of its effect
  before it is closed. The process owner records it and follows it to closure, and open and closed actions are reviewed in the regular
  quality review and reported to the council.
