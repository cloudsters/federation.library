# The variant startup of the business model; corporate is its sibling.
id: business
variant: {name: startup}
title: 'Business: startup'
kind: business-commons
gives: 'A startup commons, a young company of a few founders and up to about thirty people, financed by its owners and investors,
  that sells a product and the services around it, holds its value creation as one whole: its founding, its financing until
  it carries itself, the search for a fit between its offering and a lasting need, and the streams of the business model it
  shares with every company. This model holds 38 streams in all thirteen families, its Bodies those of its owners and managing
  directors and four teams, and grows into the variant corporate.'
asks: A Body that holds what the commons activates, and the commons' own evidence on its value creation.
