- name: review-year
  type: period
  card: 1..1
- name: own-revenue-share
  type: decimal
  card: 1..1
- name: grant-share
  type: decimal
  card: 1..1
- name: transfer-share
  type: decimal
  card: 0..1
- name: commons-fund-share
  type: decimal
  card: 0..1
- name: dependence-by-funder
  type: document
  card: 0..1
- name: grants-ending
  type: reference(grant-award)
  card: 0..*
- name: work-to-continue
  type: reference(city-programme)
  card: 0..*
- name: planned-own-funding
  type: amount
  card: 0..1
- name: reviewed-on
  type: date
  card: 1..1
states:
- scheduled
- conducted
- issued
- applied-in-plan
relations:
