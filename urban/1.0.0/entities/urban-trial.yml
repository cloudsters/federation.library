kind: entity
slug: urban-trial
title: Urban Trial
type: transactional
summary: A trial of a new service, process or rule in a defined area and for a defined time, with the question it answers, the measures
  that will judge it and any experimental rule it needs. The responsible department designs and runs it in the open and records what
  residents and staff observe, and it ends in a recorded decision to adopt, change or stop.
