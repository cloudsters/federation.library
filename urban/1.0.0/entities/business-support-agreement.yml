kind: entity
slug: business-support-agreement
title: Business Support Agreement
type: governance
summary: The agreement under which an enterprise receives reduced rent, grants or services, stating how long the support lasts, what
  the enterprise aims to reach and how support tapers. The enterprise and the business support service sign it, and it is used to
  build an enterprise able to stand on its own rather than a lasting dependency.
