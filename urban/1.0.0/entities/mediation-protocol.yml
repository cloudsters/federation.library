kind: entity
slug: mediation-protocol
title: Mediation Protocol
type: governance
summary: The published steps by which a dispute moves from neighbours to community mediation, district mediation and formal routes,
  with the time allowed at each step and the cooling-off periods. The city agrees it with neighbourhood bodies and the formal justice
  system and publishes it, and every dispute case is routed by it.
