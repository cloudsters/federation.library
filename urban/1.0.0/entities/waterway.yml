kind: entity
slug: waterway
title: Waterway
type: master
summary: A river, lake, canal, aquifer or coastal water from which the city takes water or into which it returns it. The environment
  office keeps the record with the neighbouring municipalities that share it, and uses it to protect the source, set what may be taken
  and follow its quality.
