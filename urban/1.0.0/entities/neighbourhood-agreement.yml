kind: entity
slug: neighbourhood-agreement
title: Neighbourhood Agreement
type: governance
summary: A shared agreement within a neighbourhood about conduct and care, such as what it welcomes and asks of visitors, where limits
  apply or how its nights are kept, made by residents with venues, traders, night workers and the city. The neighbourhood's recognised
  bodies hold it with the city, and it is used to guide visitors and night-time life and to settle disagreements over shared space.
