title: Supervisory Authority
nature: organisation
stance: serving
summary: The higher level of government that supervises the legality of the municipality's actions. It reviews bylaws and certain
  decisions and receives evidence of compliance.
seeks:
- Lawful bylaws and decisions, and timely and honest evidence that duties are met.
brings:
- Notice and guidance on changed duties, legality review and the assurance that the city acts within its powers.
