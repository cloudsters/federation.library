summary: A club or informal group through which residents play sport together, mostly run by volunteers. Clubs need time in halls
  and pitches and carry much of the city's coaching and youth sport.
seeks:
- A fair share of facility time, help with coaches, volunteers and safeguarding, and small grants without heavy paperwork.
brings:
- Regular sport for residents of every age, volunteer coaches, knowledge of who plays and who does not, and a place to belong.
