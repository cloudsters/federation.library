summary: An enterprise, institution or person, including residents abroad, who considers settling or investing in the city. Investors
  bring work and capital and take on written commitments to those who already live there.
seeks:
- Honest facts on sites, skills, permits and costs, one point of contact and a named contact after they settle.
brings:
- Capital, work and spending in the city, and written commitments on local hiring, fair pay, local suppliers and community benefit.
