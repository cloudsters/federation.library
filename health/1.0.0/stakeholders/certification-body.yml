kind: stakeholder
slug: certification-body
title: Certification Body
nature: organisation
stance: served
summary: An independent organisation that audits the commons or one of its centres against a quality or management standard
  and grants, renews or withdraws a certificate.
seeks:
- Evidence that defined requirements are met, an open audit and corrective action where they are not.
brings:
- External assurance and certificates that referrers, payers and patients use to choose a provider.
represented_by:
- organisation
