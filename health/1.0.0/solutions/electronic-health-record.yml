- finding-integration
- diagnosis-confirmation
- care-plan-determination
- clinical-pathway-application
- preoperative-optimisation
- enhanced-recovery
- chronic-care-programmes
- antenatal-care
- paediatric-care
- psychiatric-inpatient-care
- stroke-unit-care
- transplantation-programme-management
- rare-disease-care
- high-consequence-infection-care
- palliative-care
- end-of-life-care
- advance-care-planning
- shared-decision-making-practice
- isolation-and-screening-management
- health-record-management
- clinical-system-configuration
holds:
- health-record
- episode-of-care
- health-issue
- diagnosis
- allergy-or-intolerance
- clinical-alert
- patient-summary
- care-plan
- care-goal
- care-team
- immunisation
- care-mandate
- care-activity-mandate
- preference
- shared-decision
binds:
