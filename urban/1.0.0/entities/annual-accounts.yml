kind: entity
slug: annual-accounts
title: Annual Accounts
type: intelligence
summary: The audited statement of the city's financial position and results for the year, with the ecological and social costs recorded
  next to the money, approved by the council and published. The finance department prepares it at the close of the year and the external
  auditor audits it, and it is the basis of the spending review and the fiscal sustainability report.
