title: Finance Department
summary: The municipality's finance function under the treasurer, which proposes the revenue policy, plans and steers the budget,
  keeps the books and the annual accounts, reviews the funding mix and the city's long-term financial health, exercises the city's
  role as owner of its enterprises and reports where the city's money comes from and where it goes.
