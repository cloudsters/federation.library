kind: entity
slug: service-council
title: Service Council
type: master
summary: A standing council of the residents who use a public service and the staff who deliver it, with its members, mandate and
  the standards it sets. The department delivering the service keeps its record together with the council's own secretary, and it
  is used to shape how the service is delivered and to show residents who sets its standards.
