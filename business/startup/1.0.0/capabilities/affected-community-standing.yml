kind: capability
slug: affected-community-standing
title: Affected-Community Governance Standing
level: L3
parent: governance-bodies
summary: Structural governance rights for those most directly affected by a commons decision — regardless of financial stake or formal
  governance seat weight. Funders cannot outvote those who live with the consequences. When urban funders outvote rural residents
  on rewilding decisions, the governance has failed its most affected participants.
