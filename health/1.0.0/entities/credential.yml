kind: entity
slug: credential
title: Credential
type: governance
summary: A verified qualification other than a licence or specialty, such as resuscitation training, radiation protection or device
  instruction, that a role, privilege or task requires and that lapses if not renewed.
attributes:
- name: employee
  type: reference(employee)
  card: 1..1
- name: credential-kind
  type: code
  card: 1..1
- name: issuer
  type: reference(organisation)
  card: 0..1
- name: obtained-on
  type: date
  card: 1..1
- name: expires-on
  type: date
  card: 0..1
- name: evidence
  type: document
  card: 0..1
- name: verified-by
  type: reference(employee)
  card: 0..1
states:
- pending-verification
- valid
- expiring
- expired
- revoked
relations:
- type: governed-by
  target: policy
binds:
- source: src-018
  edition: 4.0.1
  jurisdiction: global
- source: src-410
  edition: '3.0'
  jurisdiction: global
