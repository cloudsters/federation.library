summary: 'A peer this person makes work with — a co-author, a fellow maker, a colleague inside a shared piece. Held apart from `professional-network`,
  which is reach, and from `client`, which is exchange for a return: a collaborator is in the work itself, and what is recorded is
  what each brings and how the credit is shared.'
