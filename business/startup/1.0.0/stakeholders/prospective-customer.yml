title: Prospective Customer
nature: organisation
stance: served
summary: An organisation or person who has shown interest, asked for information or been identified as a fit, but has not yet bought.
  Most of them meet the commons first through its website, a trade fair or a recommendation.
seeks:
- Quick, honest answers to its question and enough evidence to judge whether the commons can solve its problem.
brings:
- Future demand, and a first outside view of how clearly the commons explains what it offers.
