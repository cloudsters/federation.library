kind: entity
slug: service-tariff
title: Service Tariff
type: governance
summary: The adopted charges for water, energy, heat, waste, drainage or transport, with the basic quantity, the reduced rates and
  who qualifies for them. The service operator proposes it and the council adopts it after public review, and every utility account
  and fare is charged by it.
