kind: entity
slug: service-continuity-plan
title: Service Continuity Plan
type: governance
summary: The recovery targets, backups and offline mode of an essential digital service, with the fallbacks placed in neighbourhoods
  in advance. The service owner keeps it with the neighbourhoods that hold the fallbacks and with emergency services, it is rehearsed
  regularly, and it is activated when central systems fail.
