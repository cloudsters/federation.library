kind: stakeholder
slug: external-peer-reviewer
title: External Peer Reviewer
nature: person
stance: serving
summary: A physician or nurse from another institution, trained in peer review, who reviews the commons' cases and practice as an
  equal and returns an outside view in a confidential, collegial dialogue.
seeks:
- Open access to records and to the treating team, and a commons that receives criticism as a contribution.
brings:
- An independent clinical judgement and practices proven elsewhere that internal review cannot provide.
