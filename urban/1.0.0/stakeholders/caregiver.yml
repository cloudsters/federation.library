kind: stakeholder
slug: caregiver
title: Caregiver
nature: person
stance: served
summary: A family member, neighbour or friend who cares for someone without pay and needs relief and recognition to keep caring. Many
  carers cannot take part in public life because their time is bound by care.
seeks:
- Relief shared with neighbours, meetings and services timed around care, and recognition of the work they do.
brings:
- Daily care that keeps others at home and in the community, and knowledge of where care falls through the gaps.
represented_by:
- civil-society-organisation
