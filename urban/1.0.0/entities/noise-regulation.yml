kind: entity
slug: noise-regulation
title: Noise Regulation
type: governance
summary: Rules on acceptable sound by place and hour, with the limits agreed for events and night-time life and the places kept quiet.
  The council adopts them as a rule of the city and the administration measures and enforces them, and permits and neighbourhood agreements
  set their sound limits under them.
