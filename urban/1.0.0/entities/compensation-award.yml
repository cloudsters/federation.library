kind: entity
slug: compensation-award
title: Compensation Award
type: transactional
summary: A payment or fee reduction made to a resident when a service failed them or broke a published guarantee, paid without a complaint
  when a guarantee is broken or as the remedy of a complaint or an ombudsman case. The service responsible records it and pays it
  from its compensation fund, and awards are counted in the complaint pattern report.
