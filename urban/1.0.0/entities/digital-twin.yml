kind: entity
slug: digital-twin
title: City Digital Twin
type: intelligence
summary: The virtual model of the city, its land, buildings, networks and flows, kept current for simulation and planning. The administration
  keeps it from the city's data sets and spatial layers, and planners, operators and residents use it to test changes before they
  are made.
