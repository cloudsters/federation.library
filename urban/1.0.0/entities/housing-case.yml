kind: entity
slug: housing-case
title: Housing Case
type: transactional
summary: The record of a household at risk of losing its home or without one, with its circumstances, the help given and the outcome.
  The housing officer keeps it with the household and the social worker involved, and uses it to prevent an eviction, arrange shelter
  the same day and follow the move into a settled home.
