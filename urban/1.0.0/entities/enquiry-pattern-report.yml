kind: entity
slug: enquiry-pattern-report
title: Enquiry Pattern Report
type: intelligence
summary: The regular account of what residents ask, by route, service, neighbourhood and group, how long they wait for an answer,
  which matters come back and who does not reach the city at all. The administration prepares it at a set rhythm with residents and
  frontline staff, and its findings go to the services concerned and to the council.
