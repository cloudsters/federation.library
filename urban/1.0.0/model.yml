id: urban
kind: urban-commons
gives: 'An urban commons, a city, a district or a region seen as one settlement, holds its value creation as one whole: how
  it perceives itself and holds its civic charter and mandate, the portfolio it builds, the civic community that carries it,
  the services it offers residents and visitors and the infrastructure that keeps its promises, read together. This offer
  holds what is authored so far whole: every stakeholder, the capability map from L0 to L3, every entity and solution, and
  every Body with its Posts; every value stream of the pack, the seven of Perception to Mandate, the five of Purpose to Portfolio,
  the five of Value to Sustainability, the eight of Portfolio to System, the seven of Participant to Community, the seven
  of Collaboration to Automation, the nine of Contributor to Succession, the eight of Discovery to Usage, the seven of Interest
  to Relationship, the seven of Proposition to Audience, the 12 of Demand to Fulfillment, the eight of Source to Alliance
  and the eight of Acquire to Retire, with the journeys, touchpoints and value exchanges beside them.'
asks: A Body that holds what the commons activates, and the commons' own evidence on its value creation.
