kind: stakeholder
slug: facilities-officer
title: Facilities Officer
nature: person
stance: serving
summary: A member of the city's facilities office who runs public buildings, their installations, energy use and shared use. The facilities
  officer knows which rooms stand empty, which installations fail and which buildings waste the most energy.
seeks:
- Buildings that are safe, efficient and used through the day and the year, and groups ready to share or take over the space the city
  does not need.
brings:
- Safe and working installations, published energy figures, rooms opened to neighbourhoods and support for those who take on a building.
represented_by:
- facilities-office
