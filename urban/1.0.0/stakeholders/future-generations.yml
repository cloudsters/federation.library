title: Future Generations
nature: group
stance: served
summary: Those who will live in the city later and inherit what is decided now. They cannot speak for themselves and depend on others
  to weigh their interests.
seeks:
- A city that does not spend what they will need, and decisions whose long effects are stated before they are taken.
brings:
- A claim on the long view, which tests every decision against what it leaves behind.
