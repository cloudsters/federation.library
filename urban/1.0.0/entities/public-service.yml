kind: entity
slug: public-service
title: Public Service
type: master
summary: A service the city delivers to residents, such as care, waste collection or a library, with its users, staff, standards,
  access rules and the council that shapes it. The department responsible keeps the record, and it is used to tell residents what
  they are entitled to, to plan the service and to check it against its standards.
attributes:
- name: name
  type: text
  card: 1..1
- name: service-kind
  type: code
  card: 1..1
- name: responsible-department
  type: reference(department)
  card: 1..1
- name: delivered-by
  type: text
  card: 0..*
- name: service-area
  type: reference(neighbourhood)
  card: 0..*
- name: eligibility-rules
  type: text
  card: 1..1
- name: open-regardless-of-status
  type: boolean
  card: 0..1
- name: service-standards
  type: text
  card: 0..*
- name: service-council
  type: reference(service-council)
  card: 0..1
- name: user-count
  type: integer
  card: 0..1
- name: staff-count
  type: integer
  card: 0..1
- name: data-use
  type: reference(processing-record)
  card: 0..*
states:
- planned
- operating
- under-review
- redesigned
- suspended
- withdrawn
relations:
- type: assigned-to
  target: department
- type: refers-to
  target: service-council
- type: governed-by
