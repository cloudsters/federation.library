kind: entity
slug: work-allocation-audit
title: Work Allocation Audit
type: intelligence
summary: The findings of staff and of the workers of contracted services on how a system assigns tasks, sets schedules and pay and
  judges performance, with the method and data they used. The staff representatives and workers who carry it out record it and bring
  it to the service, which must answer it and change what is unfair, and it feeds the staff agreement and the monitoring of the system.
