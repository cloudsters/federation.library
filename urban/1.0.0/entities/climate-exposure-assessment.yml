kind: entity
slug: climate-exposure-assessment
title: Climate Exposure Assessment
type: intelligence
summary: The assessment of how heat, heavy rain, flooding and erosion threaten each class of asset and each neighbourhood, drawn from
  hazard maps, past floods and the knowledge of residents who live with them. The asset office prepares it with the operators and
  residents, and it feeds the adaptation plan and the asset plan.
