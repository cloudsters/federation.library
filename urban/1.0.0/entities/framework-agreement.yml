kind: entity
slug: framework-agreement
title: Framework Agreement
type: governance
summary: An agreement that sets prices and terms for repeated purchases over a period, for the city alone or for several parties under
  a joint purchasing agreement, against which orders are placed as needed within agreed volume bands. The procurement office or the
  shared procurement service awards and keeps it, and members, and purchasing groups where the statutory framework allows, order under
  it.
