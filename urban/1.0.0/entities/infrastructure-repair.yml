title: Infrastructure Repair
type: transactional
summary: A maintenance or repair action on public infrastructure, including the digital networks, with its fault, cost and the neighbourhoods
  affected. The operator of the infrastructure records it from the fault report to completion, and the records show the city whether
  its upkeep plan keeps pace with wear.
