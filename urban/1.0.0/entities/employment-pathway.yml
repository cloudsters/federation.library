kind: entity
slug: employment-pathway
title: Employment Pathway
type: transactional
summary: A resident's path from seeking work to holding stable work or a share in a cooperative, with skills, constraints, placements
  and support given. A community coordinator opens and keeps it with the resident, and it is used to match the resident to openings,
  apprenticeships and transition support and to report placements.
