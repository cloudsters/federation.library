kind: entity
slug: automated-decision-challenge
title: Automated Decision Challenge
type: transactional
summary: A challenge by a resident or worker to a decision made or prepared by an automated system, from receipt through review by
  a person to its outcome and any remedy. The department accountable for the system records and answers it within its deadline, and
  challenges are counted in the monitoring of the system and may cause its suspension.
