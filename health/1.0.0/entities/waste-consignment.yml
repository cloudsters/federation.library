  type: code
  card: 1..1
- name: quantity
  type: quantity
  card: 1..1
- name: origin-site
  type: reference(site)
  card: 1..1
- name: carrier
  type: reference(supplier-organisation)
  card: 1..1
- name: destination
  type: reference(organisation)
  card: 1..1
- name: collected-on
  type: date
  card: 1..1
- name: disposal-evidence
  type: document
  card: 0..1
states:
- prepared
- collected
- in-transit
- disposed
- rejected
relations:
- type: governed-by
  target: compliance-obligation
- type: governed-by
  target: contract
