summary: The city's statement, often shared with its neighbouring municipalities, of what it offers to enterprises, institutions and
  returning residents and which investment it seeks. The economic development office keeps it from evidence and from the city profile,
  and it is used to answer enquiries honestly and to promote the region together rather than by tax breaks.
