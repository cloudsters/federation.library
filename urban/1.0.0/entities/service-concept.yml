kind: entity
slug: service-concept
title: Service Concept
type: transactional
summary: The concept of a new or changed service, with whom it serves, what it offers, its channels and places and how a person reaches
  a human. The department shapes it with the residents who will use it and the staff who will deliver it, and it is the basis of the
  case, the trial and the launch.
