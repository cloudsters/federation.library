kind: entity
slug: premise
title: Premise
type: master
summary: A belief this life already rests other beliefs on, written down so it can be looked at. Not an aspiration and not an identity
  — the thing already running. Most are absorbed from family and surroundings rather than chosen, which is the whole reason for writing
  them out. A premise is dated, may be superseded, and is retired rather than deleted.
