# The variant corporate of the business model; startup is its sibling.
id: business
variant: {name: corporate, after: startup}
title: 'Business: corporate'
kind: business-commons
gives: 'A corporate commons, a group of several legal entities that makes goods and renders services across borders, with
  owners, a governing board, an executive board and employee co-determination, holds its value creation as one whole: what
  it is there for, the portfolio it builds, the community that carries it, the propositions it brings to its audiences and
  the production that keeps its promises, read together. This model holds 84 streams in all thirteen families, the capability
  map from L0 to L3, every entity and solution, and every Body with its Posts; the variant startup shares 35 of its streams.'
asks: A Body that holds what the commons activates, and the commons' own evidence on its value creation.
