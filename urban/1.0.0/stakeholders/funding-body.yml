kind: stakeholder
slug: funding-body
title: Funding Body
nature: organisation
stance: serving
summary: A higher level of government, a regional pool, a fund or a foundation that transfers or grants money to the city on stated
  conditions. It sets the formulae and calls by which money reaches the city and audits how it was spent.
seeks:
- Correct data for its formulae, applications that meet its purpose, and grants spent to their conditions and reported on time.
brings:
- Transfers, equalisation shares and grants, with the conditions and the evidence it requires.
