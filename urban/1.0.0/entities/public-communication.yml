kind: entity
slug: public-communication
title: Public Communication
type: transactional
summary: An item of information the city releases, such as a notice, a press release, an article, a post, a warning or a correction,
  with its date, audiences, languages and channels. The department concerned or the communications office prepares and records it,
  and it is used to tell residents what changed, why and for whom, and to correct what was wrong as openly as it was said.
