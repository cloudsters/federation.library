kind: stakeholder
slug: health-planning-authority
title: Health Planning Authority
nature: organisation
legal_form: public-body
stance: served
summary: The public body that plans care for a population and assigns each provider its care mandate, its service groups and
  its beds, alone or jointly with neighbouring authorities.
seeks:
- Reliable coverage of the population's needs, concentration of complex care where quality is highest and efficient use of
  public funds.
brings:
- The care mandate and the assignment of services that define what the commons may provide and be paid for.
