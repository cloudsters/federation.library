  type: period
  card: 1..1
- name: festivals
  type: reference(festival)
  card: 0..*
- name: cultural-performances
  type: reference(cultural-performance)
  card: 0..*
- name: community-events
  type: reference(community-event)
  card: 0..*
- name: market-days
