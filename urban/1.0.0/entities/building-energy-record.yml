- name: energy-use-by-source
  type: document
  card: 0..1
- name: energy-intensity
  type: decimal
  card: 0..1
- name: emissions
  type: quantity
  card: 0..1
- name: renewable-share
  type: decimal
  card: 0..1
- name: energy-cost
  type: amount
  card: 0..1
- name: meters
  type: reference(sensor)
  card: 0..*
- name: retrofit-measures
  type: text
  card: 0..*
- name: community-energy-partner
  type: reference(cooperative)
  card: 0..1
- name: published-as
  type: reference(public-record)
  card: 0..1
states:
