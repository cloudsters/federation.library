kind: entity
slug: adaptation-plan
title: Adaptation Plan
type: governance
summary: The plan for adapting the city's exposed assets and neighbourhoods, with the options chosen with residents, how costs are
  shared and where planned retreat applies. The council adopts it, and adaptation works are delivered and monitored under it.
