kind: entity
slug: category-strategy
title: Category Strategy
type: governance
summary: The plan for how the city buys within one category, with the choice of who provides, the size of lots, the length of contracts,
  buying alone or with others, whether open code is required and which criteria weigh most. The category team writes it and reviews
  it before each major tender, and the council decides where the choice between own provision and contract is large.
