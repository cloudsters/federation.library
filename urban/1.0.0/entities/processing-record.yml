kind: entity
slug: processing-record
title: Record of Processing
type: governance
summary: The record of one use of personal data, with its purpose, lawful basis, the data used, who may see it and how long it is
  kept. The department that uses the data keeps it with the data protection officer, and it is the basis for impact assessments, residents'
  requests and the yearly review.
attributes:
- name: reference-number
  type: identifier
  card: 1..1
- name: purpose
  type: text
  card: 1..1
- name: legal-basis
  type: code
  card: 1..1
- name: responsible-department
  type: reference(department)
  card: 1..1
- name: data-categories
  type: code
  card: 1..*
- name: data-sets
  type: reference(data-set)
  card: 0..*
- name: data-subjects
  type: text
  card: 1..*
- name: recipients
  type: text
  card: 0..*
- name: retention-period
  type: text
  card: 1..1
- name: automated-system
  type: reference(automated-system-register)
  card: 0..1
- name: impact-assessment
  type: reference(data-impact-assessment)
  card: 0..1
- name: registered-on
  type: date
  card: 1..1
states:
- proposed
- assessed
- registered
- in-use
- under-review
- ended
relations:
- type: refers-to
  target: data-set
- type: refers-to
  target: automated-system-register
- type: based-on
  target: data-impact-assessment
- type: governed-by
  target: obligation-register
- type: refers-to
  target: consent-record
