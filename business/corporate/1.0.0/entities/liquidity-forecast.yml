kind: entity
slug: liquidity-forecast
title: Liquidity Forecast
type: intelligence
summary: An estimate of cash inflows, outflows and balances per legal entity and currency over a coming horizon, built from receivables,
  payables, payroll, investment and financing, used to secure solvency and plan funding.
attributes:
