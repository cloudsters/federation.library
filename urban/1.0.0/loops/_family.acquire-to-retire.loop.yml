# The steering loop of the family Acquire to Retire in the urban pack, authored by the maker in the form of the
# business pack's family loops. Its measures come with the depth (step 7).
loop: _family.acquire-to-retire
title: Keep the family 'Acquire to Retire' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: acquire-to-retire
  vs:
  - infrastructure-asset-planning
  - land-and-property-acquisition
  - public-works-design-and-construction
  - infrastructure-maintenance-and-renewal
  - climate-adaptation-and-green-infrastructure
  - public-buildings-and-facilities
  - asset-decommissioning-and-material-recovery
  - repair-reuse-and-sharing
stance: The city holds its infrastructure assets from acquisition to retirement. No single stream of this family can see what
  its streams do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed reporting period of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was activated, adapted or not selected in the registry
  - a source the research declares in knowledge/sources.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/acquire-to-retire
  - value-model.yml#vs/infrastructure-asset-planning
  - value-model.yml#vs/land-and-property-acquisition
  - value-model.yml#vs/public-works-design-and-construction
  - value-model.yml#vs/infrastructure-maintenance-and-renewal
  - value-model.yml#vs/climate-adaptation-and-green-infrastructure
  - value-model.yml#vs/public-buildings-and-facilities
  - value-model.yml#vs/asset-decommissioning-and-material-recovery
  - value-model.yml#vs/repair-reuse-and-sharing
  registry:
  - registry/value-streams/infrastructure-asset-planning.yml
  - registry/value-streams/land-and-property-acquisition.yml
  - registry/value-streams/public-works-design-and-construction.yml
  - registry/value-streams/infrastructure-maintenance-and-renewal.yml
  - registry/value-streams/climate-adaptation-and-green-infrastructure.yml
  - registry/value-streams/public-buildings-and-facilities.yml
  - registry/value-streams/asset-decommissioning-and-material-recovery.yml
  - registry/value-streams/repair-reuse-and-sharing.yml
  loop_states:
  - operations/loops/_state/infrastructure-asset-planning.yml
  - operations/loops/_state/land-and-property-acquisition.yml
  - operations/loops/_state/public-works-design-and-construction.yml
  - operations/loops/_state/infrastructure-maintenance-and-renewal.yml
  - operations/loops/_state/climate-adaptation-and-green-infrastructure.yml
  - operations/loops/_state/public-buildings-and-facilities.yml
  - operations/loops/_state/asset-decommissioning-and-material-recovery.yml
  - operations/loops/_state/repair-reuse-and-sharing.yml
  standards: knowledge/sources.yml — edition and status of every source that informs the family's records
authority: family-steward
state: operations/loops/_state/_family.acquire-to-retire.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never writes into
  the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided or passed
    to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or the commons does not select the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared source superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
