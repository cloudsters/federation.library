kind: entity
slug: emergency-plan
title: Emergency Plan
type: governance
summary: The plan of crisis thresholds, alert levels and roles, the bounded emergency powers that end on a fixed date, and the continuity
  of essential services. The administration keeps it with emergency services, infrastructure operators and neighbourhoods, exercises
  it, and activates it when an emergency strikes.
