slug: case-manager
title: Case Manager
nature: person
stance: serving
summary: A nurse or social worker who coordinates a patient's path across departments and providers, plans discharge from admission
  onwards and arranges follow-on care.
seeks:
- Early information on each patient's needs, reliable partners for follow-on care and the authority to coordinate.
brings:
- Coordinated paths and timely discharges that free beds and prevent readmissions.
