kind: stakeholder
slug: young-people
title: Young People
nature: group
stance: served
summary: Children and young residents who will live longest with what the city decides and who take part in shaping its future. They
  are rarely in the room where long-term decisions are taken.
seeks:
- Real power in the decisions that shape the city they will inherit, beside adults rather than apart from them.
brings:
- The futures they imagine for the city, the long view of those who will live in it longest, and their own media and networks.
