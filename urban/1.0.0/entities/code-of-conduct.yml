title: Code of Conduct
type: governance
summary: The rules of conduct for councillors and officials, with the lines they will not cross and the rules on gifts, other roles
  and conflicts of interest. The council adopts and renews it, every councillor and official accepts it, and it is the measure against
  which reports of misconduct are investigated.
