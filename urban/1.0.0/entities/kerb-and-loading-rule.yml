kind: entity
slug: kerb-and-loading-rule
title: Kerb and Loading Rule
type: governance
summary: The rule for a street or district on loading zones, delivery windows, vehicle limits, parking and their charges. The transport
  office drafts it with the neighbourhood and carriers and it is made under the mobility plan, and it is used to keep heavy vehicles
  out of residential streets at harmful hours and to keep the kerb clear.
