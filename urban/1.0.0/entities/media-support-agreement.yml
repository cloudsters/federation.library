kind: entity
slug: media-support-agreement
title: Media Support Agreement
type: governance
summary: The agreement under which the city supports a community outlet with space, equipment or money, leaving editorial decisions
  with the residents who run it and stating its term. The outlet and the department that gives the support sign it, and it is used
  to protect the outlet when it criticises the city and to review whether it has stayed independent.
