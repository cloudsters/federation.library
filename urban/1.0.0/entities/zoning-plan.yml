kind: entity
slug: zoning-plan
title: Zoning Plan
type: master
summary: The land-use rules that state what may be built and done on each parcel, adopted to carry the masterplan, including mixed
  uses, mixed-income housing, space for commons and the share of the rise in land value returned to the community. The planning department
  drafts and reviews it, the council adopts it, and every planning decision on a parcel is tested against it.
