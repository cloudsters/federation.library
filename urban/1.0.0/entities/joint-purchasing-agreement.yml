kind: entity
slug: joint-purchasing-agreement
title: Joint Purchasing Agreement
type: governance
summary: The agreement between municipalities, anchor institutions or municipal enterprises to buy together, stating who runs each
  tender, how decisions are taken with rotating representation, how volumes, costs and savings are shared, how disputes are resolved
  and how a party leaves. Each party's council or board approves it, the parties keep it together, and it is revised after each yearly
  alliance review.
