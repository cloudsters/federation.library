kind: entity
slug: improvement-opportunity
title: Improvement Opportunity
type: transactional
summary: A proposal to make a process of the administration simpler or more reliable, put forward by a department, a member of staff
  or a resident, with the delay, error or overload it addresses. The administration logs and sizes it on intake and gives it a process
  owner, and it is used to choose which processes are mapped and redesigned first.
