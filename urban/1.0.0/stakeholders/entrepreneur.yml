kind: stakeholder
slug: entrepreneur
title: Entrepreneur
nature: person
stance: served
summary: A resident who starts or runs an enterprise, alone or with others, and needs advice, space, finance and mentoring. Entrepreneurs
  include young people, newcomers, women returning to work and informal traders who formalise their trade.
seeks:
- One point of advice in their language, affordable space, finance on terms that follow their income, a mentor, and support that ends
  when the enterprise can stand on its own.
brings:
- An idea, their work and savings, the jobs and services their enterprise creates, and an honest account of what held them back.
represented_by:
- business-association
