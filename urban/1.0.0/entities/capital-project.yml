- name: name
  type: text
  card: 1..1
- name: project-kind
  type: code
  card: 1..1
- name: asset
  type: text
  card: 1..1
- name: programme
  type: reference(city-programme)
  card: 1..1
- name: scope
  type: text
  card: 1..1
- name: budget
  type: amount
  card: 1..1
- name: schedule
  type: period
  card: 1..1
- name: land
  type: reference(land-parcel)
  card: 0..*
- name: procurements
  type: reference(public-procurement)
  card: 0..*
- name: contracts
  type: reference(contract)
  card: 0..*
- name: completed-on
  type: date
  card: 0..1
states:
- planned
- approved
- procuring
- under-construction
- completed
- handed-over
- closed
