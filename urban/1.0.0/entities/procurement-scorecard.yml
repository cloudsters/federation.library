kind: entity
slug: procurement-scorecard
title: Procurement Scorecard
type: governance
summary: The published criteria and weights beyond price by which the city judges offers, such as local ownership, living wages, worker
  voice, circular use and emissions, with the evidence each criterion asks for and how it is scored. Residents, workers and suppliers
  set it with the procurement office, the council adopts it in the procurement policy, and every tender applies it and every evaluation
  scores against it.
