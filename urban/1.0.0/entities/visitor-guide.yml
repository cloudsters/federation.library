kind: entity
slug: visitor-guide
title: Visitor Guide
type: master
summary: The information given to visitors in several languages, at arrival points and online, about the city beyond its sights, its
  events, markets and cultural exchange and what residents ask of them. The administration keeps it with host neighbourhoods, cultural
  bodies and local businesses, and it is handed out at arrival points and in accommodation and kept current online.
