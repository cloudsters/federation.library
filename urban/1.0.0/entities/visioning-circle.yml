kind: entity
slug: visioning-circle
title: Visioning Circle
type: transactional
summary: A gathering of a neighbourhood, school, trade or community body that imagines and discusses the future it wants, including
  the knowledge of uncertain futures that street vendors, informal workers, elders and young people already hold. The body that convenes
  it records it with the support of the administration, and its record goes into the scenarios and the draft vision.
