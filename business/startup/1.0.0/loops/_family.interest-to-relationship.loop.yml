# startup's family loop: corporate's loop of the same slug, its streams those of startup 
loop: _family.interest-to-relationship
title: Keep the family 'Interest to Relationship' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: interest-to-relationship
  vs:
  - market-stakeholder-sensing
  - value-narrative-design
  - engagement-cultivation
  - relationship-journey-design
stance: Cultivate awareness into a lasting 1:1 relationship. No single stream of this family can see what its streams do to
  one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed reporting period of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was activated, adapted or not selected in the registry
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/interest-to-relationship
  - value-model.yml#vs/market-stakeholder-sensing
  - value-model.yml#vs/value-narrative-design
  - value-model.yml#vs/engagement-cultivation
  - value-model.yml#vs/relationship-journey-design
  registry:
  - instance/registry/5_value-streams/market-stakeholder-sensing.md
  - instance/registry/5_value-streams/value-narrative-design.md
  - instance/registry/5_value-streams/engagement-cultivation.md
  - instance/registry/5_value-streams/relationship-journey-design.md
  loop_states:
  - instance/operations/loops/_state/market-stakeholder-sensing.yml
  - instance/operations/loops/_state/value-narrative-design.yml
  - instance/operations/loops/_state/engagement-cultivation.yml
  - instance/operations/loops/_state/relationship-journey-design.yml
  measures:
  - account-health-reviews-held
  - audience-opt-out-rate
  - campaign-target-audience-reach
  - campaigns-with-measured-effect
  - competitor-profiles-kept-current
  - decisions-drawing-on-the-market-picture
  - early-loss-of-new-customers
  - intent-signals-verified-before-use
  - lost-opportunities-with-a-recorded-reason
  - market-picture-currency
  - marketing-contacts-with-valid-consent
  - marketing-cost-per-accepted-lead
  - opportunity-win-rate
  - price-realisation
  - prioritised-opportunities-decided
  - promise-matched-by-experience
  - qualified-leads-accepted-by-sales
  - revenue-retained-from-existing-customers
  - sales-cycle-duration
  - segments-with-an-agreed-value-narrative-in-use
  - value-claims-with-evidence
  - value-narratives-reviewed-against-experience
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.interest-to-relationship.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never writes into
  the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided or passed
    to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or the commons declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
