kind: entity
slug: civic-memory-record
title: Civic Memory Record
type: intelligence
summary: A recorded founding story, neighbourhood history or harm the city has done or allowed, such as displacement or exclusion,
  gathered with those who carry it and kept beside the official history rather than in its place. The city keeps it on terms agreed
  with its carriers, and it is used in drafting the charter and in naming places.
