kind: stakeholder
slug: certification-body
title: Certification Body
nature: organisation
stance: served
summary: An accredited body that audits the company's management systems, products or processes against a standard and issues, maintains
  or withdraws the certificate customers and authorities require.
seeks:
- Complete evidence, open access during audits and findings corrected on time.
brings:
- Certificates that customers and authorities accept as proof, and an outside view that sharpens the company's own processes.
represented_by:
- counterparty
