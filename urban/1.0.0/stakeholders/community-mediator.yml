kind: stakeholder
slug: community-mediator
title: Community Mediator
nature: person
stance: serving
summary: A trusted resident trained to help neighbours resolve disputes and repair harm through mediation and restorative circles.
  Mediators are drawn from elders, faith practitioners, cultural brokers and other residents whom neighbours already trust.
seeks:
- Training through observed practice, support when a case is hard, and recognition of their standing by the city and the formal routes.
brings:
- Trust in the neighbourhood, languages, knowledge of local custom and the skill to help each party be heard.
represented_by:
- community-mediation-service
