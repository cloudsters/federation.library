kind: stakeholder
slug: lender
title: Lender
nature: organisation
stance: serving
summary: A bank, public development bank, community finance institution or resident who lends to the city and is owed repayment, not
  a say in its decisions. Lenders include residents who buy the city's bonds in small amounts.
seeks:
- Repayment on the agreed terms, a clear view of the city's finances and a city that keeps its word.
brings:
- Finance for the city's capital projects, deposits and credit for residents and local businesses, and terms that spread repayment
  over the life of what is built.
