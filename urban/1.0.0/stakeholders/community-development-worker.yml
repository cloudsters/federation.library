kind: stakeholder
slug: community-development-worker
title: Community Development Worker
nature: person
stance: serving
summary: A worker of the municipality or a partner who supports residents and neighbourhood bodies to organise, take part and act
  together. Community workers reach residents where they already gather and stay long enough to be trusted.
seeks:
- Time to build relationships, a mandate that lets residents set the agenda, and a city that answers what neighbourhoods ask of it.
brings:
- Trusted ties in the neighbourhoods, knowledge of who is not yet connected, and skill in organising, facilitating and mapping.
represented_by:
- community-development-department
