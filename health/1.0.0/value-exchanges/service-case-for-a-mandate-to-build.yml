kind: value-exchange
slug: service-case-for-a-mandate-to-build
title: Service Case for a Mandate to Build
between:
- head-of-clinical-department
- executive
offered:
- The department head offers a worked service concept with evidence of need, a staffed model, a business case and the department's
  commitment to deliver the service and report on it.
returned:
- The executive returns a decision with funding, positions, space and a mandate to build the service, together with the measures
  and the date of its value review.
touchpoint: board-meeting
