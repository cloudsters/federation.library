title: Energy Strategy
type: governance
summary: The city's plan for power and heat, with renewable generation, heat networks, retrofit, community ownership and the transition
  of fossil energy workers. The energy office drafts it from the map of demand and sources and the council adopts it, and it decides
  where heat networks, generation and retrofit go first.
