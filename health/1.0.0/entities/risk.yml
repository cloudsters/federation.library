kind: entity
slug: risk
title: Risk
type: governance
summary: An uncertain event or condition that would affect patients, staff, finances, operations or reputation, assessed for
  likelihood and impact, owned by a named unit and treated by controls.
attributes:
- name: risk-category
  type: code
  card: 1..1
- name: description
  type: text
  card: 1..1
- name: likelihood
  type: code
  card: 1..1
- name: impact
  type: code
  card: 1..1
- name: owner-unit
  type: reference(organisation-unit)
  card: 1..1
- name: controls
  type: text
  card: 0..*
- name: residual-rating
  type: code
  card: 0..1
- name: review-date
  type: date
  card: 1..1
states:
- identified
- assessed
- in-treatment
- accepted
- closed
relations:
- type: governed-by
  target: policy
- type: produces
  target: corrective-action
binds:
- source: src-018
  edition: 4.0.1
  jurisdiction: global
- source: src-056
  edition: '2021'
  jurisdiction: global
- source: src-001
  edition: '2026'
  jurisdiction: global
- source: src-077
  edition: '2025'
  jurisdiction: global
