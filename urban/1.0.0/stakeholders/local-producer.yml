kind: stakeholder
slug: local-producer
title: Local Producer
nature: person
stance: served
summary: A farmer, food producer, craftsperson or maker of the city or its region who sells what they make. Local producers keep crafts,
  food and making alive in the neighbourhoods.
seeks:
- A pitch at a market, a fair price paid directly, shared workshops they could not afford alone and a name they hold in common with
  other producers.
brings:
- Fresh food and goods made nearby, craft knowledge passed between generations and income that stays in the region.
represented_by:
- business-association
- market-vendor-council
