kind: entity
slug: payment-arrangement
title: Payment Arrangement
type: transactional
summary: One agreed arrangement covering all a resident owes the city, with instalments set to the timing and size of their income
  and recovery paused while it holds. The revenue office agrees it with the resident through one named person, and a missed instalment
  brings a conversation and a revision rather than a penalty.
attributes:
- name: reference-number
  type: identifier
  card: 1..1
- name: accounts
  type: reference(taxpayer-account)
  card: 1..*
- name: arrears-cases
  type: reference(arrears-case)
  card: 1..*
- name: total-owed
  type: amount
  card: 1..1
- name: instalment-schedule
  type: document
  card: 1..1
- name: income-rhythm
  type: code
  card: 1..1
- name: recovery-paused
  type: boolean
  card: 1..1
- name: named-contact
  type: text
  card: 1..1
- name: relief-decisions
  type: reference(tax-relief-decision)
  card: 0..*
- name: arrangement-period
  type: period
  card: 1..1
- name: agreed-on
  type: date
  card: 1..1
- name: missed-instalments
  type: integer
  card: 0..1
states:
- proposed
- agreed
- in-force
- under-revision
- completed
- ended
relations:
- type: based-on
  target: taxpayer-account
- type: refers-to
  target: arrears-case
- type: refers-to
  target: tax-relief-decision
- type: refers-to
  target: entitlement-decision
- type: produces
  target: payment
