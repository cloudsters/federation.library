kind: entity
slug: ombudsman-case
title: Ombudsman Case
type: transactional
summary: A complaint taken to the ombudsman independent of the administration by a complainant who is not satisfied with the city's
  answer or received none in time, followed from receipt through investigation to the remedy ordered. The office of the ombudsman
  keeps it apart from the administration, and its outcome goes to the service that must put it right and into the public report of
  the ombudsman to the council.
