kind: entity
slug: asset-plan
title: Asset Plan
type: governance
summary: The city's plan for its infrastructure over its whole life, with service levels, lifecycle plans for each class of asset
  and the renewal priorities agreed with neighbourhoods. The asset office prepares it, the council adopts it with the budget, and
  it feeds the capital investment plan and the medium-term financial plan.
