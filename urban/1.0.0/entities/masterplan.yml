kind: entity
slug: masterplan
title: Masterplan
type: master
summary: The city-wide spatial plan that sets land use, density, centres, green and blue networks and movement corridors over the
  long term, and where the city grows, densifies, protects and retreats. The planning department prepares it with residents, the council
  adopts it with its reasons, and land-use rules, district plans and capital investment are bound to it.
