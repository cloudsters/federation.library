kind: entity
slug: culture-plan
title: Culture Plan
type: governance
summary: The agreed plan for what the city funds in culture, the spaces it keeps and how residents take part in making culture as
  well as attending it. The administration agrees it with artists, cultural organisations and neighbourhoods and the council adopts
  it, and grants, workspaces and venue support are decided under it.
