kind: entity
slug: planning-application
title: Planning Application
type: transactional
summary: A formal submission for a change of land use or for development, with the proposal, the parcels it covers, the consultation
  held and the decision taken. The planning department of the administration records and decides it or puts it to the council, and
  it is one of the processes in which an automated system may prepare a decision only under the assurance of this family.
