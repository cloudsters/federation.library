kind: entity
slug: hub-operating-agreement
title: Hub Operating Agreement
type: governance
summary: The agreement under which a neighbourhood, carriers, retailers, producers and workers run a hub, with schedules, allocations,
  pay, safety and commission. The parties sign it and keep it together with the city, and it is used to settle slots, protect workers
  who stop an unsafe schedule and cap what producers pay.
