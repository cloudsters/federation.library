kind: entity
slug: capital-investment-plan
title: Capital Investment Plan
type: governance
summary: The multi-year plan of the city's investment in infrastructure, buildings and land, with its projects, funding sources and
  provision for upkeep. The administration prepares it from the strategy and the masterplan, and the council adopts it with the budget.
