kind: entity
slug: communication-channel
title: Communication Channel
type: master
summary: A channel through which the city reaches residents, such as its website, a social media account, a newsletter, a notice board,
  a telephone line or a display in a service point, with its audience and its keeper. The communications office keeps the list of
  channels, and it is used to run them as one set with the same information and to see who is reached offline.
