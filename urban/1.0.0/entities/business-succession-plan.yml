kind: entity
slug: business-succession-plan
title: Business Succession Plan
type: transactional
summary: The plan for passing a local business to a successor, with the timetable, the successor, the mentoring, the capital and the
  price. The owner draws it up with a district succession guide, and it is used to match and mentor the successor, to arrange transition
  capital and to report how many businesses stay in the community.
