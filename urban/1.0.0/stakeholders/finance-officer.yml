kind: stakeholder
slug: finance-officer
title: Finance Officer
nature: person
stance: serving
summary: A finance professional of the municipality, such as the treasurer, a budget officer, an accountant or a revenue officer,
  who prepares, records and reports the city's finances. Finance officers keep one true record of the city's money and answer for
  it to the council and to residents.
seeks:
- Adopted rules for revenue, spending and borrowing, timely bids and reports from departments, and residents who can follow the accounts.
brings:
- Forecasts, budgets, bills, books and reports that show where the city's money comes from, where it is held and where it goes.
represented_by:
- finance-department
