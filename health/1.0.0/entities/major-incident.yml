kind: entity
slug: major-incident
title: Major Incident
type: transactional
summary: A declared situation in which demand or damage overwhelms normal operations, such as a mass-casualty event, a long
  system outage, a fire or an epidemic surge, run under incident command from declaration through stand-down to recovery and
  debrief.
attributes:
- name: hazard
  type: code
  card: 1..1
- name: declared-at
  type: datetime
  card: 1..1
- name: alert-level
  type: code
  card: 1..1
- name: incident-commander
  type: reference(employee)
  card: 1..1
- name: plan-activated
  type: reference(emergency-preparedness-plan)
  card: 1..1
- name: affected-services
  type: reference(care-service)
  card: 0..*
- name: stood-down-at
  type: datetime
  card: 0..1
- name: debrief
  type: document
  card: 0..1
states:
- declared
- in-response
- stood-down
- in-recovery
- closed
relations:
- type: based-on
  target: emergency-preparedness-plan
- type: produces
  target: corrective-action
binds:
- source: src-434
  edition: 2.0-cs02
  jurisdiction: global
- source: src-450
  edition: 2.0 CS02
  jurisdiction: global
- source: src-536
  edition: '2011'
  jurisdiction: global
