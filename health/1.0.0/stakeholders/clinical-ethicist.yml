kind: stakeholder
slug: clinical-ethicist
title: Clinical Ethicist
nature: person
stance: serving
summary: A person trained in clinical ethics, often a physician, nurse, chaplain or philosopher, who facilitates ethics consultations
  and team deliberations and serves the ethics committee. Advises; the treating team keeps the decision.
seeks:
- Early involvement in difficult cases, protected time and the independence to weigh every view impartially.
brings:
- Structured deliberation that turns moral conflict at the bedside into reasoned recommendations and, over time, into ethics
  policies.
represented_by:
- employee
