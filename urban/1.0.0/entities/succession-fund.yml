kind: entity
slug: succession-fund
title: Succession Fund
type: master
summary: The community-governed fund that lends to employees, apprentices and cooperatives buying into a business so that it stays
  in the community. Its governing body decides the loans and keeps the accounts, and it is used to finance successions and to report
  each year how the fund performed.
