kind: entity
slug: service-standard
title: Service Standard
type: governance
summary: The published standard residents can expect of a service, such as response times, accessibility, how to reach a person and
  the remedy when the service fails. The service sets it with those who use and deliver it and the responsible department keeps and
  publishes it, and it is used to check quality, to answer failures and to grant redress.
