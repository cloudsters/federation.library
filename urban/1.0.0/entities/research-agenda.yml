kind: entity
slug: research-agenda
title: Urban Research Agenda
type: governance
summary: The questions the city most needs research to answer over a period, drawn from its strategy, from residents' concerns and
  from gaps in its own data, each with its priority and the decisions it serves. The administration sets it with residents and staff
  and the council adopts it, and it is used to choose research partners, projects and trials.
