title: Ombudsman
nature: organisation
stance: serving
summary: An independent office that investigates complaints against the city and orders remedies. Complainants reach it directly,
  and it reports failures across the city to the council in public.
seeks:
- Full access to the records and staff of the city, complaints brought early, and remedies carried out within the time it sets.
brings:
- An independent decision on complaints the city did not resolve, orders for remedy, and a public account of where the city fails
  residents again and again.
