kind: entity
slug: workforce-plan
title: Workforce Plan
type: governance
summary: The plan approved by the council of the staff, skills and AI agents each department needs over the term, with targets for
  recruitment, apprenticeships, local hiring, succession and automation and the work that stays with a person. The personnel function
  drafts it with departments and staff representatives, and it is used to fund positions, to open vacancies and to check actual staffing
  each quarter.
