kind: entity
slug: workforce-transition-plan
title: Workforce Transition Plan
type: governance
summary: The plan for workers whose work is phased out, with who is affected, the income floor, the retraining paths, the routes into
  ownership and the date of review. The city writes it with the workers and their unions, and it is used to pay wage replacement,
  to open retraining and to extend or end the guarantee at its review.
