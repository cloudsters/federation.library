- name: subject
  type: text
  card: 1..1
- name: category
  type: reference(procurement-category)
  card: 1..1
- name: planned-purchase
  type: reference(procurement-plan)
  card: 0..1
- name: held-on
  type: date
  card: 1..1
- name: format
  type: code
  card: 1..1
- name: participants
  type: text
  card: 0..*
- name: questions-and-answers
  type: document
  card: 1..1
- name: barriers-raised
  type: text
  card: 0..*
- name: changes-made
  type: text
  card: 0..*
- name: interest-declarations
  type: reference(interest-declaration)
  card: 0..*
- name: shared-on
  type: date
  card: 0..1
- name: resulting-procurement
  type: reference(public-procurement)
  card: 0..1
states:
