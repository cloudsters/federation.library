kind: entity
slug: welcome-point
title: Welcome Point
type: master
summary: A place in a neighbourhood, often in a trusted community building, where newcomers are received in their own language and
  told their rights and where to turn. The city runs it, often with a faith community or civil-society organisation that holds the
  building, and it is used to receive newcomers and to point them to services, learning and neighbours.
