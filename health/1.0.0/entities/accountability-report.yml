kind: entity
slug: accountability-report
title: Accountability Report
type: intelligence
summary: A report by which the organisation accounts for its performance to its owner, its governance bodies or the public, such as
  the annual report, a periodic owner report or a report the owner requested, composed of financial, activity, quality, workforce
  and risk results.
