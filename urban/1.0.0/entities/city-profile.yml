slug: city-profile
title: City Profile
type: governance
summary: The city's agreed public account of what it is, what it offers and where it falls short, drawn from the charter, the civic
  memory and evidence. The communications office drafts it and reviews it with the neighbourhood bodies and communities it describes,
  and it is the account from which the city's information and its offer to those it wants to attract are written.
