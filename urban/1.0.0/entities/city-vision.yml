kind: entity
slug: city-vision
title: City Vision
type: master
summary: The long-term picture of the city residents want to live in a generation from now, imagined with them and adopted by the
  council across parties beyond any one term. The administration keeps it with the futures it was weighed against and the date of
  its next review, and every later strategy and plan is bound to it.
