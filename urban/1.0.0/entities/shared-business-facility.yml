kind: entity
slug: shared-business-facility
title: Shared Business Facility
type: master
summary: A workshop, piece of equipment, testing space or back-office service that several enterprises share, with its terms of use
  and its keeper. The network or the city body that keeps it holds the record, and it is used to book use, to set affordable rents
  and to give small firms what none could afford alone.
