kind: entity
slug: integration-plan
title: Integration Plan
type: governance
summary: The city's plan for welcoming and integrating newcomers, made with them and adopted by the council, with how arrivals are
  received and settled across neighbourhoods and the services open to them. The administration drafts it with newcomers, established
  migrant communities and neighbourhood bodies, and reviews it with newcomers against whether they found work, housing, services and
  neighbours.
