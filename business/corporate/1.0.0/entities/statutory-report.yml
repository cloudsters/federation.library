kind: entity
slug: statutory-report
title: Statutory Report
type: transactional
summary: A periodic return the enterprise must submit to an authority, such as a statistical, financial, employment or sustainability
  return, with recipient, period, deadline, content and acknowledgement. A notification triggered by a single event is a regulatory
  notification.
attributes:
- name: report-kind
  type: code
  card: 1..1
- name: recipient
  type: reference(counterparty)
  card: 1..1
- name: obligation
  type: reference(compliance-rule)
  card: 1..1
- name: reporting-period
  type: period
  card: 0..1
- name: due-at
  type: datetime
  card: 1..1
- name: content
  type: document
  card: 1..1
- name: submitted-at
  type: datetime
  card: 0..1
- name: acknowledgement
  type: identifier
  card: 0..1
states:
- due
- in-preparation
- submitted
- acknowledged
- queried
- corrected
relations:
- type: based-on
  target: compliance-rule
binds:
- source: src-139
  edition: '2.1'
  jurisdiction: global
