title: Environmental Hazard Case
type: transactional
summary: A reported or detected hazard to residents' health, such as pollution, noise or dumping, with its source, the inspection,
  the order given and the remedy. The environmental health officer keeps it from the report to the remedy, and tells the resident
  who reported it what follows at each step.
