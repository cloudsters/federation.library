- name: licence-number
  type: identifier
  card: 1..1
- name: vendor
  type: text
  card: 1..1
- name: pitch
  type: reference(trading-pitch)
  card: 0..1
- name: market
  type: reference(market)
  card: 0..1
- name: goods
  type: code
  card: 1..*
- name: trading-days
  type: text
  card: 1..*
- name: fee
  type: amount
  card: 1..1
- name: fee-reduction
  type: text
  card: 0..1
- name: valid-period
  type: period
  card: 1..1
- name: previously-informal
  type: boolean
  card: 0..1
- name: removal-procedure
  type: text
  card: 1..1
- name: issued-on
  type: date
  card: 1..1
states:
