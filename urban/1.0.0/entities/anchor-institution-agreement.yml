kind: entity
slug: anchor-institution-agreement
title: Anchor Institution Agreement
type: governance
summary: An agreement between an anchor institution such as a university, hospital or school and the neighbourhoods around it on sharing
  land, buildings, purchasing, jobs and knowledge and on how neighbours take part in its decisions. The institution and the neighbourhood
  bodies sign it and the city records it, and it is used to hold each side to what it shares and to how neighbours are heard.
