slug: care-network-agreement
title: Care Network Agreement
type: governance
summary: The agreement among the hospitals, clinics, social services, care providers and community bodies of a district on how they
  share information, refer people and answer together for those they serve. Its members sign it and the city records it, and it is
  reviewed after each care gap review.
