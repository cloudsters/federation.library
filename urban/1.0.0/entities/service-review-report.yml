  card: 0..*
- name: outcomes-achieved
  type: text
  card: 0..*
- name: reviewed-with
  type: text
  card: 1..*
- name: proposed-course
  type: code
  card: 0..1
- name: decision
  type: reference(council-decision)
  card: 0..1
- name: published-report
  type: document
  card: 1..1
