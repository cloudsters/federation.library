kind: stakeholder
slug: resident
title: Resident
nature: person
stance: served
summary: A person who lives in the city, whether registered or not. Residents vote where entitled, use the city's services, ask for
  its records and judge whether it keeps its word.
seeks:
- A say in what the city stands for and decides, open records, fair treatment and answers within set times.
brings:
- The mandate given at the vote, knowledge of daily life in the city, scrutiny and the willingness to take part.
represented_by:
- neighbourhood-association
- neighbourhood-council
- city-council
