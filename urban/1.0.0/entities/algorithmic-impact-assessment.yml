kind: entity
slug: algorithmic-impact-assessment
title: Algorithmic Impact Assessment
type: intelligence
summary: The assessment of who gains and who bears harm from an algorithm or automated system, with its bias tests across neighbourhoods
  and groups and its checks against data protection and the city's obligations. The department that proposes the system prepares it
  with the data protection officer and the communities concerned and publishes it, and the community authorisation and approval of
  the system rest on it, afresh at each change and reauthorisation.
