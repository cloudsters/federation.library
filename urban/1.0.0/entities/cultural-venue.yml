kind: entity
slug: cultural-venue
title: Cultural Venue
type: master
summary: A theatre, museum, gallery, concert hall or cinema in the city, with its spaces, capacity, prices and who owns and runs it.
  The body that runs it keeps the record with the city, and it is used to open programmes to residents, to place community programming
  and to protect cultural spaces from displacement.
