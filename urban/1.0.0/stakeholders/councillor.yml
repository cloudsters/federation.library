kind: stakeholder
slug: councillor
title: Councillor
nature: person
stance: serving
summary: An elected member of the city council. A councillor votes, speaks for residents, declares interests and steps back from decisions
  in which they have a stake.
seeks:
- Full information before a vote, a record of their position when they disagree and fair treatment if a complaint is made against
  them.
brings:
- A vote, a voice for those who elected them, declared interests and their minority positions on the record.
represented_by:
- full-council
