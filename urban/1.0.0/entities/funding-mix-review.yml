kind: entity
slug: funding-mix-review
title: Funding Mix Review
type: intelligence
summary: The yearly review of how much of the city's spending rests on grants and how much on its own revenue and the commons fund,
  naming the work that must last beyond its grant. The finance department carries it out, and the work it names is moved into the
  medium-term financial plan before its grant ends.
