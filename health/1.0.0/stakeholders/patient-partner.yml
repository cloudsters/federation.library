kind: stakeholder
slug: patient-partner
title: Patient Partner
nature: person
stance: serving
summary: A patient or relative who contributes lived experience to the commons as a member of a patient council, a co-design group
  or a research team. While doing so not a recipient of care but a contributor whose knowledge the professions do not have.
seeks:
- A real influence on decisions, preparation for the role, recognition of the time given and an honest account of how the advice was
  used.
brings:
- Knowledge of illness and care from the inside, which makes services, studies and information fit those who use them.
represented_by:
- voluntary-engagement
