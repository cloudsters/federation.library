kind: entity
slug: event-benefit-agreement
title: Event Benefit Agreement
type: governance
summary: The agreement on fair pay for the artists, workers, vendors and volunteers of an event, the preference for local suppliers,
  the publication of its income and costs and the share of income returned to the community it celebrates. The organiser signs it
  with the city and the community concerned, and it is checked when the event's accounts are published.
