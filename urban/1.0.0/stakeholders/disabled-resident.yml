slug: disabled-resident
title: Disabled Resident
nature: person
stance: served
summary: A resident with a disability, who needs access built in from the start to take part in the city's life and decisions. Disabled
  residents know where the city's places, services and processes shut people out.
seeks:
- Access planned before a process opens, meetings and materials they can use, and a real say in the services they rely on.
brings:
- Knowledge of the barriers others overlook, and designs for access that serve every resident.
