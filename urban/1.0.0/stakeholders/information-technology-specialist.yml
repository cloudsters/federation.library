kind: stakeholder
slug: information-technology-specialist
title: Information Technology Specialist
nature: person
stance: serving
summary: A specialist of the municipality or a municipal enterprise who designs, builds, runs or protects the city's digital systems
  and data. Such specialists keep the architecture whole, connect systems, answer the service desk and contain attacks.
seeks:
- An adopted strategy and architecture to work to, systems the city controls rather than its suppliers, and residents and staff who
  say early what they need.
brings:
- Designs, connections, running services and the protection of the city's systems and data, and the skill to make the systems everyone
  depends on visible.
represented_by:
- digital-office
