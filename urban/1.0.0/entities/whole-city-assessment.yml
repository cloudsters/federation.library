kind: entity
slug: whole-city-assessment
title: Whole-City Assessment
type: intelligence
summary: The assessment of the state, equity and vitality of the whole city across neighbourhoods and groups, its blind spots, and
  its drift from charter, mandate and the interests of future generations. The administration prepares it on a yearly cycle with residents,
  the council discusses it, and each drift it names receives a correction with an owner, a measure and a date.
