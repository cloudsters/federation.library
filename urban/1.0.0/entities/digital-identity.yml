kind: entity
slug: digital-identity
title: Digital Identity
type: master
summary: The identity a resident, member of staff, device or system uses in the city's systems, with the access it holds and the data
  it controls. The administration issues and keeps it, the holder sees what it reaches and what it shares, and its access is reviewed
  and withdrawn on time.
