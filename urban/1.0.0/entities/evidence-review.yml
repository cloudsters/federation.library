kind: entity
slug: evidence-review
title: Evidence Review
type: intelligence
summary: A review of what has worked and failed in a field of policy, here and in other cities, with its sources and its limits. The
  administration or the researchers it works with prepare it before a policy or programme is chosen, and it is published so that residents
  can see the evidence a choice rests on.
