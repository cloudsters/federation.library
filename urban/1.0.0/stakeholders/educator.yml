slug: educator
title: Educator
nature: person
stance: serving
summary: A teacher, early-years worker or youth worker who teaches and supports children and young people in schools and beyond. Educators
  are often the first to notice when a learner is falling behind or about to leave.
seeks:
- Time and support to teach each learner, buildings fit for learning, and partners in the neighbourhood who share the work.
brings:
- Teaching, care for learners, early sight of those at risk of leaving, and the school as a place the neighbourhood can use.
represented_by:
- trade-union
- staff-representative
