kind: entity
slug: information-need
title: Information Need
type: transactional
summary: A request for evidence from the council, a department or a neighbourhood, with the decision it serves and the question it
  asks. The administration records it on intake and follows it until the answer is delivered, so that data is gathered for a purpose.
