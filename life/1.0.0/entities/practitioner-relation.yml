title: Care Practitioner Relation
type: master
summary: 'Someone in an ongoing professional relation with this person''s body or mind — a doctor, a nurse, a physiotherapist, a dentist,
  a carer. Held apart from `therapist`, which carries a working relation about inner life and conduct: this one is held for care and
  treatment, and what matters about it is whether decisions are made with the person or for them.'
