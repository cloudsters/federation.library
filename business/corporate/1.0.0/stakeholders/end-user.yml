slug: end-user
title: End User
nature: person
stance: served
summary: The person who actually uses the product or service day to day, who is often not the one who chose or paid for it. Their
  experience decides whether the product is used well, recommended and bought again.
seeks:
- A product that is easy to use, safe and dependable, with instructions, training and help that fit their work.
brings:
- Practical feedback from real use, and the satisfaction that decides the next purchase.
