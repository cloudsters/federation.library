kind: entity
slug: application
title: Application
type: master
summary: A software system the city or a municipal enterprise uses, with its owner, purpose, users, code and licence, supplier, the
  data it holds and the interfaces it offers. The owning department keeps the record, and it is used to place each system in the architecture,
  to assess its risks and to plan its renewal or retirement.
