kind: stakeholder
slug: professional-body
title: Professional Body
nature: organisation
stance: served
summary: A self-governing body of a health profession, such as a chamber or college of physicians, nurses or pharmacists, that sets
  standards of practice and specialty curricula, authorises trainers, examines and recognises specialists, accredits continuing education
  and records members' credits.
seeks:
- Specialists trained to its curricula by authorised trainers, continuing education that meets its standards, and reliable reports
  of the credits its members earn.
brings:
- Specialist recognition, trainer authorisation and the accreditation of continuing education, which define who may practise and teach
  a specialty and make the organisation's programmes count towards recertification.
represented_by:
- organisation
