kind: stakeholder
slug: university
title: University
nature: organisation
stance: serving
summary: The university whose medical faculty conducts research and teaching in the commons, bound to it by statute or agreement
  and often holding seats in its governance. Depending on the model the faculty is part of the commons or its closest partner;
  without it there is no university hospital.
seeks:
- Clinical settings for teaching and research, access to patients and data, and a commons that strengthens its academic standing.
brings:
- The faculty, professorships, degree programmes and academic reputation that make the commons a university hospital.
represented_by:
- organisation
