kind: stakeholder
slug: occupational-health-professional
title: Occupational Health Professional
nature: person
stance: serving
summary: An occupational physician, occupational health nurse or safety specialist who assesses workplace hazards, examines and vaccinates
  staff, cares for them after exposures and advises management on safe work, bound to confidentiality towards the employer.
seeks:
- Workplaces where hazards are controlled at the source, staff who report exposures early, and a management that acts on advice.
brings:
- Protection of staff health, confidential fitness assessments, and evidence that the organisation meets its duties as an employer.
represented_by:
- employee
