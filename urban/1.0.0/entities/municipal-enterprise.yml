kind: entity
slug: municipal-enterprise
title: Municipal Enterprise
type: master
summary: A company or utility the city owns in whole or in part, in energy, water, transit or other services, with its mission, pricing
  principles and the return it owes the city. The council sets its owner mandate and reviews it each year, and the share of its surplus
  that is reinvested, shared with host communities or returned to the commons fund is decided on its accounts.
