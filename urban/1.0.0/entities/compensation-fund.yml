kind: entity
slug: compensation-fund
title: Compensation Fund
type: master
summary: The fund each service carries from its own budget, from which compensation is paid when it breaks a published guarantee,
  with its balance, its top-up rule and the awards paid from it. The department responsible for the service holds it and the treasury
  accounts for it, and its draw-down shows the council the cost of each service's failures.
