kind: entity
slug: oversight-report
title: Oversight Report
type: intelligence
summary: A report on what was promised, what was delivered, what failed and why, against measures residents helped set, given to the
  council and to the neighbourhoods concerned. The administration, the internal audit or the legal office issues it at set intervals,
  and it is how the elected bodies and the administration answer for their mandate.
