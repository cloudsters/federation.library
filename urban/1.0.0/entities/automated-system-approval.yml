kind: entity
slug: automated-system-approval
title: Automated System Approval
type: governance
summary: The approval of an automated system for a stated use, with its published sunset date, the named person who answers for it,
  the human review it requires and the rhythm at which it must report. The accountable department holds it in the register of automated
  systems, the supplier contract gives the city the rights to inspect the system and end its use, and it is used to monitor, suspend,
  reauthorise or withdraw the system.
