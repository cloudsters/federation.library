# The variant startup of the business model; corporate is its sibling.
id: business
variant: {name: startup}
title: 'Business: startup'
kind: business-commons
gives: 'A commons of a young or small organisation, one site and a few people, from its founding onward, that sells a product and
  the services around it, holds its value creation as one whole: its founding, its financing until it carries itself, and the
  streams of the business model it shares with every organisation. This model holds 64 streams in all thirteen families, its
  Bodies those of its owners and managing directors and four teams, and grows into the variant corporate.'
asks: A Body that holds what the commons activates, and the commons' own evidence on its value creation.
