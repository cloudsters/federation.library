kind: entity
slug: visitor-strategy
title: Visitor Strategy
type: governance
summary: The city's agreed strategy for welcoming visitors across the year, with the limits it sets on holiday lets, crowding and
  group size, the seasons it widens and the share of visitor charge income returned to host neighbourhoods. The administration agrees
  it with residents, businesses and workers and the council adopts it, and it is reviewed against the visitor impact assessment.
