slug: tax-authority
title: Tax Authority
nature: organisation
legal_form: public-body
stance: served
summary: The public authority that assesses and collects the organisation's taxes and recognises, reviews or withdraws its status
  as a charitable or public-benefit body.
seeks:
- Correct and timely returns, taxes paid when due, and evidence that tax-privileged funds serve charitable purposes.
brings:
- Legal certainty over tax obligations, and the charitable status that relieves care, research and teaching of most taxes and makes
  gifts deductible for donors.
