kind: stakeholder
slug: affected-community
title: Affected Community
nature: group
stance: served
summary: A group that bears the consequences of the city's decisions, especially one historically left out of them, such as displaced
  families, indigenous peoples or residents of informal settlements.
seeks:
- Real power over the matters that touch it, its history recorded beside the official one, and repair of harms done.
brings:
- Knowledge of what the city's decisions did to it, histories the official record lacks, and its own bodies of self-government.
represented_by:
- neighbourhood-council
