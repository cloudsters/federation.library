- name: reference-number
  type: identifier
  card: 1..1
- name: detected-at
  type: datetime
  card: 1..1
- name: description
  type: text
  card: 1..1
- name: data-concerned
  type: reference(data-set)
  card: 1..*
- name: processing
  type: reference(processing-record)
  card: 0..*
- name: residents-affected
  type: integer
  card: 0..1
- name: severity
  type: code
  card: 1..1
- name: containment-actions
  type: text
  card: 0..*
- name: reported-to-authority-at
  type: datetime
  card: 0..1
- name: residents-notified-at
  type: datetime
  card: 0..1
- name: security-incident
  type: reference(security-incident)
  card: 0..1
- name: closed-on
  type: date
  card: 0..1
states:
- detected
