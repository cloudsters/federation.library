kind: entity
slug: practice-pattern
title: Practice Pattern
type: master
summary: A practice validated in at least three distinct contexts, with the problem it answers, the contexts in which it worked, the
  conditions under which it applies and those under which it fails, and the accounts of the staff and residents who tested it. Those
  who curate the pattern library keep it with its sources and revise or retire it when it stops working, and standard procedures and
  encoded rules are drawn from it.
