  - sales-meeting
  - trade-fair
- slug: use-the-picture
  title: Use the Picture
  goal: The seller works from the current picture of segments, competitors and opportunities.
  step: market-stakeholder-sensing/market-picture-publication
  touchpoints:
  - market-picture
