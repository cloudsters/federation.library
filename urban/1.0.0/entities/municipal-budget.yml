kind: entity
slug: municipal-budget
title: Municipal Budget
type: master
summary: The financial plan that allocates the city's public resources for a fiscal period, by purpose and by neighbourhood. The administration
  prepares it, the council adopts it, and it is used to fund decisions and risk treatments and to show who benefits and who bears
  the cost.
