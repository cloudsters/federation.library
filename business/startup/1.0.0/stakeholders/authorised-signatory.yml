title: Authorised Signatory
nature: person
stance: serving
summary: A senior employee who holds a registered general power to represent the company in contracts and transactions, alone or jointly,
  usually alongside a leading role in sales, finance or operations.
seeks:
- A clear scope of authority and the trust of management to use it.
brings:
- The capacity to commit the company quickly, so that decisions do not wait for the managing director.
