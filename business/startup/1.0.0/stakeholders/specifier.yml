kind: stakeholder
slug: specifier
title: Specifier
nature: person
stance: served
summary: An engineer, planner, architect or technical expert who defines what a product must do and writes it into the specification
  or tender, often long before a buyer is involved.
seeks:
- Reliable technical data, design support and products that meet the requirements without surprises in operation.
brings:
- The decision on which products are allowed into a project, which often decides the sale before price is discussed.
represented_by:
- contact
