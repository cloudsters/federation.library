kind: entity
slug: referral
title: Referral
type: transactional
summary: A request for care that one care provider sends to another, stating the question, the urgency and the clinical information,
  and asking the receiver to assess, treat or take over the patient.
attributes:
- name: patient
  type: reference(patient)
  card: 1..1
- name: referring-organisation
  type: reference(organisation)
  card: 1..1
- name: referrer-identifier
  type: identifier
  card: 0..1
- name: receiving-unit
  type: reference(organisation-unit)
  card: 0..1
- name: question
  type: text
  card: 1..1
- name: urgency
  type: code
  card: 1..1
- name: clinical-information
  type: document
  card: 0..1
- name: issued-at
  type: datetime
  card: 1..1
states:
- draft
- issued
- received
- accepted
- declined
- completed
- cancelled
relations:
- type: based-on
  target: request-mandate
- type: produces
  target: request-for-care
- type: refers-to
  target: referral-relationship
binds:
- source: src-018
  edition: 4.0.1
  jurisdiction: global
- source: src-001
  edition: '2026'
  jurisdiction: global
- source: src-002
  edition: '2025'
  jurisdiction: global
- source: src-016
  edition: 2.3.0
  jurisdiction: global
- source: src-015
  edition: 1.1.0
  jurisdiction: global
- source: src-405
  edition: v2.9.1
  jurisdiction: global
