kind: stakeholder
slug: communications-officer
title: Communications Officer
nature: person
stance: serving
summary: A member of the city's communications office who prepares its information, runs its channels and answers the media. Communications
  officers keep the account the city gives of itself close to what residents report of their own lives.
seeks:
- Early word of decisions and changes from the departments, residents and neighbourhood bodies who tell them where the city's account
  is wrong, and the standing to correct it.
brings:
- Plain-language information in the languages residents use, one set of channels online and offline, prompt answers to journalists
  and open corrections.
represented_by:
- communications-office
