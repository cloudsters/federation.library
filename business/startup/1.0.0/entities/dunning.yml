kind: entity
slug: dunning
title: Dunning
type: transactional
summary: A formal reminder with heart — the system reaching out to a debtor not as a threat but as a signal that something in the
  relationship needs attention. Dunning levels escalate with care, each step an invitation to restore balance before the relationship
  is strained.
