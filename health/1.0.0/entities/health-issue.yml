kind: entity
slug: health-issue
title: Health Issue
type: transactional
summary: A health problem, condition or risk of a patient that care is directed at, held on the patient's problem list across encounters
  until resolved. It is the thread that links diagnoses, plans and outcomes over time.
attributes:
- name: patient
  type: reference(patient)
  card: 1..1
- name: code
  type: code
  card: 1..1
- name: severity
  type: code
  card: 0..1
- name: body-site
  type: code
  card: 0..*
- name: onset
  type: date
  card: 0..1
- name: asserted-by
  type: reference(practitioner-role)
  card: 0..1
states:
- suspected
- active
- in-remission
- resolved
- refuted
relations:
- type: part-of
  target: health-record
