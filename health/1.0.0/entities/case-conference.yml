- name: held-at
  type: datetime
  card: 1..1
- name: recommendation
  type: text
  card: 0..1
- name: recommendation-followed
  type: boolean
  card: 0..1
states:
- registered
- prepared
- discussed
- recommendation-issued
- cancelled
