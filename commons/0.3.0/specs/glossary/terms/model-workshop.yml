id: model-workshop
term: Model Workshop
layer: how
kind: concept
definition: 'Where a commons'' runtime and emulations are worked on: changes to the runtime are proposed, checked and merged
  into its Commons CORE by those who hold a mandate for it.'
why: The boundary to the Commons Workshop is the direction of writing; only the Model Workshop writes the model, so every
  change to the runtime is proposed, checked and merged under a mandate, while an emulation is built freely. Building the
  runtime and taking up a newer release are its Stories. This term carries the meaning that `commons-workshop` held until
  21 October 2026.
relations:
  releases_into: commons-core
  receives_proposals_from: commons-workshop
status: accepted
decided:
  date: '2026-11-04'
  by: Holger
  where: 'commons.o#110, comment 6625957149: Adopted 4 November 2026 with structure 0.4.0 (the merge 7a5fbda); earlier 2026-10-29,
    commons.o#98, comment 6505618412: Adopted 29 October 2026 (the merge of commons.o#100); first decided 2026-10-21, commons.o#71
    (W1, W2)'
