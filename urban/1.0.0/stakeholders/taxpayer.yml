kind: stakeholder
slug: taxpayer
title: Taxpayer
nature: person
stance: served
summary: A person or organisation that pays the city's local taxes, fees or charges and is owed a fair, clear bill and an account
  of what it funds. They include owners who live in their homes, tenants who pay charges, landowners and local businesses.
seeks:
- A bill they can understand, rates set on published rules, relief when they cannot pay and a plain account of what their money funds.
brings:
- The revenue that carries the city's services, the facts on which their liability rests and their judgement of whether the city spends
  it well.
represented_by:
- full-council
