summary: A person or organisation that holds shares in the company, takes part in the shareholder meeting and shares in its profit
  and risk according to the shares held.
seeks:
- A lasting increase in the value of the shares, a fair dividend and transparent information about the company's course.
brings:
- Equity, the decisions reserved to the owners and the patience the company needs to invest.
