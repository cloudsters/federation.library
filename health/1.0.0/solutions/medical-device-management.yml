kind: solution
slug: medical-device-management
title: Medical Device Management
role: system-of-record
summary: Keeps the inventory of medical devices and their lifecycle from acquisition and commissioning through maintenance,
  safety inspection, incident and recall handling to decommissioning. It is the authority for every device and its fitness
  for use.
