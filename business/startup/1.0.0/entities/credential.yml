kind: entity
slug: credential
title: Credential
type: governance
summary: A verified qualification, licence or certificate held by a person, such as a professional licence, safety training, driving
  licence or product certification, that a role or task requires and that lapses if not renewed.
attributes:
- name: employee
  type: reference(employee-record)
  card: 1..1
- name: credential-kind
  type: code
  card: 1..1
- name: issuer
  type: reference(counterparty)
  card: 0..1
- name: obtained-on
  type: date
  card: 1..1
- name: expires-on
  type: date
  card: 0..1
- name: evidence
  type: document
  card: 0..1
- name: verified-by
  type: reference(employee-record)
  card: 0..1
states:
- pending-verification
- valid
- expiring
- expired
- revoked
relations:
- type: governed-by
  target: policy
