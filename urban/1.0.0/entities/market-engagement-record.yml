kind: entity
slug: market-engagement-record
title: Market Engagement Record
type: transactional
summary: The record of an open meeting with suppliers before a tender, with who took part, what was asked and answered, what keeps
  small and new suppliers out and what it changed in the tender. The category team writes it and shares it with every bidder, so that
  no supplier knows more than another.
