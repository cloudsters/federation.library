title: Executive Director for Research and Teaching
summary: The executive head of the medical faculty for research and teaching, usually the dean. Answers to the faculty council
  for the faculty's research strategy and for medical education and its governance. Where statutes give the faculty a seat
  on the executive board, that duty is carried by the faculty member of executive board.
