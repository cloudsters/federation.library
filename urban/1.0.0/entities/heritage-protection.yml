kind: entity
slug: heritage-protection
title: Heritage Protection Order
type: governance
summary: The protection given to a historic building, site or landscape, with what it protects, the stories the place holds and what
  change it allows. The heritage office of the administration designates and reviews it, and it is consulted whenever a district is
  assessed or a protected building is to be reused.
