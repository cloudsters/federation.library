kind: entity
slug: community-centre
title: Community Centre
type: master
summary: A neighbourhood building for gatherings, events, services and civic life, with its rooms, hours, who runs it and how residents
  book it. The body that runs it, the city or a neighbourhood association, keeps the record, and residents use it to find a place
  to meet without having to pay.
