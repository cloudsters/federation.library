kind: stakeholder
slug: newcomer
title: Newcomer
nature: person
stance: served
summary: A person who has recently come to live in the city, whether for work, for safety or after displacement, and with or without
  settled status. Newcomers often arrive without the language, the ties or the knowledge of where to turn.
seeks:
- A welcome in their own language, services they can use without fear, neighbours to turn to, and a voice in how the city receives
  them.
brings:
- Skills, languages, work and the experience of other places, and knowledge of what helps those who arrive after them.
represented_by:
- newcomer-advisory-council
- civil-society-organisation
