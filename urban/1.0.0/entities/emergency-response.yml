  type: code
  card: 1..1
- name: affected-area
  type: text
  card: 1..1
- name: declared-at
  type: datetime
  card: 1..1
- name: alert-level
  type: code
  card: 1..1
- name: activated-plan
  type: reference(emergency-plan)
  card: 0..1
- name: emergency-powers
  type: text
  card: 0..*
- name: powers-end-on
