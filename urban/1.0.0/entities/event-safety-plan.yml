- name: clearance-arrangements
  type: text
  card: 0..1
- name: agreed-with
  type: text
  card: 1..*
- name: emergency-plan
  type: reference(emergency-plan)
  card: 0..1
- name: agreed-on
  type: date
  card: 0..1
