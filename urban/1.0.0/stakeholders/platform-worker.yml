kind: stakeholder
slug: platform-worker
title: Platform Worker
nature: person
stance: served
summary: A person whose tasks, pay or continued work are set by a digital platform or allocation system, including workers of services
  the city contracts. Platform workers often meet the system only through its decisions.
seeks:
- Sight of how the system assigns tasks and pay, a person who hears their challenge, and a say in the rules that govern their work.
brings:
- Services the city relies on, their own records of how allocation works in practice, and collective findings on where it is unfair.
represented_by:
- civil-society-organisation
