kind: entity
slug: experimental-rule
title: Experimental Rule
type: governance
summary: A time-limited rule made for a trial, with its text, the area it covers, the rules it sets aside and the date on which it
  lapses unless it is renewed. The legal office drafts it and the council or the competent body adopts it, and it is used to let a
  trial run lawfully and to carry what works into a bylaw.
