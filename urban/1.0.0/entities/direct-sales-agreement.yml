kind: entity
slug: direct-sales-agreement
title: Direct Sales Agreement
type: governance
summary: The agreement under which farmers, food producers and makers of the region sell directly at markets and collection points,
  with open prices and fair pay to producers. The producers or their cooperative sign it with the markets service, and it is used
  to keep pitches for local producers and to publish the prices they are paid.
