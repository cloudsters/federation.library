# The steering loop of the family Interest to Relationship in the urban pack, authored by the maker in the form of the
# business pack's family loops. Its measures come with the depth (step 7).
loop: _family.interest-to-relationship
title: Keep the family 'Interest to Relationship' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: interest-to-relationship
  vs:
  - resident-enquiries-and-contact
  - complaints-and-ombudsman
  - tourism-and-visitor-welcome
  - city-events-and-festivals
  - arts-and-cultural-participation
  - sport-and-active-recreation
  - public-space-use-and-programming
stance: The interest of residents and visitors turns into lasting engagement with the city. No single stream of this family
  can see what its streams do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed reporting period of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was activated, adapted or not selected in the registry
  - a source the research declares in knowledge/sources.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/interest-to-relationship
  - value-model.yml#vs/resident-enquiries-and-contact
  - value-model.yml#vs/complaints-and-ombudsman
  - value-model.yml#vs/tourism-and-visitor-welcome
  - value-model.yml#vs/city-events-and-festivals
  - value-model.yml#vs/arts-and-cultural-participation
  - value-model.yml#vs/sport-and-active-recreation
  - value-model.yml#vs/public-space-use-and-programming
  registry:
  - registry/value-streams/resident-enquiries-and-contact.yml
  - registry/value-streams/complaints-and-ombudsman.yml
  - registry/value-streams/tourism-and-visitor-welcome.yml
  - registry/value-streams/city-events-and-festivals.yml
  - registry/value-streams/arts-and-cultural-participation.yml
  - registry/value-streams/sport-and-active-recreation.yml
  - registry/value-streams/public-space-use-and-programming.yml
  loop_states:
  - operations/loops/_state/resident-enquiries-and-contact.yml
  - operations/loops/_state/complaints-and-ombudsman.yml
  - operations/loops/_state/tourism-and-visitor-welcome.yml
  - operations/loops/_state/city-events-and-festivals.yml
  - operations/loops/_state/arts-and-cultural-participation.yml
  - operations/loops/_state/sport-and-active-recreation.yml
  - operations/loops/_state/public-space-use-and-programming.yml
  standards: knowledge/sources.yml — edition and status of every source that informs the family's records
authority: family-steward
state: operations/loops/_state/_family.interest-to-relationship.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never writes into
  the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided or passed
    to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or the commons does not select the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared source superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
