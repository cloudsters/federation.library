- contract-register-keeping
- contract-mobilisation
- contract-performance-monitoring
- contract-user-feedback-gathering
- contract-variation-and-remedy
- supplier-performance-review
- contract-renewal-decision
- social-value-commitment-tracking
- supplier-capacity-building
- alternative-supplier-qualification
holds:
- supplier-record
- contract-register
- contract-performance-report
- contract-variation
- supplier-review
- framework-agreement
- supplier-development-plan
- standby-supply-agreement
- supplier-exit-plan
