kind: stakeholder
slug: public-works-engineer
title: Public Works Engineer
nature: person
stance: serving
summary: An engineer of the municipality who designs and supervises roads, bridges, drains, public buildings and other works, and
  hands them into service. The engineer answers for a work from its brief to the day the crews who maintain it accept it.
seeks:
- A clear brief, the knowledge of users and maintenance crews before the design is fixed, and contractors who build what was specified.
brings:
- Designs for durability, repair, access and later disassembly, supervision of quality and safety on site, and a tested handover with
  every document and open defect.
represented_by:
- public-works-department
