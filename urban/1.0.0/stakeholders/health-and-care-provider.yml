kind: stakeholder
slug: health-and-care-provider
title: Health and Care Provider
nature: organisation
stance: serving
summary: A hospital, clinic, pharmacy or care provider that serves the city's residents and works with the city in its care networks.
  Its own records and duties stay its own, and it shares with the city what the network agrees.
seeks:
- Clear referrals, a social care service that is ready when a patient leaves its care, and partners who answer together for those
  they serve.
brings:
- Treatment, screening and care, knowledge of illness in the neighbourhoods, and its part in safe handovers between services.
represented_by:
- district-care-network-board
