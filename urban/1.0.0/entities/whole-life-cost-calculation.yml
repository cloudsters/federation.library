kind: entity
slug: whole-life-cost-calculation
title: Whole-Life Cost Calculation
type: intelligence
summary: The comparison of the offers in a tender on their cost over the whole life of what is bought, with purchase, energy, upkeep,
  repair and end of use included, and on their embedded carbon. The procurement office prepares it with the requesting department
  for each tender where it applies, and the evaluation panel scores the bids with it.
