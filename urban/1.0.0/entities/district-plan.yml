kind: entity
slug: district-plan
title: District Plan
type: governance
summary: The adopted plan of a district, with its mix of uses and incomes, its streets, its commons spaces, the reuse of its heritage
  and the stages of its delivery. The planners shape it with residents, the council adopts it, and every plot released and building
  permitted in the district follows it.
