kind: entity
slug: city-strategy
title: City Strategy
type: governance
summary: The strategy adopted for the council term, with its priorities, the rules for allocating scarce resources between them, its
  objectives and their owners, and the positions of the minority. The mayor and the administration prepare it, the council adopts
  it, and it binds the objectives, departmental plans and programme portfolio of the term.
