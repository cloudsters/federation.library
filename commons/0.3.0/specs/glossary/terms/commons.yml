id: commons
term: Commons
layer: why
kind: concept
definition: A shared value creation of any form — a life, an organisation, a settlement, a city, an ecosystem.
why: It is developed toward the five qualities and tested against them; every other term serves it. As a folder, models/commons/
  and patterns/commons/ name the origin of what they hold, since every model and every extract is made by a commons (Holger,
  commons.o#109, comment 6600437483).
relations:
  tested_by: five-qualities
  modelled_as: commons-core
not:
- house
- the commons' own model, which is its runtime
status: accepted
decided:
