kind: entity
slug: strategic-option
title: Strategic Option
type: intelligence
summary: A strategic option drawn up for the term, with its expected effects, costs, risks and who would bear its costs and who would
  gain from it. The administration draws it up and tests it on evidence against the vision, the city's capacity and its finances,
  and the council chooses among the options when it adopts the strategy.
