kind: entity
slug: course-registration
title: Course Registration
type: transactional
summary: A person's registration for a course, training or scientific meeting, from booking and payment through attendance to completion
  and certificate, or to cancellation.
attributes:
- name: participant
  type: reference(learner-record)
  card: 1..1
- name: course
  type: reference(course)
  card: 1..1
- name: registered-on
  type: date
  card: 1..1
- name: fee
  type: amount
  card: 0..1
- name: attended-hours
  type: quantity
  card: 0..1
- name: completed
  type: boolean
  card: 0..1
- name: credits-awarded
  type: reference(continuing-education-credit)
  card: 0..*
states:
- requested
- confirmed
- waitlisted
- attended
- completed
- cancelled
- no-show
relations:
- type: refers-to
  target: course
- type: produces
  target: continuing-education-credit
binds:
- source: src-414
  edition: '1.2'
  jurisdiction: global
- source: src-423
  edition: '2023'
  jurisdiction: global
- source: src-438
  edition: '1.3'
  jurisdiction: global
