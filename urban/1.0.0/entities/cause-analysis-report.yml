kind: entity
slug: cause-analysis-report
title: Cause Analysis Report
type: intelligence
summary: The causes found for a serious or repeated failure in the process, the tools and the conditions of work, with the evidence
  and the actions proposed to remove them. The staff who run the service and those affected prepare it together and the process owner
  keeps it, and the corrective actions are agreed on its basis.
