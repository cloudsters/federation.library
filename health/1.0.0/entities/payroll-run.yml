kind: entity
slug: payroll-run
title: Payroll Run
type: transactional
summary: The periodic calculation and payment of salaries, from approved working time, absences, allowances and contracts to pay statements,
  ledger postings and statutory contributions.
attributes:
- name: legal-entity
  type: reference(organisation)
  card: 1..1
- name: pay-period
  type: period
  card: 1..1
- name: gross-amount
  type: amount
  card: 1..1
- name: payments
  type: reference(payment)
  card: 0..*
- name: posted-on
  type: date
  card: 0..1
states:
- prepared
- calculated
- approved
- paid
- posted
relations:
- type: based-on
  target: working-time-record
- type: based-on
  target: employment
- type: produces
  target: payment
binds:
- source: src-133
  edition: '2026'
  jurisdiction: global
