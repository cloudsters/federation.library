kind: entity
slug: social-economy-report
title: Social Economy Report
type: intelligence
summary: The yearly report of the work, ownership and income the city's cooperatives and social enterprises hold by neighbourhood,
  and of how platform workers and users fared. The economic development office prepares it with the social economy and publishes it,
  and it is used to see whether enterprises kept their purpose and to direct support.
