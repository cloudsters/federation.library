summary: A manufacturer that builds the commons' components or modules into its own product and sells that product under its own name.
  It nominates suppliers per product generation and expects them to develop alongside it.
seeks:
- Parts that meet its specification at every delivery, on its production rhythm, at a cost that falls over the product's life.
brings:
- Volume over a whole product generation, and engineering demands that push the commons' own development.
