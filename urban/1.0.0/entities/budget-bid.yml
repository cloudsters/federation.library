- name: bid-number
  type: identifier
  card: 1..1
- name: bidding-department
  type: reference(department)
  card: 0..1
- name: bidding-neighbourhood
  type: reference(neighbourhood)
  card: 0..1
- name: budget-year
  type: period
  card: 1..1
- name: objectives-served
  type: reference(city-objective)
  card: 1..*
- name: programmes
  type: reference(city-programme)
  card: 0..*
- name: requested-amount
  type: amount
  card: 1..1
- name: upkeep-amount
  type: amount
  card: 0..1
- name: new-project-amount
  type: amount
  card: 0..1
- name: whole-life-cost
  type: amount
  card: 0..1
- name: care-work-and-shared-assets
  type: text
  card: 0..*
- name: spending-limit
  type: amount
  card: 0..1
states:
- drafted
- submitted
- reviewed
- revised
- accepted
- rejected
