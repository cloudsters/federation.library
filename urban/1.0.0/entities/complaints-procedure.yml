kind: entity
slug: complaints-procedure
title: Complaints Procedure
type: governance
summary: The published route for complaints about the city's services, decisions and conduct, with its stages, the time for answering
  each, the help offered to those who find it hard to complain and the service guarantees whose breach brings compensation without
  any complaint. The administration sets it with residents and frontline workers and the council adopts it, and every complaint and
  award is handled under it.
