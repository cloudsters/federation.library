kind: entity
slug: shared-procurement-service
title: Shared Procurement Service
type: master
summary: A procurement service run for several municipalities, with its members, the delegates who decide on its board, the contributions
  that fund it and the templates, supplier data and expertise it keeps. Its members set it up under a joint purchasing agreement and
  its board keeps the record, and members use it to run joint tenders and share what each has learned.
