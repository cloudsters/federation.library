kind: stakeholder
slug: owner
title: Owner
nature: organisation
stance: served
summary: The body that owns the commons, such as a state, region, municipality, university, foundation or company. It appoints
  the supervisory body and the board, provides capital and bears the ultimate risk.
seeks:
- A commons that fulfils its mission within the financial frame and strengthens public confidence in its owner.
brings:
- Legitimacy, equity and investment capital and, where the owner is public, a guarantee that secures the commons' existence.
