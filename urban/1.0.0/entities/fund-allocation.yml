kind: entity
slug: fund-allocation
title: Fund Allocation
type: transactional
summary: A decision by a neighbourhood or district body and its residents on how a share of the commons fund is reinvested, in homes,
  the upkeep of shared infrastructure, community land, accessibility or recovery reserves, or returned to residents. The neighbourhood
  body takes and records it under the fund rules, and the treasury pays it out and reports on it.
