kind: entity
slug: park
title: Park
type: master
summary: A public green space for recreation, ecology and community, with its area, condition and those who care for it. The department
  responsible keeps the record together with those who hold a care agreement for it, and it is used to plan its upkeep, to open it
  for gatherings and to place agreements on its care.
