- name: unit
  type: code
  card: 1..1
- name: issuer
  type: reference(commons-instance)
  card: 0..1
- name: quantity
  type: quantity
  card: 1..1
- name: exchange-rules
  type: text
  card: 1..1
states:
- issued
- exchanged
- converted
- expired
- audited
relations:
- type: governed-by
  target: commons-charter
