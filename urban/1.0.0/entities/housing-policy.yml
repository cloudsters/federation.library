kind: entity
slug: housing-policy
title: Housing Policy
type: governance
summary: The council's rules on how many affordable homes the city provides, to whom and on what terms, including the rules of allocation
  and the standard of a livable home. The housing office drafts and keeps it and the council adopts it, and every assessment of need,
  allocation and tenancy of an affordable home is tested against it.
