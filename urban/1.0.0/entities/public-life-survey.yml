kind: entity
slug: public-life-survey
title: Public Life Survey
type: intelligence
summary: The record of how a public space is used, who stays, who passes through and who is absent, at what hours and in what seasons.
  Residents and the administration observe and count together on set days, and the survey is used to adapt the space and to check
  that no group or commercial use takes it over.
