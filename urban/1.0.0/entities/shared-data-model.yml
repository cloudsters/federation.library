kind: entity
slug: shared-data-model
title: Shared Data Model
type: governance
summary: The shared definitions and identifiers of the core things of the city, such as address, parcel, building, resident and service,
  that every system uses. The administration keeps it with those who hold the data and publishes it, and every system, interface and
  data set maps its data to it.
