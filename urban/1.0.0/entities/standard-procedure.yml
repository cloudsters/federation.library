kind: entity
slug: standard-procedure
title: Standard Procedure
type: governance
summary: The agreed, dated way of carrying out a piece of work, with its steps, the quality checks built into it, the room left for
  local adaptation and the pattern or redesign it comes from. The process owner writes it with the staff who follow it and keeps it
  current, and it is used for daily work, for training, for checking adherence and, where it is rule-based and stable, for encoding
  in the city's systems.
