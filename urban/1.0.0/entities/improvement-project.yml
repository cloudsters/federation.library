kind: entity
slug: improvement-project
title: Improvement Project
type: transactional
summary: A bounded effort to redesign a process and pilot the change, with its aims, its team of staff and residents, the department
  or district of the pilot and the measured results. The process owner runs and records it from start to close, and it is used to
  decide whether the change is rolled out and to share what was learned.
