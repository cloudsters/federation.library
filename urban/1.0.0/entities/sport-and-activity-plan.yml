title: Sport and Activity Plan
type: governance
summary: The agreed plan for where facilities and play spaces are needed, what they cost to use and whom programmes reach first. The
  administration agrees it with clubs, schools, young people and neighbourhoods and the council adopts it, and facility provision,
  booking priorities and grants follow it.
