kind: entity
slug: programme-report
title: Programme Progress Report
type: intelligence
summary: The regular report on a programme's progress, cost, risks and the experience of residents, with the outcome of its review.
  The programme owner issues it at the rhythm the portfolio sets, and the council uses it to strengthen, re-scope, merge or stop the
  programme.
