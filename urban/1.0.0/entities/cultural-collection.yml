- name: name
  type: text
  card: 1..1
- name: holder
  type: reference(cultural-venue|library)
  card: 1..1
- name: collection-kind
  type: code
  card: 1..*
- name: item-count
  type: integer
  card: 0..1
- name: origins
  type: text
  card: 0..*
- name: source-communities
  type: text
  card: 0..*
- name: display-decisions
  type: text
  card: 0..*
- name: decided-with
  type: text
  card: 0..*
- name: share-on-display
  type: decimal
  card: 0..1
- name: open-access-route
  type: text
  card: 0..1
- name: contested-histories
  type: reference(civic-memory-record)
  card: 0..*
- name: catalogue
  type: document
  card: 0..1
