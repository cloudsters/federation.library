kind: capability
slug: intent-broadcasting
title: Intent Broadcasting
level: L3
parent: commons-network-exchange
summary: 'A commons identifies internal surplus — energy, compute, capacity, knowledge, idle talent — and broadcasts it as a typed
  intent signal into the federated network. Not a product listing in a catalogue but a living declaration of available value, shaped
  by the commons’ own L5 integrity constraints. The broadcast includes dimensional preferences: who the commons prefers to exchange
  with, based on purpose alignment, ecological credentials, and participation health.'
