kind: entity
slug: mobility-data
title: Mobility Data
type: intelligence
summary: Counts and surveys of trips by walking, cycling, transit, car and delivery vehicle, by hour, route and neighbourhood. The
  transport office collects them from sensors, ticket sales and rider surveys, together with walks with the residents the counts miss,
  and uses them to plan the network and review who it reaches.
