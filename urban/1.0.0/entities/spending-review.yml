kind: entity
slug: spending-review
title: Spending Review
type: intelligence
summary: The review of what a service or programme achieved for its money against its objective and the measures residents helped
  set. The finance department carries it out with the department responsible and with residents and publishes the results, and the
  next budget moves money from what did not work to what did.
