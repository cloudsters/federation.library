summary: The public body that commands the response to disasters and major incidents in a region, integrating hospitals, rescue
  services and other responders into its alerting, surge and evacuation plans.
seeks:
- Hospitals with tested plans, known surge capacity and a command structure that joins the regional response.
brings:
- Early alerting, regional coordination of casualties and resources, and the powers needed in a disaster.
