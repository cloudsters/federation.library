kind: entity
slug: bid
title: Bid
type: transactional
summary: An offer submitted by a supplier in a tender, with its price, whole-life cost, the commitments it makes on fair work, local
  hiring, social value and take-back, and the scores and reasons it received. The procurement office receives it and keeps it closed
  until opening, the evaluation panel scores it, and the commitments of a successful bid become clauses of the contract.
