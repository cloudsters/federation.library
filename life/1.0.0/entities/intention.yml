kind: entity
slug: intention
title: Intention
type: transactional
summary: 'A piece of work sold to oneself before it is begun: what it is for, what difference it makes, what it looks like finished,
  what the worst outcome is if it goes ahead and if it does not, and what must be true to call it done. Writing it is how a project
  is refused as well as how it is started — and once written it is also what is handed to whoever will do it, carrying the what and
  the why and never the how.'
