kind: entity
slug: upgrading-plan
title: Upgrading Plan
type: governance
summary: The plan agreed between a settlement's bodies and the city for upgrading it in place, with its stages, works, any moves of
  homes and the protections for residents. Both sides sign it and keep it, and it is used to order the works, record who gains a right
  to stay and review each stage with residents.
