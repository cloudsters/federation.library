- name: results
  type: document
  card: 0..1
- name: counterparty-feedback
  type: document
  card: 0..1
- name: findings
  type: text
  card: 1..*
- name: decision
  type: code
  card: 0..1
- name: agreed-actions
  type: text
  card: 0..*
