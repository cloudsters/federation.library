- name: procedure
  type: reference(standard-procedure)
  card: 1..1
- name: pattern
  type: reference(practice-pattern)
  card: 0..1
- name: service
  type: reference(public-service)
  card: 1..1
- name: reporting-period
  type: period
  card: 1..1
- name: cases-examined
  type: integer
  card: 0..1
- name: cases-following
  type: integer
  card: 0..1
- name: deviations
  type: text
  card: 0..*
- name: deviation-reasons
  type: text
  card: 0..*
- name: outcome-measures
  type: text
  card: 1..*
- name: prepared-by
  type: reference(department)
  card: 1..1
- name: reported-on
  type: date
  card: 0..1
states:
- due
