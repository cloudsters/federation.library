kind: stakeholder
slug: visitor
title: Visitor
nature: person
stance: served
summary: A person who comes to the city for a stay, for work, for an event or for the day. Visitors use its streets, services and
  homes let to them, and meet its residents as guests or pass them by as an audience.
seeks:
- A welcome that shows the city as it lives, information in a language they read, and a fair price for what they use.
brings:
- Spending in local shops, markets and venues, the overnight charge, curiosity about local life and the willingness to respect what
  residents ask of them.
