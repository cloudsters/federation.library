  type: text
  card: 0..1
- name: food
  type: text
  card: 0..1
- name: sleep
  type: text
  card: 0..1
- name: treatment
  type: text
  card: 0..*
- name: when-it-fails
  type: text
  card: 1..1
- name: conditions
  type: list(condition)
  card: 0..*
- name: set-on
  type: date
  card: 1..1
- name: next-look
  type: date
  card: 0..1
states:
- drafted
- kept
- lapsed
- restarted
- adjusted
relations:
- target: body
  type: about
- target: condition
  type: about
- target: health-data
  type: based-on
