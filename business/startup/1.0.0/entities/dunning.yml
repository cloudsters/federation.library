  type: code
  card: 1..1
- name: message
  type: text
  card: 1..1
- name: interest
  type: amount
  card: 0..1
- name: fee
  type: amount
  card: 0..1
states:
- triggered
- reminded
- escalated
- resolved
- waived
- written-off
relations:
- type: refers-to
  target: sales-invoice
- type: refers-to
  target: customer
binds:
- source: src-135
  edition: '2.5'
  jurisdiction: global
