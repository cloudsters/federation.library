kind: entity
slug: dependency-map
title: Digital Dependency Map
type: intelligence
summary: The map, made with residents, staff and technicians, of the networks, servers, sensors and services the city and its neighbourhoods
  depend on, and of where a single failure would stop essential services. The administration convenes the mapping with neighbourhood
  bodies and keeps the map current, and it shows where the architecture and the continuity plans need redundancy and offline fallbacks.
