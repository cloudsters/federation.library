kind: entity
slug: tax-and-charge-schedule
title: Tax and Charge Schedule
type: governance
summary: The adopted rates of the city's local taxes, fees and charges for a period, with the reduced rates for owner-occupied homes
  and community-held land and the higher rates for vacant and speculative holdings. The finance department proposes it and the council
  adopts it, and every assessment and bill of the period is calculated from it.
