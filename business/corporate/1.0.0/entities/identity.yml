kind: entity
slug: identity
title: Identity
type: master
summary: A digital identity under which a person, device, agent or system is authenticated to the enterprise's services, such as an
  employee account, a customer portal account or a service identity, with its assurance level.
attributes:
- name: identifier
  type: identifier
  card: 1..1
- name: identity-kind
  type: code
  card: 1..1
- name: employee
  type: reference(employee-record)
  card: 0..1
- name: contact
  type: reference(contact)
  card: 0..1
- name: agent
  type: reference(agent)
  card: 0..1
- name: assurance-level
  type: code
  card: 1..1
- name: authentication-means
  type: code
  card: 1..*
- name: valid-period
  type: period
  card: 0..1
states:
- requested
- active
- locked
- revoked
relations:
- type: governed-by
  target: policy
