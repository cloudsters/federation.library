kind: entity
slug: arrears-case
title: Arrears Case
type: transactional
summary: An unpaid amount owed to the city, followed from the first reminder through a payment plan timed to when the debtor earns,
  a referral to relief, enforcement as a last resort open to appeal, or a write-off on published rules. The revenue office keeps it,
  and it is closed when the amount is paid, relieved or written off.
