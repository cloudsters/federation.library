kind: stakeholder
slug: organ-donation-organisation
title: Organ Donation Organisation
nature: organisation
stance: serving
summary: The independent organisation, or pair of organisations, that coordinates deceased organ donation across hospitals and allocates
  donated organs to patients on the waiting lists by defined rules. The hospital reports potential donors to it and receives its organ
  offers.
seeks:
- Every potential donor recognised and reported, donors cared for so that organs remain usable, and swift, reasoned decisions on organ
  offers.
brings:
- The coordination, logistics and allocation that turn one donation into transplants across many centres, and the organs on which
  the transplant programmes depend.
represented_by:
- organisation
