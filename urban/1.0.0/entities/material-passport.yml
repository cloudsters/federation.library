kind: entity
slug: material-passport
title: Material Passport
type: master
summary: The record of the materials in a building, work or product, with their quantities, origin, condition and how they can be
  taken apart and reused. The owner of the building or the supplier of the product keeps it with the city, and it is used to source
  reclaimed materials, to plan reuse at the end of use and to account for embedded carbon.
