kind: stakeholder
slug: referring-hospital
title: Referring Hospital
nature: organisation
stance: served
summary: A hospital that transfers or refers patients whose needs exceed its own capabilities and takes them back for further
  care, often linked to the commons through a care network, shared services or remote consultation.
seeks:
- Fast acceptance of transfers, expert advice by remote consultation and the timely return of patients once the specialist
  phase is complete.
brings:
- Complex cases from a wider catchment, and follow-on capacity that frees the commons' specialist beds.
represented_by:
- organisation
