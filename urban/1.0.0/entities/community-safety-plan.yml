slug: community-safety-plan
title: Community Safety Plan
type: governance
summary: The plan a neighbourhood agrees with the city, the police and other services on safety priorities, actions and how responders
  answer to residents. The neighbourhood and the city keep it together, and it is reviewed each year against response times, complaints
  and whether residents feel safer.
