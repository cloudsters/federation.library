kind: entity
slug: risk-register
title: Risk Register
type: intelligence
summary: The record of the city's risks, each with its category, rating, the neighbourhoods most exposed, its owner and its treatment
  against the appetite the council has stated. The administration keeps it through the annual risk cycle, and it is the basis for
  emergency plans and for the risk treatments the budget funds.
