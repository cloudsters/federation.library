kind: entity
slug: protest
title: Protest or Demonstration
type: transactional
summary: A public expression of civic dissent or demand in public space, from its notice through the gathering to its end. Its organisers
  give notice by a simple route and the city records it only to agree the safety of those taking part and of passers-by with the emergency
  services, never to judge its cause.
