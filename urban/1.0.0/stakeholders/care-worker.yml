kind: stakeholder
slug: care-worker
title: Care Worker
nature: person
stance: served
summary: A person paid to care for children, older or disabled residents, often a woman and often a newcomer, whose skills and pay
  have long gone unrecognised. Many care workers are employed by contractors of the city.
seeks:
- A wage floor that binds every care employer, skills recognised from another country, and the emotional work of care counted.
brings:
- Daily care that keeps residents at home and in the community, and skills learned in many places.
represented_by:
- trade-union
