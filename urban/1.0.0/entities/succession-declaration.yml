kind: entity
slug: succession-declaration
title: Succession Declaration
type: transactional
summary: A resident's witnessed designation of the successor to a community-held or affordable home, recognised by the body that holds
  the home. That body records and keeps it, and it is used when the resident leaves or dies to pass the home to the successor at the
  price the affordability covenant sets.
