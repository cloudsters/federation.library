title: Communications Office
summary: Follows what is said about the city and sets it beside residents' own accounts, drafts the city profile with the communities
  it describes, prepares plain-language information in residents' languages, runs the city's channels, answers the media through named
  spokespeople, speaks early in a crisis and corrects what was wrong, and reviews each year whether residents recognise themselves
  in what the city says.
