kind: stakeholder
slug: municipal-employee
title: Municipal Employee
nature: person
stance: serving
summary: A person employed by the municipality in any role, who does the city's work and is owed fair pay, safe conditions and a voice.
  Long-serving employees often carry knowledge that no record holds.
seeks:
- Fair pay on a published scale, safe and humane work, a say through staff representatives and a fair exit when they leave.
brings:
- The daily work of the city's services, skills built over years and knowledge to hand on to those who follow.
represented_by:
- staff-representative
- staff-council
