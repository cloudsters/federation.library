kind: entity
slug: noise-map
title: Noise Map
type: intelligence
summary: The spatial distribution of noise levels across the city by time of day. The environment office models and measures it, with
  sensors placed first in the most exposed neighbourhoods, and uses it to enforce the noise rules and to review which neighbourhoods
  bear the heaviest burden.
