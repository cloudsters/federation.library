kind: entity
slug: procurement-policy
title: Procurement Policy
type: governance
summary: The rules for public purchasing, including the preference for open code and the city's ownership of the data its systems
  generate. The council adopts it, the administration applies it to every purchase and contract, and it is reviewed against the share
  of open code and city-owned data the purchases have achieved.
