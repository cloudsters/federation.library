kind: entity
slug: enterprise-statutes
title: Enterprise Statutes
type: governance
summary: The founding rules of a cooperative or social enterprise, stating its purpose, its members' rights, how decisions are taken
  and how its purpose and assets are bound. The members adopt them and the enterprise keeps them, often from model statutes the city
  provides, and they are used to keep the purpose and the members' voice as the enterprise grows or changes owners.
