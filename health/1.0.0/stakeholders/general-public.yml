kind: stakeholder
slug: general-public
title: General Public
nature: group
stance: served
summary: The residents of the area the commons serves and the wider society, most of them future patients, relatives or employees.
  They judge the commons by reputation, access and transparency.
seeks:
- Confidence that good care is there when needed, honest information about quality and responsible use of public money.
brings:
- The trust and support on which the commons' legitimacy, funding and recruitment rest.
