kind: entity
slug: data-impact-assessment
title: Data Protection Impact Assessment
type: intelligence
summary: The assessment of whether a use of personal data could harm residents, whether the data is needed at all, and the decision
  taken. The department proposing the use prepares it with the data protection officer and the neighbourhoods concerned, and the use
  is approved, changed or refused on its basis.
