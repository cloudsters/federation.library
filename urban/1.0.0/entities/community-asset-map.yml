kind: entity
slug: community-asset-map
title: Community Asset Map
type: intelligence
summary: A map made with residents of the assets, relationships and strengths a neighbourhood already holds and of who can make things
  happen there. The neighbourhood's bodies hold it on terms agreed with the city, and it is used in the strategy, the district assessments
  and the choice of delivery partners.
