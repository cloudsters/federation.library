kind: entity
slug: place-care-agreement
title: Shared Place Care Agreement
type: governance
summary: The written agreement under which residents, groups and the city care for a park, trees, a courtyard or a garden, stating
  what each side provides, how decisions are taken and when it is reviewed. The department that holds the place and the residents
  or group sign it, and it is used to divide the care between them and to settle decisions about the place.
