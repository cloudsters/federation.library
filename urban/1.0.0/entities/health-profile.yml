kind: entity
slug: health-profile
title: City Health Profile
type: intelligence
summary: The profile of residents' health, illness and mental health and of the conditions behind them, by neighbourhood and group.
  The administration prepares it each year with health providers and residents and publishes it, and it directs prevention to where
  the gaps are widest.
