kind: stakeholder
slug: salvage-cooperative
title: Salvage Cooperative
nature: organisation
stance: serving
summary: A cooperative that takes apart retired buildings and works, sorts and stores what can be reused and returns it to builders
  and residents. Its members are often former waste pickers and local workers trained in careful dismantling.
seeks:
- Contracts to dismantle rather than demolish, early access to material audits, and a steady market for salvaged components.
brings:
- Skilled and safe deconstruction, sorted and recorded material lots, local jobs, and a material bank that city works, builders and
  residents can draw on.
