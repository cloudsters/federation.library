kind: entity
slug: handover-plan
title: Handover Plan
type: transactional
summary: The plan for passing a role's tasks, relationships, open matters, the reasons behind past decisions and system access from
  the holder to the successor. The holder and the successor write it together under the succession plan, and it is used to hand the
  role over and to keep its knowledge for those who follow.
