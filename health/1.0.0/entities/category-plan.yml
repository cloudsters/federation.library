kind: entity
slug: category-plan
title: Category Plan
type: governance
summary: The plan for one category of spend, such as orthopaedic implants, wound care or laboratory reagents, stating its scope, spend,
  supply market, sourcing route, standard assortment, targets and supply risks for a period.
