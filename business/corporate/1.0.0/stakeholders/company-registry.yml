slug: company-registry
title: Company Registry
nature: organisation
legal_form: public-body
stance: served
summary: The public register, usually kept by a court or registry office, that records the company's legal form, seat, capital, officers
  and authorised signatories and publishes its filed accounts.
seeks:
- Timely, complete and correct filings whenever officers, capital, statutes or accounts change.
brings:
- Public proof of the company's existence and of who may act for it, on which every contract partner relies.
