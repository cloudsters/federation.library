kind: entity
slug: personal-data-breach
title: Personal Data Breach
type: transactional
summary: A breach of personal data the city holds, with its assessment, the residents affected and the reports made. The data protection
  officer records it with the department concerned, it is reported to the data protection authority and the residents affected within
  deadlines, and the breaches of each year are reviewed and published.
