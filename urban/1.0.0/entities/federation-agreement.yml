kind: entity
slug: federation-agreement
title: Federation Agreement
type: governance
summary: The agreement among neighbourhood, district and city platforms, and those of neighbouring municipalities, on what each holds
  and decides, which decisions pass to the next level and how they exchange data. The bodies that hold the platforms agree it and
  their councils approve it, and it is reviewed in the open so that no level is forced into a single system.
