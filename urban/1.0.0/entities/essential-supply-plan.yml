kind: entity
slug: essential-supply-plan
title: Essential Supply Plan
type: governance
summary: The levels of each essential good the city holds enough of for a set period of disruption, the places that hold them, the
  triggers for their release and the priorities for allocation. The procurement office drafts it with residents, services and the
  risk team and the council adopts it, and it is reviewed each year and after every disruption.
