kind: entity
slug: skill-recognition
title: Skill Recognition
type: transactional
summary: The recognition of a person's skills from qualifications, apprenticeship, lived experience, peer attestation or practical
  demonstration, with the credential it confers. The personnel function or the body of practitioners that grants it records it, and
  it is used in selection, in apprentice intake and wherever the person seeks work.
