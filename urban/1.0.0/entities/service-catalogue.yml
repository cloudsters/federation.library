kind: entity
slug: service-catalogue
title: Service Directory
type: master
summary: The one directory of the services of the city and its partners, with who may use them, where and when, how to reach a person
  and what to bring. The administration keeps it current in plain language and the languages residents use, and residents, staff and
  partners use it to find a service.
