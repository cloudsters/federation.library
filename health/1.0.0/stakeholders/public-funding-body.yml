summary: A ministry or public agency that grants public funds outside payment for care, such as capital investment programmes or base
  funds for research and teaching, and holds the recipient to their conditions of use.
seeks:
- Public money spent on the purposes it was granted for, delivered on schedule and accounted for transparently.
brings:
- Funds for buildings, equipment, digital infrastructure, research and teaching that payment for care does not cover.
