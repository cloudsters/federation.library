kind: stakeholder
slug: informal-worker
title: Informal Worker
nature: person
stance: served
summary: A person who earns a living outside formal employment, such as a street vendor or a waste picker. Informal workers often
  govern their own trade through associations the city has not yet recognised.
seeks:
- Recognition, secure access to the spaces they work in and a binding say in the rules that govern their livelihood.
brings:
- Essential services and trade, knowledge of street life, and associations that already govern their work.
represented_by:
- civil-society-organisation
