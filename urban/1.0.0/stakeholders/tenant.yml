kind: stakeholder
slug: tenant
title: Tenant
nature: person
stance: served
summary: A resident who rents a home from the city, a cooperative or a private landlord. Tenants are owed a safe and warm home, a
  rent they can carry and a real say in how their building is run.
seeks:
- A home kept to the standard tenants helped set, repairs done within the published times, a fair rent and help before any step towards
  ending the tenancy.
brings:
- Rent and care of the home, early word of faults and difficulties, and the knowledge of how the building works that tenants use to
  inspect and improve it.
represented_by:
- tenant-board
