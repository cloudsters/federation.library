id: usage
term: Usage
layer: what
kind: concept
definition: 'How a line of a bill of materials holds its child, one of three: installed, a read-only copy held to its digest;
  served, delivered and never copied, its inner bill its provider''s; read, a system observed under a grant.'
why: 'A line carries no quantity; its usage says what the commons holds of the child and who answers for the child''s own
  bill. Models and pattern extracts are installed, what a maker keeps in its knowledge/ is served, and FABRIC''s sources
  are read. A record of the runtime is the commons'' own and no line: where-used resolves its origin (commons.o#109, decision
  32), so the fourth usage, adopted, retires.'
relations:
  of: bill-of-materials
  set_by: configuration
not:
- a quantity
status: draft
decided:
  date: '2026-11-04'
  by: Holger
  where: 'commons.o#110, comment 6625957149: Adopted 4 November 2026 with structure 0.4.0 (the merge 7a5fbda); earlier 2026-10-30,
    commons.o#107, comment 6519835234: Adopted 30 October 2026 (step 1 of the bill of materials)'
