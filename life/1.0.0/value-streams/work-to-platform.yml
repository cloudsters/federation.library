kind: value-stream
slug: work-to-platform
title: Building on One's Own Ground
family: proposition-to-audience
summary: Building an audience on ground the person controls, with an exit planned before it is needed.
trigger: A service changes its rules and the person's readers vanish overnight, or they realise every follower they have is borrowed
  from someone else's service.
outcome: The person can reach those who follow the work on ground they control, and knows how they would leave any service they use.
stakeholders:
- audience
- community
- collaborator
- synthetic-collaborator
- provider
steps:
