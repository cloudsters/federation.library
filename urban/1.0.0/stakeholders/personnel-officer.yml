kind: stakeholder
slug: personnel-officer
title: Personnel Officer
nature: person
stance: serving
summary: A member of the municipality's personnel function who plans the workforce, runs recruitment, keeps staff records and pays
  staff. Personnel officers see first where the city will lack people and skills.
seeks:
- A plan the council funds, departments that state their needs early and staff representatives consulted in good time.
brings:
- Workforce plans, fair recruitment, correct staff records and pay, and the evidence of who leaves and why.
represented_by:
- human-resources-department
