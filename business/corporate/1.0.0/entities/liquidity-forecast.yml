  type: reference(legal-entity)
  card: 1..1
- name: horizon
  type: period
  card: 1..1
- name: currency
  type: code
  card: 1..1
- name: expected-inflows
  type: amount
  card: 1..1
- name: expected-outflows
  type: amount
  card: 1..1
- name: minimum-balance
  type: amount
  card: 0..1
- name: generated-at
  type: datetime
  card: 1..1
states:
- generated
- reviewed
- used
relations:
- type: based-on
  target: sales-invoice
- type: refers-to
  target: financing-facility
