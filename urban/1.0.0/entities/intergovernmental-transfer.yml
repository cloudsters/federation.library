kind: entity
slug: intergovernmental-transfer
title: Intergovernmental Transfer
type: transactional
summary: A transfer, equalisation share or shared revenue the city receives from or pays to a higher level of government or a regional
  pool. The finance department establishes what is due, supplies the data the formula rests on and contests errors, and the amounts
  settled enter the budget and the cash forecast.
