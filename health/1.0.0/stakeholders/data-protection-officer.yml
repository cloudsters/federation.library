summary: The designated officer who advises the organisation on the lawful processing of personal data, reviews new processing such
  as research projects, and is the contact for data subjects and the supervisory authority.
seeks:
- Processing that is described precisely, limited to its purpose and protected by appropriate safeguards.
brings:
- Independent judgement on lawfulness that lets care data be used for research without losing patients' trust.
