kind: stakeholder
slug: event-organiser
title: Event Organiser
nature: organisation
stance: served
summary: A person, group or body that proposes and runs an event in the city, from a block party to a festival across many streets.
  First-time organisers among them need advice more than permission.
seeks:
- One route for a proposal, early advice, one permit with clear conditions and an answer in time to plan.
brings:
- Events that bring residents and visitors together, the work of organising them, and accounts of what each event cost, earned and
  left behind.
