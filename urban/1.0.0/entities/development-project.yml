title: Development Project
type: transactional
summary: The development or renewal of a district or quarter, from proposal to delivery and review, with its land, partners, terms
  and interim uses. The planning department carries it on the council's commitment, and it binds the district plan, the development
  agreements and the stages of delivery together.
