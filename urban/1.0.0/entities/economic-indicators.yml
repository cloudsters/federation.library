title: Local Economic Indicators
type: intelligence
summary: Employment, business registrations, incomes and tax revenue across the city and its neighbourhoods, gathered at a regular
  rhythm. The statistics office or the finance department keeps it, and it is the basis for fiscal forecasts and for the data supplied
  to transfer formulae.
