kind: entity
slug: cohesion-assessment
title: Cohesion Assessment
type: intelligence
summary: The assessment of how groups in the city relate, by neighbourhood, where trust is rising or falling, where tension is growing
  and what cohesion programmes achieved. The administration compiles it from trusted residents, community workers and the resident
  survey and publishes it each year, and it is used to decide where dialogue, encounter or mediation is needed.
