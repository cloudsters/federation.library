kind: value-stream
slug: difference-to-common-ground
title: Common Ground across Difference
family: participant-to-community
summary: Finding what holds across cultures, languages and convictions without flattening any of them into the others. The ground
  has to be found, not assumed — and it is usually narrower and more load-bearing than either side expected.
trigger: Someone close holds a conviction the person cannot share, or a move, a marriage or a new neighbourhood brings languages and
  customs that do not fit together easily.
outcome: The person can name the ground they share with people unlike them, however narrow, and stands on it without asking anyone
  to become someone else.
stakeholders:
- community
- partner
- collaborator
- close-friend
