kind: stakeholder
slug: national-digital-health-agency
title: National Digital Health Agency
nature: organisation
legal_form: public-body
stance: serving
summary: The national body that specifies, approves and operates the shared health information infrastructure, such as the secure
  health network, the shared health record, electronic prescribing, secure messaging and the procedure for secondary use of health
  data.
seeks:
- Connected providers that conform to its specifications, use the national services in care and keep their connections secure.
brings:
- Nationwide services through which information follows the patient across providers, with specifications, test environments and identities
  for institutions and professionals.
