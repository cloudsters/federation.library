- name: kept-by
  type: reference(department)
  card: 1..1
- name: entries
  type: reference(public-service)
  card: 1..*
- name: partner-entries
  type: text
  card: 0..*
- name: service-points
  type: reference(service-point)
  card: 0..*
- name: eligibility-notes
  type: text
  card: 0..*
- name: contact-routes
  type: text
  card: 1..*
- name: documents-to-bring
  type: text
  card: 0..*
- name: languages
  type: code
  card: 1..*
- name: formats
  type: code
  card: 0..*
- name: published-address
  type: identifier
  card: 0..1
- name: review-rhythm
  type: code
  card: 1..1
- name: last-reviewed
  type: date
  card: 1..1
states:
- compiled
- published
- current
- under-review
- superseded
