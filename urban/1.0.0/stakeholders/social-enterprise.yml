kind: stakeholder
slug: social-enterprise
title: Social Enterprise
nature: organisation
stance: served
summary: A cooperative, mutual or enterprise that trades for a social or ecological purpose and binds its surplus to that purpose.
  Social enterprises are owned by their workers, members or communities.
seeks:
- Advice on statutes that bind their purpose and assets, ways to keep members' voice as they grow, and federations that share services
  and a common fund.
brings:
- Work and services owned by those who do and use them, surplus kept for its purpose and a yearly account of the social value they
  hold.
represented_by:
- business-association
- civil-society-organisation
