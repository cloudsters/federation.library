kind: entity
slug: software-licence
title: Software Licence
type: master
summary: An entitlement to use a software product under defined terms, such as a number of users, devices or cores for a period, held
  with its contract, licence metric, entitled quantity and the installations that consume it.
attributes:
- name: product-name
  type: text
  card: 1..1
- name: supplier
  type: reference(supplier-organisation)
  card: 1..1
- name: contract
  type: reference(contract)
  card: 1..1
- name: licence-metric
  type: code
  card: 1..1
- name: entitled-quantity
  type: quantity
  card: 1..1
- name: consumed-quantity
  type: quantity
  card: 0..1
- name: term
  type: period
  card: 0..1
- name: applications
  type: reference(application)
  card: 0..*
states:
- ordered
- active
- under-true-up
- expired
- terminated
relations:
- type: governed-by
  target: contract
- type: refers-to
  target: application
