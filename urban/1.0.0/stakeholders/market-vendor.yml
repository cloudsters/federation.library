kind: stakeholder
slug: market-vendor
title: Market Vendor
nature: person
stance: served
summary: A person who sells goods at a market or a street pitch, under a licence or informally. Market vendors bring fresh and affordable
  goods within reach of residents in every neighbourhood.
seeks:
- A licence that gives standing and does not price them out, rules agreed with an elected vendor council, and prices that are open
  to vendors and buyers alike.
brings:
- Goods at fair prices, the life of the market day, fees under the rules they agreed, and anonymised sales and cost data pooled with
  other vendors.
represented_by:
- market-vendor-council
