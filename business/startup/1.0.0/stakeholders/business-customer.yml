summary: A company that buys products or services for its own operations or production, through a buying centre in which users, specifiers,
  buyers and approvers each have a say. The relationship usually spans many orders.
seeks:
- The right product at a fair price, delivered on the agreed date, with dependable support after the sale.
brings:
- Orders, payment and, over time, the repeat business and references that make revenue plannable.
