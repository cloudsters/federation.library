kind: entity
slug: emergency-shelter
title: Emergency Shelter
type: master
summary: A place where residents without a home can stay safely at short notice, with its capacity, access rules and the support offered
  there. The housing office keeps the record with the body that runs the shelter, and uses it to offer a place the same day and to
  plan shelter across the city.
