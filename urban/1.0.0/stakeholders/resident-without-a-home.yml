kind: stakeholder
slug: resident-without-a-home
title: Resident without a Home
nature: person
stance: served
summary: A resident who sleeps rough, stays in a shelter or with others, or is about to lose their home. They are owed shelter without
  conditions and a path to a settled home.
seeks:
- A safe place the same day without conditions on status, records or behaviour, a priority on the register they can see and challenge,
  and support until a new home holds.
brings:
- Their own account of what they need and what has failed them, and the knowledge of residents without a home that shows where help
  arrives too late.
represented_by:
- civil-society-organisation
