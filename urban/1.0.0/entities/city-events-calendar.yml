- name: seasons
  type: text
  card: 0..*
- name: off-peak-periods
  type: period
  card: 0..*
- name: neighbourhoods
  type: reference(neighbourhood)
  card: 0..*
- name: last-updated-on
  type: date
  card: 1..1
