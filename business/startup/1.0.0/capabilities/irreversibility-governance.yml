title: Irreversibility Governance
level: L3
parent: policy-and-decision-rights
summary: 'Classify decisions by reversibility. Gene release, ecosystem destruction, algorithmic restructuring of governance bodies
  — these are not high-stakes decisions on a continuum. They are a categorically different kind of decision requiring a separate governance
  register: elevated thresholds, mandatory affected-party participation, and institutional memory.'
