kind: entity
slug: partnership-review-report
title: Partnership Review Report
type: intelligence
summary: The joint review of what a partnership delivered to residents and to both sides, where trust was strained and whether it
  is renewed, changed or ended. The city and its partners write it together and publish it, and it is used to decide the future of
  the partnership and to check that partners stay open and answerable to those they speak for.
