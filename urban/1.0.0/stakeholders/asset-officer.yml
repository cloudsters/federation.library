kind: stakeholder
slug: asset-officer
title: Asset Officer
nature: person
stance: serving
summary: A member of the city's asset office who keeps the asset register, plans upkeep, renewal and retirement, and acquires and
  disposes of land and buildings. The asset officer turns what inspectors, crews and residents know about the city's assets into one
  plan the council can fund.
seeks:
- A complete and current record of what the city holds, honest figures on deferred upkeep, and a council that funds upkeep before
  new projects.
brings:
- The asset register, the published backlog ledger, lifecycle plans for each class of asset, and the appraisal of every acquisition
  and retirement.
represented_by:
- asset-management-office
