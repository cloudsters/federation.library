kind: stakeholder
slug: contract-manager
title: Contract Manager
nature: person
stance: serving
summary: A member of a department who answers for a contract once it is signed. The contract manager monitors delivery and commitments,
  hears the supplier when it falls short and keeps the relationship with it until the contract ends.
seeks:
- A contract handed over with its obligations and contacts, reports that arrive on time, and the authority to apply the remedies the
  contract names.
brings:
- Delivery tracked against what was promised, shortfalls remedied on the record and decisions on renewal or exit taken in time.
represented_by:
- procurement-office
