kind: entity
slug: consent-record
title: Consent Record
type: transactional
summary: A resident's consent to a use of their data, with its limits, the date it expires and its withdrawal. The department that
  relies on it records it, the resident sees and changes it through their digital identity, and every use of their data is checked
  against it.
attributes:
- name: resident-identifier
  type: identifier
  card: 1..1
- name: digital-identity
  type: reference(digital-identity)
  card: 0..1
- name: processing
  type: reference(processing-record)
  card: 1..1
- name: scope
  type: text
  card: 1..1
- name: limits
  type: text
  card: 0..*
- name: channel
  type: code
  card: 1..1
- name: given-at
  type: datetime
  card: 1..1
- name: expires-on
  type: date
  card: 0..1
- name: withdrawn-at
  type: datetime
  card: 0..1
states:
- given
- limited
- renewed
- withdrawn
- expired
relations:
- type: refers-to
  target: processing-record
- type: refers-to
  target: digital-identity
- type: refers-to
  target: data-set
