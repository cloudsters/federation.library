kind: entity
slug: service-review-report
title: Service Review Report
type: intelligence
summary: The review of a service against what it promised, with who uses it, who does not and why, and what it achieved. The department
  prepares it with users and staff and publishes it, and the decision to keep, change or close the service rests on it.
