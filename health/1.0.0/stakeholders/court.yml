slug: court
title: Court
nature: organisation
legal_form: public-body
stance: served
summary: The judicial body that authorises compulsory admission and coercive measures, reviews their continuation and appoints legal
  representatives for the person concerned.
seeks:
- Complete, timely applications and medical evidence, and access to the person concerned, so that it can decide on compulsion lawfully.
brings:
- The authorisation and review without which no one may be held or treated against their will, and the legal representation that protects
  the person's rights.
