id: domain-core
term: '[domain].core'
layer: what
kind: artefact
definition: A commons like any other whose domain model is an emulation, developed there and released deliberately, while
  its research stays whole in `knowledge/` and is never released.
why: 'Holger, 3 November 2026 (commons.o#109, comments 6597458021 and 6599799364): a [domain].core is a commons like any
  other, so nothing special holds for it, a holder, a licence and the full checks of a CORE among what holds for every one.
  Its primary is domain.core''s research model, from which it builds its runtime; until domain.core has released one, no
  primary yet is its expected gap, and it runs on the Commons model alone.'
relations:
  makes: domain-model
  primary_from: domain.core
not:
- Extension-Builders, withdrawn
status: draft
decided:
  date: '2026-11-04'
  by: Holger
  where: 'commons.o#110, comment 6625957149: Adopted 4 November 2026 with structure 0.4.0 (the merge 7a5fbda); earlier 2026-10-28,
    commons.o#90, comment 6464648757'
