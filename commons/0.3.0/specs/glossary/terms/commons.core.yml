id: commons.core
term: commons.core
layer: what
kind: repository
definition: The full CORE that delivers the Commons model, commons, the grammar every model is written in, and that holds
  orbits 0 to 3 of the patterns.
why: Holger, 3 November 2026 (commons.o#109, comment 6600137634; commons.o#110). It is the [domain].core of the Commons
  model and of orbits 0 to 3, released as an extract of their own, and the aggregation of all domains, the fast path for
  federation.graph and federation.mcp. Its primary is domain.core's model (decision 20). It is the repository that was commons.o.
  Not commons-core, the public template of every CORE's hull, and not Commons CORE, the concept. Its id spells the dot,
  since ids hold none.
relations:
  is_a: domain-core
  delivers: model
not:
- commons.o, its earlier name
- the commons-core template
status: draft
decided:
  date: '2026-11-04'
  by: Holger
  where: 'commons.o#110, comment 6625957149: Adopted 4 November 2026 with structure 0.4.0 (the merge 7a5fbda)'
