  card: 1..1
- name: planning-period
  type: period
  card: 1..1
- name: annual-spend
  type: amount
  card: 0..1
- name: sourcing-route
  type: code
  card: 1..1
- name: standard-items
  type: reference(inventory-item)
  card: 0..*
- name: targets
  type: text
  card: 1..*
states:
- draft
- approved
- in-execution
- under-review
- closed
relations:
- type: based-on
  target: strategy
- type: refers-to
  target: supplier-organisation
- type: refers-to
  target: contract
binds:
- source: src-137
  edition: '26.0'
