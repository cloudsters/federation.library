kind: entity
slug: service-journey-map
title: Service Journey Map
type: intelligence
summary: The map of each step a resident takes to find, request and receive a service, with the places where residents get stuck and
  why. Users and staff make it together, walking the journey with disabled residents, elders and multilingual speakers, and it is
  used to redesign the service and its routes.
