kind: entity
slug: verifiable-credential
title: Verifiable Credential
type: intelligence
summary: 'A cryptographically signed attestation issued by the Commons MCP proving a commons’ governance characteristics without revealing
  internal data. Zero-knowledge trust: a commons can prove ‘we are 100% circular’ or ‘we pay fair wages’ without exposing supply chain
  data. The credential is the trust currency of the intent fabric — what agents inspect during A2A negotiation to verify counterparty
  alignment.'
attributes:
- name: issuer
  type: text
  card: 1..1
- name: subject
  type: reference(stakeholder)
  card: 1..1
- name: claim
  type: text
  card: 1..1
- name: validity
  type: period
  card: 1..1
- name: signature
  type: document
  card: 1..1
states:
- issued
- presented
- verified
- renewed
- revoked
relations:
- type: refers-to
  target: stakeholder
