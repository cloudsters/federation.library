kind: entity
slug: city-events-calendar
title: City Events Calendar
type: master
summary: The single calendar of events across the year and the neighbourhoods, with each event's dates, place and organiser, built
  on the city's own seasons, festivals and work cycles. The administration keeps it open to organisers, residents and visitors, and
  it is used to spread events across the year, to avoid clashes and to tell neighbours in advance.
