kind: entity
slug: knowledge-article
title: Knowledge Article
type: master
summary: A dated and sourced piece of the city's working knowledge, such as the everyday expertise of frontline staff, a way of handling
  a case or what a person leaving a role handed over, credited to those who hold it. Its owner keeps it current in the city's body
  of knowledge, open to staff, partners and, where suitable, residents, and it is retired when it is outdated.
