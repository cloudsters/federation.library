kind: stakeholder
slug: environmental-health-officer
title: Environmental Health Officer
nature: person
stance: serving
summary: A member of the city's environmental health office who monitors air, noise, land and heat hazards, inspects their sources
  and orders them stopped. They answer to residents for what was found and what follows.
seeks:
- Early reports from residents, readings from every neighbourhood and the power to order a hazard stopped by a set date.
brings:
- Inspections of reported hazards, recorded findings, orders to those responsible and checks that remedies are done.
represented_by:
- environmental-health-office
