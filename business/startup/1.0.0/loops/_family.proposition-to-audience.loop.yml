# startup's family loop: corporate's loop of the same slug, its streams those of startup 
loop: _family.proposition-to-audience
title: Keep the family 'Proposition to Audience' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: proposition-to-audience
  vs:
  - direct-distribution
  - platform-ecosystem-distribution
stance: The value proposition reaches its receiving & interacting community (1:n). No single stream of this family can see
  what its streams do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed reporting period of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was activated, adapted or not selected in the registry
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/proposition-to-audience
  - value-model.yml#vs/distribution-strategy-design
  - value-model.yml#vs/direct-distribution
  - value-model.yml#vs/platform-ecosystem-distribution
  - value-model.yml#vs/community-network-distribution
  - value-model.yml#vs/commons-open-distribution
  - value-model.yml#vs/channel-partner-distribution
  registry:
  - instance/registry/5_value-streams/distribution-strategy-design.md
  - instance/registry/5_value-streams/direct-distribution.md
  - instance/registry/5_value-streams/platform-ecosystem-distribution.md
  - instance/registry/5_value-streams/community-network-distribution.md
  - instance/registry/5_value-streams/commons-open-distribution.md
  - instance/registry/5_value-streams/channel-partner-distribution.md
  loop_states:
  - instance/operations/loops/_state/distribution-strategy-design.yml
  - instance/operations/loops/_state/direct-distribution.yml
  - instance/operations/loops/_state/platform-ecosystem-distribution.yml
  - instance/operations/loops/_state/community-network-distribution.yml
  - instance/operations/loops/_state/commons-open-distribution.yml
  - instance/operations/loops/_state/channel-partner-distribution.yml
  measures:
  - active-partners-certified
  - assigned-customers-contacted
  - checkout-abandonment
  - complementor-onboarding-time
  - complementor-retention
  - contributions-reviewed-within-thirty-days
  - contributions-taken-in
  - cost-of-sales-and-distribution-share-of-revenue
  - cross-channel-offer-consistency
  - customers-with-a-single-coverage-owner
  - direct-channel-cost-per-order
  - direct-channels-meeting-reach-and-conversion-targets
  - forks-connected-to-their-origin
  - free-level-ninety-day-retention
  - gathering-contacts-followed-up-within-ten-days
  - gathering-participant-satisfaction
  - growth-in-active-adopters
  - largest-platform-dependency
  - markets-with-an-approved-distribution-plan
  - members-both-giving-and-receiving
  - new-customers-from-referrals-and-community
  - online-visit-to-order-conversion
  - partner-channel-cost-share-of-partner-revenue
  - partner-performance-reviews-held
  - partners-meeting-plan
  - platform-fees-share-of-platform-revenue
  - published-interface-availability
  - referral-rewards-paid-as-agreed
  - referrals-rejected-for-manipulation
  - registered-deals-in-channel-conflict
  - releases-with-licence-and-documentation
  - sales-forecast-accuracy
  - satisfaction-of-partner-served-customers
  - sellers-attaining-target-within-range
  - usage-carried-through-platforms-and-interfaces
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.proposition-to-audience.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never writes into
  the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided or passed
    to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or the commons declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
