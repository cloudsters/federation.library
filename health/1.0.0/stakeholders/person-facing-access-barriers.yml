kind: stakeholder
slug: person-facing-access-barriers
title: Person Facing Access Barriers
nature: person
stance: served
summary: A person who does not reach the care they need because of language, poverty, homelessness, disability, residence status or
  distrust. Absent from waiting lists and appointment books, such a person often appears late, in the emergency department.
seeks:
- Care offered where they are, in a language and form they understand, without administrative hurdles or judgement.
brings:
- Knowledge of the barriers in the system, and the chance for the commons to fulfil its mandate for the whole population rather than
  for those who find their way in.
represented_by:
- patient
