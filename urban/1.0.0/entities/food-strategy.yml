title: Food Strategy
type: governance
summary: The city's plan for how fresh and affordable food reaches every neighbourhood, from the producers of the region to pickup
  points within walking distance. The council adopts it from the mapping of food access and the hub partners help review it, and hubs,
  delivery rules and surplus food are planned within it.
