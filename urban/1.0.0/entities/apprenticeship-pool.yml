kind: entity
slug: apprenticeship-pool
title: Apprenticeship Pool
type: master
summary: The shared pool through which the city, employers, unions, training providers and anchor institutions fund apprenticeships,
  pay mentors and place apprentices. Its members govern it together and keep its accounts, and it is used to pay stipends and mentors
  and to place apprentices with member employers.
