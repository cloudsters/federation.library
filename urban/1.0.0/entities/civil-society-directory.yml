slug: civil-society-directory
title: Civil-Society Directory
type: intelligence
summary: The map of the associations, cooperatives, faith communities and anchor institutions active in the city, whom each serves,
  where it works and the relationship the city holds with it. The administration keeps it with community bodies and updates it, and
  it is used to see whom civil society reaches and where no one does.
