kind: entity
slug: ecological-cost-ledger
title: Ecological Cost Ledger
type: intelligence
summary: The public ledger of the carbon, heat, water and other ecological costs the city creates, recorded next to its money, and
  of what it owes to repair them and to whom. The finance department keeps it with the departments that cause the costs and updates
  it at a regular rhythm, and it is read beside the budget, the annual accounts and the fiscal sustainability report.
