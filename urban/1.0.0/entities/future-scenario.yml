kind: entity
slug: future-scenario
title: Future Scenario
type: intelligence
summary: An alternative future of the city or of its land use over a stated horizon, including futures the city would not want, with
  the assumptions and trends it rests on. The administration draws it up from the residents' visions, the whole-city assessment and
  the trends in population, climate, economy and the region, and it is weighed in the vision and the spatial plan.
