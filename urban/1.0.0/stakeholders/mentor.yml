kind: stakeholder
slug: mentor
title: Mentor
nature: person
stance: serving
summary: An experienced worker, master craftsperson or elder who teaches an apprentice, a new member of staff or a successor and is
  paid for it. Mentors teach inside the work rather than in a classroom.
seeks:
- Time to teach paid as knowledge work, apprentices who commit and a say in what the trade requires.
brings:
- Skills, judgement and relationships built over a working life, and the attestation of an apprentice's competence.
