kind: entity
slug: distribution-hub
title: Distribution Hub
type: master
summary: A shared loading bay, consolidation hub or food pickup point at neighbourhood scale, with its site, partners, hours and capacity.
  The partners who run it keep the record with the city under its operating agreement, and it is used to book delivery slots, bundle
  orders and bring goods the last distance by clean vehicle or on foot.
