kind: entity
slug: supply-dependency-map
title: Supply Dependency Map
type: intelligence
summary: The published map of where each essential good, such as food, water, medicine and fuel, comes from, which rest on a single
  supplier or a distant chain, and which neighbourhoods would be cut off first. The procurement office makes it with services and
  neighbourhood bodies, and it is used to set sufficiency levels, qualify standby suppliers and place reserves.
