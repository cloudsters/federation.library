kind: entity
slug: wage-floor-agreement
title: Wage Floor Agreement
type: governance
summary: The agreement negotiated with workers and employers of a sector on wage floors indexed to living costs, benefits and progression,
  binding on the contractors the city uses. Worker representatives, employers and the city renew it each year, and it is written into
  procurement and used in the fair work audit of every contractor.
