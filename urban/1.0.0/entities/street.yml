  card: 1..*
- name: course
  type: document
  card: 1..1
- name: length
  type: quantity
  card: 0..1
- name: street-kind
  type: code
  card: 1..1
- name: speed-limit
  type: quantity
  card: 0..1
- name: surface-condition
  type: code
  card: 0..1
- name: crossings
  type: integer
  card: 0..1
- name: school-route
  type: boolean
  card: 0..1
- name: wayfinding-elements
  type: reference(wayfinding-element)
  card: 0..*
- name: maintained-by
  type: reference(department)
  card: 1..1
states:
