kind: entity
slug: development-agreement
title: Development Agreement
type: governance
summary: The binding agreement between the city, landowners and developers on a development, with its commons space, affordable homes,
  community benefit fund, the community's right to buy first and the share of the rise in land value it returns. The city negotiates
  it and the legal office reviews it, the council approves it, and residents and the city review its delivery after the quarter is
  built.
