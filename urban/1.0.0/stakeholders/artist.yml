kind: stakeholder
slug: artist
title: Artist
nature: person
stance: served
summary: A person who makes art, music, performance or craft in the city, whether paid, unpaid or in between. Artists often teach,
  run their own spaces and carry the living culture of a neighbourhood.
seeks:
- Affordable space to work and teach, fair pay, a say in what is shown of their culture, and protection from being priced out.
brings:
- Work that gives the city its character, teaching that passes skills on, and spaces that open their doors to neighbours.
represented_by:
- cultural-organisation
