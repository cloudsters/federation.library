  type: identifier
  card: 1..1
- name: address
  type: text
  card: 1..1
- name: land-parcel
  type: reference(land-parcel)
  card: 1..1
- name: owner
  type: text
  card: 1..1
- name: current-use
  type: code
  card: 1..1
- name: former-uses
  type: text
  card: 0..*
- name: construction-year
  type: integer
  card: 0..1
- name: floor-area
  type: quantity
  card: 0..1
- name: surveyed-condition
  type: code
  card: 0..1
- name: heritage-protection
  type: reference(heritage-protection)
  card: 0..1
- name: planned-future
  type: code
  card: 0..1
- name: histories
  type: reference(civic-memory-record)
  card: 0..*
