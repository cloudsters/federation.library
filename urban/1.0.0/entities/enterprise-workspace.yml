kind: entity
slug: enterprise-workspace
title: Enterprise Workspace
type: master
summary: A workspace, shared kitchen or workshop offered to founders and small businesses at an affordable rent, with its users and
  terms. The body that runs it keeps the record, often in a vacant public building, and it is used to allocate space, to set rents
  and to give its users a share in deciding how it is run.
