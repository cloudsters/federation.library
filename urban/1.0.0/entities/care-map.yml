kind: entity
slug: care-map
title: Neighbourhood Care Map
type: intelligence
summary: The map, made with residents and with the consent of those named, of the care neighbours already give, the residents living
  isolated, the carers under strain and the gaps no one covers. Residents and community workers make it together and the neighbourhood
  body holds it with access limited by that consent, and it is used to direct neighbour care, mutual aid and formal services to where
  they are missing.
