kind: stakeholder
slug: older-resident
title: Older Resident
nature: person
stance: served
summary: An older person living in the city, who carries much of its memory and care and is at most risk of isolation. Older residents
  often wish to stay in their own neighbourhood among the people they know.
seeks:
- Company and help close to home, places where they meet younger neighbours, and respect for what they know.
brings:
- The memory of the neighbourhood, time and care given to others, and knowledge to pass on to younger generations.
represented_by:
- neighbourhood-association
- civil-society-organisation
