loop: _family.perception-to-mandate
title: Keep the family 'Perception to Mandate' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: perception-to-mandate
  vs:
  - becoming-to-identity
  - inheritance-to-choice
  - conviction-to-conduct
  - experience-to-story
  - noticing-to-discernment
  - exposure-to-boundary
  - rupture-to-continuity
  - mortality-to-mandate
stance: The system perceives itself as a whole and holds its irreducible mandate — identity, boundary, legitimacy,
  ethics, the reason to exist. No single stream of this family can see what its streams do to one another; this
  loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed season of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was built into the runtime, adapted there, or left on the shelf
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/perception-to-mandate
  - value-model.yml#vs/becoming-to-identity
  - value-model.yml#vs/inheritance-to-choice
  - value-model.yml#vs/conviction-to-conduct
  - value-model.yml#vs/experience-to-story
  - value-model.yml#vs/noticing-to-discernment
  - value-model.yml#vs/exposure-to-boundary
  - value-model.yml#vs/rupture-to-continuity
  - value-model.yml#vs/mortality-to-mandate
  registry:
  - instance/registry/5_value-streams/becoming-to-identity.md
  - instance/registry/5_value-streams/inheritance-to-choice.md
  - instance/registry/5_value-streams/conviction-to-conduct.md
  - instance/registry/5_value-streams/experience-to-story.md
  - instance/registry/5_value-streams/noticing-to-discernment.md
  - instance/registry/5_value-streams/exposure-to-boundary.md
  - instance/registry/5_value-streams/rupture-to-continuity.md
  - instance/registry/5_value-streams/mortality-to-mandate.md
  loop_states:
  - instance/operations/loops/_state/becoming-to-identity.yml
  - instance/operations/loops/_state/inheritance-to-choice.yml
  - instance/operations/loops/_state/conviction-to-conduct.yml
  - instance/operations/loops/_state/experience-to-story.yml
  - instance/operations/loops/_state/noticing-to-discernment.yml
  - instance/operations/loops/_state/exposure-to-boundary.yml
  - instance/operations/loops/_state/rupture-to-continuity.yml
  - instance/operations/loops/_state/mortality-to-mandate.yml
  measures:
  - boundary-disclosures-chosen
  - boundary-hours-in-largest-role
  - boundary-recognisable-outside-role
  - boundary-removal-asked
  - conduct-collisions-decided-knowingly
  - conduct-held-firm-when-it-cost
  - conduct-week-checked-against-values
  - conduct-week-matches-the-words
  - continuity-days-to-daily-rhythm
  - continuity-others-allowed-to-carry
  - continuity-recognise-oneself-again
  - continuity-what-has-deepened
  - discernment-blind-spots-asked
  - discernment-chosen-input-share
  - discernment-convictions-traced-to-source
  - discernment-moved-before-checking
  - identity-acting-without-permission
  - identity-others-asked-what-they-see
  - identity-self-description-revisions
  - inheritance-kept-share
  - inheritance-old-rule-deciding-unnoticed
  - inheritance-released-patterns-changed-at-home
  - inherited-beliefs-sorted
  - mortality-lived-by-what-matters
  - mortality-postponed-choices-settled
  - mortality-purpose-read-back
  - mortality-said-to-those-who-stay
  - self-description-holds-when-read-back
  - story-breaks-given-a-place
  - story-next-chapter-open
  - story-steering-beliefs-named
  - story-told-to-someone
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.perception-to-mandate.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never
  writes into the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided
    or passed to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or this life declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
