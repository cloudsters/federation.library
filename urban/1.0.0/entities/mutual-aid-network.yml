kind: entity
slug: mutual-aid-network
title: Mutual Aid Network
type: master
summary: A group of neighbours who share meals, tools, funds and care and rotate duties among themselves, with its members, area and
  how it decides. Its members keep the record themselves and the city records only what they choose to share, and it is used to connect
  isolated residents and carers to help and, where they need more, to formal services.
