kind: stakeholder
slug: community-land-trust
title: Community Land Trust
nature: organisation
stance: serving
summary: A resident-governed body that holds land in permanent trust to keep homes and spaces affordable. It takes land out of speculation
  and gives residents control over how it is used.
seeks:
- Access to public land on long-term leases, a fair share of released plots and the right to buy first when land or homes are sold.
brings:
- Homes and shared spaces kept affordable across generations, and a resident body that governs them.
represented_by:
- neighbourhood-association
