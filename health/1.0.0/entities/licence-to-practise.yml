kind: entity
slug: licence-to-practise
title: Licence to Practise
type: governance
summary: The entitlement, granted by the competent public authority, for a person to practise a regulated health profession, verified
  at hiring and kept current with its restrictions; no care may be performed in that profession without it.
attributes:
- name: employee
  type: reference(employee)
  card: 1..1
- name: profession
  type: code
  card: 1..1
- name: issuing-authority
  type: reference(organisation)
  card: 1..1
- name: licence-number
  type: identifier
  card: 1..1
- name: valid-period
  type: period
  card: 0..1
- name: restrictions
  type: text
  card: 0..*
- name: verified-on
  type: date
  card: 1..1
states:
- pending-verification
- verified
- restricted
- suspended
- revoked
- expired
relations:
- type: governed-by
  target: compliance-obligation
binds:
- source: src-018
  edition: 4.0.1
  jurisdiction: global
- source: src-001
  edition: '2026'
  jurisdiction: global
- source: src-002
  edition: '2025'
  jurisdiction: global
