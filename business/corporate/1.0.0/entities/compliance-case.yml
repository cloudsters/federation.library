  card: 1..1
- name: received-on
  type: date
  card: 1..1
- name: obligations-concerned
  type: reference(compliance-rule)
  card: 0..*
- name: finding
  type: code
  card: 0..1
- name: notified-authority
  type: reference(counterparty)
  card: 0..1
