summary: An association, cooperative or faith community active in the city's public life. Such organisations speak for groups, run
  services and watch how the city treats them.
seeks:
- A recognised place beside the municipality, open records and a fair hearing for those they speak for.
brings:
- Organised members, services that the city does not run itself, independent scrutiny and expertise on those it serves.
