title: Quality and Safety Manager
nature: person
stance: serving
summary: A professional who runs the quality management system, clinical risk management and patient safety learning, such
  as a quality manager, risk manager or patient safety officer, supporting the units and reporting to the executive board.
seeks:
- Open reporting, reliable data and leaders who act on findings, so that improvement reaches the ward and lasts.
brings:
- Methods, facilitation and an independent view across units that turn incidents, audits and indicators into learning and
  into evidence of safe care.
