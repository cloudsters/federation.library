kind: entity
slug: shared-use-agreement
title: Shared-Use Agreement
type: governance
summary: The agreement that opens a school, library or other public building or ground to neighbourhood use outside its core hours,
  with the hours, the rules, who holds the keys and who pays for upkeep. The owner of the building and the neighbourhood body that
  uses it sign it, and it is used to open the doors and to settle who answers for keys, rules and upkeep.
