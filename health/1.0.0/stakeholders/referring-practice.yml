kind: stakeholder
slug: referring-practice
title: Referring Practice
nature: organisation
stance: served
summary: A general or specialist practice that refers a patient it cannot treat alone and expects the patient back with a
  clear report. It is both a point of access and a recipient; the handover runs in both directions.
seeks:
- Easy referral, fast acceptance, timely results and a discharge letter that arrives when the patient returns.
brings:
- A steady flow of planned patients and the local knowledge of each patient's history that makes specialist care safe.
represented_by:
- organisation
