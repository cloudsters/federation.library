kind: entity
slug: tender-specification
title: Tender Specification
type: transactional
summary: The documents of one tender, with the need stated by outcome and standard rather than by brand, the lots, the criteria and
  weights, and the fair-work, local-hiring, data and circular conditions and the exit plan written in. The requesting department writes
  it with those who will use what is bought, the procurement office publishes it, and every bid is made and evaluated against it.
