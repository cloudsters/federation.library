kind: entity
slug: event-application
title: Event Application
type: transactional
summary: A proposal to hold an event, from receipt through assessment to decision, with what it brings to residents and visitors,
  its demands on streets, parks and services and the communities it presents. The administration receives it by one route, gives first-time
  organisers early advice and decides it within a set time, and an approved application is the basis of the event's permit.
