kind: entity
slug: service-account
title: Service Account
type: master
summary: 'An account this life holds at a provider — a mailbox, a cloud store, a subscription, a profile, the login a household runs
  through — held with its terms and its way out. Held apart from `account`, which is where money sits: this is where data, work and
  access sit, and the useful fact about it is how it ends.'
attributes:
- name: provider
  type: reference(provider-relation)
  card: 1..1
- name: used-for
  type: text
  card: 1..*
- name: opened-on
  type: date
  card: 0..1
- name: terms
  type: reference(contract)
  card: 0..1
- name: cost
  type: money
  card: 0..1
- name: holds
  type: code
  card: 0..*
- name: way-out
  type: text
  card: 0..1
- name: way-out-tried
  type: boolean
  card: 0..1
states:
- opened
- in use
- dormant
- being emptied
- closed
relations:
- target: provider-relation
  type: depends-on
- target: contract
  type: based-on
