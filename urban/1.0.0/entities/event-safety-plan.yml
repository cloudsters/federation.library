kind: entity
slug: event-safety-plan
title: Event Safety Plan
type: governance
summary: The agreed plan for keeping an event safe, stewarded and cleared, with its crowd capacity, routes, stewards, medical cover
  and emergency arrangements. The organiser writes it and agrees it with the emergency services and the city, and it is a condition
  of the permit and the brief for stewards and volunteers.
