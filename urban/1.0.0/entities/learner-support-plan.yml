kind: entity
slug: learner-support-plan
title: Learner Support Plan
type: transactional
summary: The support agreed around a learner at risk of leaving learning, with who does what and the learner's own view. The school
  keeps it with the learner and family, and it is reviewed until the learner is back on track or on another route.
