kind: stakeholder
slug: data-subject
title: Data Subject
nature: person
stance: served
summary: Any person whose personal information the commons holds, whether patient, relative, employee, applicant or research participant,
  in the relation of the one entitled to know, correct, restrict and object to its use.
seeks:
- Transparency about which data the commons holds and why, answers to requests within the deadline, and protection against misuse
  and breaches.
brings:
- The trust that lets the commons collect and use the information on which care, research and administration depend.
