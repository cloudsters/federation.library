kind: stakeholder
slug: infection-prevention-specialist
title: Infection Prevention Specialist
nature: person
stance: serving
summary: A hygiene physician, infection prevention nurse or link nurse who sets hygiene standards, runs surveillance, advises on isolation
  and leads the response to outbreaks together with microbiology and pharmacy.
seeks:
- Timely laboratory data, staff who follow the standards without exception and the authority to act quickly when a cluster appears.
brings:
- Specialist knowledge of transmission and prevention that protects patients and staff from healthcare-associated infection and resistant
  organisms.
represented_by:
- employee
