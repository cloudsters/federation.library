kind: stakeholder
slug: community-story-council
title: Community Story Council
nature: organisation
stance: serving
summary: The resident body of a neighbourhood or community that governs its story archive. It decides what is shared outward, how
  members' stories are framed and attributed, and on what terms others may reuse them.
seeks:
- Space and care for the archive without the city taking control of its contents, and requests to reuse stories that come to it before
  anything is published.
brings:
- Curation of the community's stories, review of how the community is shown, and decisions on reuse that tellers can trust.
represented_by:
- neighbourhood-council
