kind: value-stream
slug: workforce-planning
title: Workforce Planning
family: contributor-to-succession
summary: 'Planning the workforce the organisation needs, human and digital: demand by profession and skill mix, supply and attrition
  forecasts, workforce policies, data and metrics.'
trigger: The planning cycle opens, or service changes or staffing gaps alter workforce demand.
outcome: An approved workforce plan by profession, unit and skill mix sets the targets for recruitment, training and deployment.
stakeholders:
- executive
- head-of-clinical-department
- unit-manager
- administrative-staff
- staff-representation
- operations-planning-agent
steps:
- slug: planning-mandate
  title: Planning Mandate
  summary: The board opens the planning cycle and sets the horizon, the strategic and service assumptions and the personnel budget
    frame within which every unit plans its workforce.
  capabilities:
  - people-strategy-design
  - strategy-alignment-across-functions
  - workforce-policy-design
  - planning-and-budgeting
  entities:
  - strategy
  - strategic-objective
  - budget
  - workforce-plan
  serves:
  - workforce-planning-round
- slug: workforce-baseline
  title: Workforce Baseline
  summary: 'Establish the current workforce of each unit from trusted employee data: filled, vacant and frozen posts by profession
    and grade, age profile, part-time share, turnover, absence and overtime.'
  capabilities:
  - workforce-reporting
  - employee-data-stewardship
  - hr-information-systems
  - workforce-analytics-deployment
  entities:
  - position
  - employee
  - employment
  - measure-report
  serves:
  - workforce-dashboard
- slug: demand-forecast
  title: Demand Forecast
  summary: Derive the staff each unit will need by profession and qualification from planned activity, service changes, case mix and
    acuity, binding staffing standards, service group criteria and teaching and research duties.
  capabilities:
  - strategic-workforce-planning
  - workload-estimation
  - resource-capacity-planning
  - predictive-analytics
  - service-group-qualification
  entities:
  - capacity-forecast
  - staffing-standard
  - service-group-assignment
  - organisation-unit
  serves:
  - workforce-planning-round
- slug: supply-forecast
  title: Supply Forecast
  summary: 'Project the workforce the organisation will have: attrition, retirements and changes in working time from within, trainees
    completing their training, and what the labour market and the education pipeline can supply.'
  capabilities:
  - strategic-workforce-planning
  - workforce-analytics-deployment
  - talent-pipeline-development
  - retention-management
  entities:
  - employment
  - employee
  - learner-record
  - measure-report
  serves:
  - workforce-dashboard
- slug: gap-closure-design
  title: Gap Closure Design
  summary: 'Decide how each gap is closed: recruit, train, redeploy, shift tasks between professions, engage temporary staff or assign
    defined work to AI agents, weighing cost, quality, risk and inclusion.'
  capabilities:
  - skill-mix-design
  - competency-model-design
  - contingent-workforce-management
  - human-agent-collaboration-design
  - care-model-shift-planning
  - diversity-and-inclusion
  entities:
  - workforce-plan
  - competency
  - position
  - ai-system
  serves:
  - workforce-planning-round
- slug: plan-approval
  title: Plan Approval
  summary: Consolidate the unit plans, cost them against the personnel budget, consult the staff representatives, and approve targets
    per profession, unit and skill mix together with the authority to recruit.
  capabilities:
  - planning-and-budgeting
  - co-determination-cooperation
  - delegation-of-authority
  - board-communication-reporting
  entities:
  - workforce-plan
  - budget
  - governance-decision
  - position
  serves:
  - staff-consultation
  - workforce-plan
- slug: plan-monitoring
  title: Plan Monitoring
  summary: Track filled posts, turnover, overtime and temporary staff against the plan each month, and trigger corrective action or
    replanning when the gap widens.
  capabilities:
  - workforce-reporting
  - integrated-performance-review
  - business-intelligence-and-reporting
  - financial-performance-management
  entities:
  - measure-report
  - dashboard
  - workforce-plan
  - position
  serves:
  - workforce-dashboard
binds:
- source: src-155
  edition: '2025'
  jurisdiction: global
- source: src-464
  edition: 2nd ed. 2023
  jurisdiction: global
- source: src-471
  edition: 2nd ed. 2023
  jurisdiction: global
