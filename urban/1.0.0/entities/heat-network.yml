kind: entity
slug: heat-network
title: Heat Network
type: master
summary: A network that carries heat from waste heat, renewable sources and stores to homes and businesses, with its owners and connections.
  The operator keeps the record for the owners, whether the city, a municipal enterprise or a cooperative, and uses it to connect
  households and to plan new sources and stores.
