kind: capability
slug: post-life-commons-governance
title: Post-Life Commons Governance
level: L3
parent: separation-and-transition
summary: Manage deceased participants’ ongoing commons membership — governance seats, data commons, resource directives. Digital persistence
  means participants continue to hold rights and issue directives after biological death. Post-life governance is time-bounded, contestable
  by the living, and a 2050 design requirement, not an edge case.
