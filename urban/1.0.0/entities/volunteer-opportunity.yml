kind: entity
slug: volunteer-opportunity
title: Volunteer Opportunity
type: transactional
summary: A task residents can take on for the city or a partner, from a single afternoon to a standing role, with its purpose, place,
  time, the skills needed and the checks it requires. The department, neighbourhood body or civil-society organisation offering it
  describes it, and the city publishes it in one place so that residents can find it, including a resident who reported the problem
  it fixes.
