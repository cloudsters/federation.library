title: Value Token
type: intelligence
summary: 'Multi-dimensional value representation — CO2 budget, reputation points, strategic alignment, cooperative shares, compute
  credits, ecological credits. Not just fiat money with a different name: each dimension preserves its relational grammar. A governance
  token is not convertible to cash without losing its meaning.'
