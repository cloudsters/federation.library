kind: entity
slug: medication-administration
title: Medication Administration
type: transactional
summary: The record that a dose of medication was given to, taken by or withheld from a patient, with time, dose, route and the person
  who administered it, closing the loop from order to patient.
attributes:
- name: patient
  type: reference(patient)
  card: 1..1
- name: medication-order
  type: reference(medication-order)
  card: 1..1
- name: administered-at
  type: datetime
  card: 1..1
- name: dose
  type: quantity
  card: 1..1
- name: route
  type: code
  card: 1..1
- name: administered-by
  type: reference(practitioner-role)
  card: 1..1
- name: not-given-reason
  type: code
  card: 0..1
states:
- in-progress
- completed
- not-done
- entered-in-error
relations:
- type: based-on
  target: medication-order
binds:
- source: src-018
  edition: 4.0.1
  jurisdiction: global
- source: src-001
  edition: '2026'
  jurisdiction: global
- source: src-002
  edition: '2025'
  jurisdiction: global
- source: src-016
  edition: 2.3.0
  jurisdiction: global
- source: src-015
  edition: 1.1.0
  jurisdiction: global
- source: src-405
  edition: v2.9.1
  jurisdiction: global
