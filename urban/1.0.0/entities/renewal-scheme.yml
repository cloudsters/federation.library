kind: entity
slug: renewal-scheme
title: Renewal Scheme
type: transactional
summary: The coordinated renewal of the ageing streets, pipes, lighting, trees and buildings of a neighbourhood, with its scope, stages,
  operators and the agreements made with residents. The asset office carries it within a capital project, checks that it does not
  displace those who live there, and closes it when the renewed assets are handed over.
