kind: entity
slug: support-service-order
title: Support Service Order
type: transactional
summary: A request for a non-clinical support service, such as patient transport, cleaning, catering, porterage or waste removal,
  routed to the service team and tracked to completion within its agreed service level.
attributes:
- name: service-kind
  type: code
  card: 1..1
- name: requesting-unit
  type: reference(organisation-unit)
  card: 1..1
- name: patient
  type: reference(patient)
  card: 0..1
- name: location
  type: reference(room)
  card: 0..1
- name: priority
  type: code
  card: 1..1
- name: requested-at
  type: datetime
  card: 1..1
- name: due-at
  type: datetime
  card: 0..1
- name: completed-at
  type: datetime
  card: 0..1
states:
- requested
- accepted
- in-progress
- completed
- cancelled
relations:
- type: refers-to
  target: room
- type: governed-by
  target: contract
binds:
- source: src-018
  edition: 4.0.1
  jurisdiction: global
