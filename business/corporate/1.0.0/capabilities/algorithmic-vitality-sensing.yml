summary: The Purpose Agent permanently scans all four dimensions and posts imbalances as governance issues before any human notices. When
  D4 burns out to serve D3, or D2 participation weakens while D3 revenue grows, the sensing detects the imbalance and escalates. It
  is the organisation's early warning of its own imbalance.
