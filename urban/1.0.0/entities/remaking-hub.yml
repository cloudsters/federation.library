kind: entity
slug: remaking-hub
title: Remaking Hub
type: master
summary: A neighbourhood facility that sorts textiles or metals by type and condition and remakes them into new material and goods,
  giving local work. A cooperative or social enterprise runs it with support from the city, and what it recovers is reported with
  the city's waste figures.
