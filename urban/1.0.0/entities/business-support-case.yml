kind: entity
slug: business-support-case
title: Business Support Case
type: transactional
summary: The record of the advice, finance, space and contacts the city gives a founder, an enterprise or an investor, from first
  contact to close. The adviser named at the one point of contact keeps it, and it is used to follow each founder through permits,
  finance and mentoring and to review whom the support reached.
