kind: entity
slug: request-mandate
title: Request Mandate
type: governance
summary: A care mandate that entitles a care professional or unit to request care for a patient from another care actor, inside or
  outside the organisation, such as ordering a test, requesting a consultation or issuing a referral, and to pass on the information
  that request needs.
