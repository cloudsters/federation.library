summary: Developers, designers and residents who build, audit and improve the open software and data tools of the city and its peer
  cities. They work in the open, often without pay.
seeks:
- Published code, interfaces and data, notice before they change, and a city that takes back their improvements.
brings:
- Audits, tools built on the city's interfaces, weaknesses reported in confidence and improvements given to the shared code.
