kind: entity
slug: public-space
title: Public Space
type: master
summary: A square, plaza, open street or other space open to all, with its uses, its places to sit, rest and stay and those who care
  for it. The department responsible keeps the record with those who hold a care agreement, and it is used to answer requests for
  use, to plan shade, water, toilets and lighting and to keep the space open to all.
