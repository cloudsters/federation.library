kind: entity
slug: decision-rights-register
title: Decision Rights Register
type: governance
summary: The published record of which decisions rest with residents, neighbourhoods, recognised community bodies, the council, the
  mayor, the administration and metropolitan bodies, with the delegations, approval limits and bounded emergency rights between them.
  The council office keeps it, open to challenge, and it is consulted before any decision is taken.
