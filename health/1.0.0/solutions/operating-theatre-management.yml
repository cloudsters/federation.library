title: Operating Theatre Management
role: system-of-record
summary: 'Plans and records the work of operating theatres and interventional suites: session allocation, case scheduling, team and
  equipment, intraoperative documentation, implants and recovery. It is the authority for every surgical case and its use of theatre
  time.'
