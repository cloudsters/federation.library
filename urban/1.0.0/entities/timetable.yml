kind: entity
slug: timetable
title: Timetable
type: governance
summary: The published hours and frequencies of a transit line, including guaranteed night service, with the reasoning for each change.
  The transport operator sets it with riders and drivers under the mobility plan and publishes it, and crews, vehicles and rider information
  are planned from it.
