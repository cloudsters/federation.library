kind: entity
slug: payment-performance-report
title: Payment Performance Report
type: intelligence
summary: The published account of how quickly the city paid its suppliers, small and large, and of each payment above a set amount
  with its supplier, purpose and amount. The finance office compiles it each quarter from the payment records, and residents, resident
  inspectors and the council use it to see where the money went and whether small suppliers were paid on time.
