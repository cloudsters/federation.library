kind: entity
slug: incubator-programme
title: Incubator Programme
type: transactional
summary: A programme that takes in a group of founders for a stated time, with its offer, its selection, the say founders have in
  it and its results. The body that runs it records it with the economic development office, and it is used to select founders openly,
  to share decisions with them and to review how many enterprises still trade when it ends.
