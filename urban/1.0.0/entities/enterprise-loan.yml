kind: entity
slug: enterprise-loan
title: Enterprise Loan
type: transactional
summary: A small loan or patient capital given to an enterprise from a city fund or a community or public bank, with repayment that
  follows the enterprise's income. The lender keeps the loan account and the business support service records it on the founder's
  case, and it is used to reach founders whom banks overlook and to reschedule repayment when income falls.
