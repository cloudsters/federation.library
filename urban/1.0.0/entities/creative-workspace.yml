kind: entity
slug: creative-workspace
title: Creative Workspace
type: master
summary: A studio, rehearsal room or workshop let at an affordable rent in a public building or an empty space and run by the artists
  who use it, with their commitment to teach and to open their doors to neighbours. The group of artists runs it under an agreement
  with the city or the owner, and the record is used to allocate space, to set rents and to protect it from displacement.
