kind: entity
slug: informed-consent
title: Informed Consent
type: governance
summary: A patient's, participant's or proxy's agreement to a specific care activity, to taking part in a research study or to the
  presence of learners, given with capacity to decide after information about purpose, risks and alternatives, and recorded with what
  was explained and by whom.
