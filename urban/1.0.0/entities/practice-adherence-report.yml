kind: entity
slug: practice-adherence-report
title: Practice Adherence Report
type: intelligence
summary: The report of whether practice in a service follows a standard procedure and whether the outcomes the procedure promises
  hold, with the deviations found and their reasons. The service prepares it at a regular rhythm with its staff and passes it to those
  who curate the pattern library, and it is used to revise the procedure or to revise or retire the pattern behind it.
