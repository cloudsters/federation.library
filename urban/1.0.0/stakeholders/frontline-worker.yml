kind: stakeholder
slug: frontline-worker
title: Frontline Worker
nature: person
stance: serving
summary: A member of staff who delivers a service every day, such as a driver, a maintenance crew member or a caseworker, and knows
  the system from the inside. Frontline workers see first where a process waits, fails or puts residents off.
seeks:
- A real say in how their work is designed and automated, credit for what they know, and a workload that stays humane.
brings:
- Knowledge of how services actually run, where they fail and how to fix them, gathered inside the work.
represented_by:
- staff-representative
- staff-council
