kind: solution
slug: closed-loop-medication-management
title: Closed-Loop Medication Management
role: system-of-record
summary: Carries medication from prescription through checking, reconciliation and preparation to documented administration at the
  bedside, with identity checks at every step. It is the authority for what each patient was prescribed and given.
