kind: entity
slug: cross-boundary-agreement
title: Cross-Boundary Agreement
type: governance
summary: An agreement with neighbouring municipalities on water, transit, land or services that cross the city's boundary, sharing
  decisions, costs and maintenance and giving a voice to those who rely on them. Each party's council approves it, and it is kept
  and reviewed by the bodies it names.
