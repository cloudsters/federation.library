loop: _family.participant-to-community
title: Keep the family 'Participant to Community' coherent across its streams
level: steering
class: governance
direction: inward
mode: open
region:
  vsf: participant-to-community
  vs:
  - encounter-to-belonging
  - closeness-to-consent
  - kinship-to-agreement
  - care-to-raising
  - circle-to-reciprocity
  - friction-to-repair
  - difference-to-common-ground
  - voice-to-say
  - gathering-to-ritual
  - grief-to-shared-meaning
stance: Cultivate individual participants into a thriving community. No single stream of this family can see what
  its streams do to one another; this loop is where that becomes visible.
escalates_to: gate
trigger:
  rhythm: each closed season of the family's measures, and each escalation from one of its streams
  events:
  - an operating loop of this family escalated a finding
  - a stream of this family was built into the runtime, adapted there, or left on the shelf
  - a standard the pack declares in manifest.yml changed edition or status
  demand: the family steward asks for a reading before a decision that touches the family
context:
  model:
  - value-model.yml#vsf/participant-to-community
  - value-model.yml#vs/encounter-to-belonging
  - value-model.yml#vs/closeness-to-consent
  - value-model.yml#vs/kinship-to-agreement
  - value-model.yml#vs/care-to-raising
  - value-model.yml#vs/circle-to-reciprocity
  - value-model.yml#vs/friction-to-repair
  - value-model.yml#vs/difference-to-common-ground
  - value-model.yml#vs/voice-to-say
  - value-model.yml#vs/gathering-to-ritual
  - value-model.yml#vs/grief-to-shared-meaning
  registry:
  - instance/registry/5_value-streams/encounter-to-belonging.md
  - instance/registry/5_value-streams/closeness-to-consent.md
  - instance/registry/5_value-streams/kinship-to-agreement.md
  - instance/registry/5_value-streams/care-to-raising.md
  - instance/registry/5_value-streams/circle-to-reciprocity.md
  - instance/registry/5_value-streams/friction-to-repair.md
  - instance/registry/5_value-streams/difference-to-common-ground.md
  - instance/registry/5_value-streams/voice-to-say.md
  - instance/registry/5_value-streams/gathering-to-ritual.md
  - instance/registry/5_value-streams/grief-to-shared-meaning.md
  loop_states:
  - instance/operations/loops/_state/encounter-to-belonging.yml
  - instance/operations/loops/_state/closeness-to-consent.yml
  - instance/operations/loops/_state/kinship-to-agreement.yml
  - instance/operations/loops/_state/care-to-raising.yml
  - instance/operations/loops/_state/circle-to-reciprocity.yml
  - instance/operations/loops/_state/friction-to-repair.yml
  - instance/operations/loops/_state/difference-to-common-ground.yml
  - instance/operations/loops/_state/voice-to-say.yml
  - instance/operations/loops/_state/gathering-to-ritual.yml
  - instance/operations/loops/_state/grief-to-shared-meaning.yml
  measures:
  - belonging-door-held
  - belonging-places-where-known
  - belonging-somewhere-expected
  - belonging-turned-up-again
  - circle-bonds-kept-on-purpose
  - circle-help-both-ways
  - circle-reached-out-first
  - circle-whole-circle-seen
  - common-ground-named
  - common-ground-own-lens-questioned
  - common-ground-pressed-to-change
  - common-ground-understood-before-answering
  - consent-still-myself-in-the-bond
  - consent-terms-said-aloud
  - consent-their-terms-asked
  - consent-unease-named
  - grief-carried-alone
  - grief-loss-witnessed
  - grief-people-told
  - grief-what-it-taught-passed-on
  - kinship-charter-revisited
  - kinship-resentment-after-gathering
  - kinship-rules-talked-through
  - kinship-unspoken-rules-decided
  - raising-agreement-revisited
  - raising-carer-relief-arranged
  - raising-carer-strain-weeks
  - raising-decisions-now-theirs
  - repair-accepted-as-not-mending
  - repair-conflicts-repaired
  - repair-own-part-named
  - repair-same-fight-returning
  - ritual-hosting-shared
  - ritual-recognised-at-the-table
  - ritual-season-returned-to
  - ritual-turning-points-marked
  - voice-held-back-unsafe
  - voice-objections-invited
  - voice-share-in-deciding
  - voice-unwelcome-thing-said
  standards: manifest.yml#standards — edition and status of every source with informs ⊇ [loops]
authority: family-steward
state: instance/operations/loops/_state/_family.participant-to-community.yml
isolation: proposes issues and notes; never commits to main; never overrides an operating loop's finding; never
  writes into the commons layer or a pack
feedback:
- 'a family note to the gate: what the family carries, what it escalates, and what it could not see'
- re-weighted priorities on the family's open issues
- merge proposals where two streams report the same finding
stop:
  iteration: every stream of the region reported as measured, unwatched or unsighted, and every escalation decided
    or passed to the gate
  lifecycle: the family leaves the value model — which the canon rules out — or this life declines the loop
measure:
  deltas:
  - 'silence: an operating loop of the family without a run inside its rhythm'
  - 'convergence: findings from different streams that point at the same element or binding'
  - 'pressure: a measure of the family moving against its target across more than one stream'
  - 'currency: a declared standard superseded, withdrawn or newly binding'
  visibility: each element of the region is recorded as measured, unwatched or unsighted
