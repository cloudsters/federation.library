title: Human Resources Department
summary: Organises the work and learning of the city's staff. It divides tasks between staff and agents with the services, prepares
  staff to oversee agents, consults the staff council, assesses where knowledge rests with one person, captures frontline expertise,
  keeps the knowledge base, supports communities of practice and learning paths, and arranges peer city exchanges and handovers.
