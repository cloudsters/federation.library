kind: capability
slug: intent-signal-sensing
title: Intent Signal Sensing
level: L3
parent: market-and-customer-insight
summary: Detect weak signals in the ecosystem indicating need before the stakeholder formulates a request. Through graph analysis
  of the commons network, intent is sensed — not as surveillance but as the system’s way of anticipating what its participants will
  need next. The intent signal makes the inquiry entity perspectively obsolete.
