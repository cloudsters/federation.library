slug: local-hiring-agreement
title: Local Hiring Agreement
type: governance
summary: The commitment in a city contract, capital project or development agreement to hire residents, with its targets, the groups
  it names and how it is reported. The council sets its terms and the department that holds the contract keeps it, and it is used
  to direct outreach and job matching and to report the hires made.
