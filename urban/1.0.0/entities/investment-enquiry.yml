kind: entity
slug: investment-enquiry
title: Investment Enquiry
type: transactional
summary: An enquiry from an enterprise, an institution or a diaspora investor about settling or investing in the city, with what was
  asked and answered. The one point of contact records it, and it is used to answer with facts on sites, skills, permits and costs,
  to match sites and to open a support case or an investment agreement.
