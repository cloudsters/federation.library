summary: 'Engage with the platform economy without importing its governance assumptions or creating structural dependency.
  Commons and platforms go on existing side by side, and a commons that depends on platform infrastructure for core
  operations has imported the platform''s governance without noticing. Design for coexistence, not purity.'
