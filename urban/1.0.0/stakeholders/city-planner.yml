kind: stakeholder
slug: city-planner
title: City Planner
nature: person
stance: serving
summary: A planner of the municipality who prepares the spatial plan, land-use rules and district plans with residents. City planners
  map land and growth, design options and follow where growth actually happens.
seeks:
- A clear mandate from the council, sound data on land, growth and hazards, and residents who take part early enough to shape the
  plan.
brings:
- Maps, options and draft rules that make the costs and effects of growth visible, and the skill to work a plan out with those it
  affects.
represented_by:
- planning-department
