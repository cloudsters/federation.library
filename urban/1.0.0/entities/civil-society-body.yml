title: Civil-Society Body
type: master
summary: An association, cooperative, charity or other civil-society body active in the city, with its purpose, members, those it
  serves and its relationship with the city. The organisation describes itself and the city records it in its civil-society directory,
  and it is used to consult, fund and partner with it on published terms.
