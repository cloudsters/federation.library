kind: entity
slug: audit-finding
title: Audit Finding
type: transactional
summary: A finding of an internal audit, a resident inspection, a compliance test or an emergency exercise, with its evidence, the
  answer it receives and the action it requires. The body that raised it records it, the administration answers it publicly within
  a set time, and it is followed until it is closed.
