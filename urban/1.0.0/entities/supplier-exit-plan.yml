kind: entity
slug: supplier-exit-plan
title: Supplier Exit Plan
type: governance
summary: The plan by which the city can change the supplier of a system or take the work back into the administration without losing
  its data, code or service, with the formats and rights it needs and the steps and cost of leaving. The department that owns the
  system writes it before purchase and the contract binds the supplier to it, and it is used when a contract ends, a supplier fails
  or the city decides to bring the work back.
