kind: entity
slug: stock-reconciliation
title: Stock Reconciliation
type: transactional
summary: Truth-telling about what we actually have — a formal adjustment of inventory records to match physical reality after counting.
  Unlike a stock entry (which records a known movement), reconciliation is the governance act of correcting accumulated drift between
  system and reality.
attributes:
- name: items
  type: reference(item)
  card: 1..*
- name: locations
  type: reference(location)
  card: 1..*
- name: counted-quantity
  type: quantity
  card: 1..1
- name: system-quantity
  type: quantity
  card: 1..1
- name: variance
  type: quantity
  card: 1..1
- name: explanation
  type: text
  card: 0..1
- name: adjusting-valuation
  type: amount
  card: 0..1
- name: approved-by
  type: reference(employee-record)
  card: 0..1
states:
- counting
- compared
- variance-explained
- approved
- posted
relations:
- type: produces
  target: stock-entry
- type: produces
  target: journal-entry
binds:
- source: src-136
  edition: d24a
  jurisdiction: global
