kind: entity
slug: digital-landscape-report
title: Digital Landscape Report
type: intelligence
summary: The assessment of the maturity, cost and use of the city's digital systems, the residents they serve poorly and where the
  city depends on a single supplier or a single central point. The administration prepares it at the start of each strategy cycle
  and at each yearly review, and it is the starting point for the digital strategy and the roadmap.
