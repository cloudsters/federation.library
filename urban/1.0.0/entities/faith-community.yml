kind: entity
slug: faith-community
title: Faith Community
type: master
summary: A religious congregation or community of belief, with its places of worship, its sacred sites, its members and the community
  work it does. The community describes itself to the city, which keeps the record in its civil-society directory, and it is used
  to invite the community into dialogue, shared-space agreements and partnerships.
