kind: entity
slug: pay-scale
title: Pay Scale
type: governance
summary: The municipality's adopted pay structure, with its grades, the living-cost basis and the grading of each position. The council
  adopts it after negotiation with staff representatives and the personnel function publishes it, and it is used to grade positions,
  to make offers and to run the payroll.
