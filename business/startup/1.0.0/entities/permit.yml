kind: entity
slug: permit
title: Permit
type: governance
summary: An authorisation by a public authority for the enterprise to build, install, operate or trade, such as a building, operating,
  emissions or export licence, with its conditions, validity and inspections.
attributes:
- name: permit-kind
  type: code
  card: 1..1
- name: issuing-authority
  type: reference(counterparty)
  card: 1..1
- name: subject
  type: text
  card: 1..1
- name: facility
  type: reference(facility)
  card: 0..1
- name: conditions
  type: text
  card: 0..1
- name: valid-period
  type: period
  card: 0..1
- name: next-inspection
  type: date
  card: 0..1
states:
- applied-for
- granted
- conditional
- suspended
- revoked
- expired
relations:
- type: governed-by
  target: compliance-rule
- type: refers-to
  target: facility
