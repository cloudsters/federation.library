kind: entity
slug: cluster-agreement
title: Cluster Agreement
type: governance
summary: The agreement among the members of a business network on membership, decisions, shared facilities and the use of a shared
  mark. The members draft and sign it, with the city as one party where it gives space or support, and the network keeps it, so that
  the members run the network and the city does not own it.
