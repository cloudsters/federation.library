kind: entity
slug: physical-activity-profile
title: Physical Activity Profile
type: intelligence
summary: The account of who is physically active and who is not and why, by neighbourhood, age, gender, disability and income, together
  with the facilities within reach of each neighbourhood. The administration prepares it with residents and clubs at a set rhythm,
  and it is used to set the sport and activity plan and to direct programmes to those least active.
