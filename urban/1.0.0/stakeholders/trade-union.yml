kind: stakeholder
slug: trade-union
title: Trade Union
nature: organisation
stance: served
summary: A body that represents workers of a sector in negotiating wages, conditions and transitions with employers and the city.
  Unions speak for contracted workers as well as for the municipality's own staff.
seeks:
- Wage floors that bind every employer, fair work clauses that are audited, and a place at the table when work is phased out.
brings:
- The collective voice of workers, negotiated agreements, members as mentors and knowledge of where conditions fail.
