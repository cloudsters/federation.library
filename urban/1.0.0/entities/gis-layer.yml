kind: entity
slug: gis-layer
title: Spatial Data Layer
type: intelligence
summary: A layer of the city's spatial data, such as land use, vacant land, hazards or infrastructure capacity, with its sources and
  the date it describes. The administration keeps it, together with the layers communities map themselves where they consent, and
  it is used to plan and to monitor the plan.
