kind: entity
slug: statutory-report
title: Statutory Report
type: transactional
summary: A periodic return the organisation must submit to an authority, such as a structural, activity, staffing, case-data
  or financial return, with its recipient, reporting period, deadline, content and acknowledgement. Notifications triggered
  by a single event are regulatory notifications.
