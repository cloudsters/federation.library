kind: entity
slug: commercial-district-agreement
title: Commercial District Agreement
type: governance
summary: The agreement among the traders, property owners and residents of a shopping street or district on the money and work they
  pool for shared spaces and empty shops. The parties sign it, with the city as a party where it gives space or money, and it is used
  to care for shared spaces, fill empty shops with interim uses and keep long-standing businesses in place.
